<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>四維自主學習校園</title>
<meta name="description" content="花蓮縣私立四維高級中學 圖書資訊中心｜在 3D 校園裡走一圈，一站一站學會如何進行自主學習。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- 3D 引擎：three.js（MIT License） -->
<style>
  :root {
    color-scheme: light;
    --ink: #1E293B; --ink2: #334155; --muted: #64748B; --line: #E2E8F0;
    --brand: #15803D; --brand-2: #22C55E; --brand-soft: #F0FDF4;
    --glass: rgba(255,255,255,.88); --shadow: 0 8px 24px rgba(15,23,42,.12);
    --sans: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #CFE6F5; font-family: var(--sans); color: var(--ink); }
  button { font: inherit; cursor: pointer; color: inherit; }
  #scene { position: fixed; inset: 0; touch-action: none; }
  #scene canvas { display: block; width: 100%; height: 100%; outline: none; cursor: grab; }
  #scene canvas:active { cursor: grabbing; }
  .glass { background: var(--glass); border: 1px solid rgba(255,255,255,.9); box-shadow: var(--shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

  /* 標題 */
  .brand { position: fixed; left: 16px; top: 14px; z-index: 20; border-radius: 18px; padding: 12px 18px; display: flex; gap: 12px; align-items: center; max-width: calc(100vw - 32px); }
  .brand .logo { width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(135deg, #16A34A, #0EA5E9); color: #fff; display: grid; place-items: center; font-size: 24px; flex: 0 0 auto; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
  .brand h1 { margin: 0; font-size: clamp(18px, 2.4vw, 26px); font-weight: 900; letter-spacing: 1px; line-height: 1.2; }
  .brand p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .prog { display: inline-flex; align-items: center; gap: 6px; margin-left: 4px; }
  .prog .bar { width: 80px; height: 7px; border-radius: 999px; background: #E2E8F0; overflow: hidden; }
  .prog .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #22C55E, #0EA5E9); transition: width .4s; }

  /* 工具列 */
  .tools { position: fixed; right: 14px; top: 14px; z-index: 20; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 58vw; }
  .tool { height: 42px; min-width: 42px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 700; border: 1px solid rgba(255,255,255,.9); background: var(--glass); box-shadow: var(--shadow); backdrop-filter: blur(10px); }
  .tool:hover { background: #fff; }
  .tool[aria-pressed="true"] { background: #DCFCE7; border-color: #86EFAC; color: #166534; }
  .tool.primary { background: var(--brand); color: #fff; border-color: var(--brand); }

  /* 3D 標籤 */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
  .plabel { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 8px; padding: 5px 14px 5px 5px; border-radius: 999px; pointer-events: auto; border: 0; text-align: left; white-space: nowrap; will-change: transform; }
  .plabel .no { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 900; color: #fff; flex: 0 0 auto; }
  .plabel b { display: block; font-size: 14.5px; line-height: 1.2; }
  .plabel small { display: block; font-size: 11.5px; color: var(--muted); }
  .plabel .no { position: relative; }
  .plabel.done .no::after { content: "✓"; position: absolute; right: -5px; top: -5px; width: 16px; height: 16px; border-radius: 50%; background: #FACC15; color: #713F12; font-size: 10px; display: grid; place-items: center; border: 2px solid #fff; }
  .plabel:hover { background: #fff; }
  .ptag { position: absolute; left: 0; top: 0; font-size: 12px; font-weight: 900; padding: 2px 10px; border-radius: 999px; background: #FACC15; color: #713F12; pointer-events: none; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.15); }

  #near { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); z-index: 25; display: none; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; border-radius: 999px; font-weight: 700; }
  #near.show { display: flex; }
  #near button { border: 0; background: var(--c, #15803D); color: #fff; font-weight: 900; padding: 8px 16px; border-radius: 999px; }
  #near kbd { font-family: var(--sans); background: rgba(255,255,255,.25); border-radius: 6px; padding: 0 6px; margin-left: 4px; font-size: 12px; }

  /* 底部導覽列 */
  #dock { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 20; display: flex; gap: 4px; padding: 8px; border-radius: 22px; max-width: calc(100vw - 24px); overflow-x: auto; scrollbar-width: none; }
  #dock::-webkit-scrollbar { display: none; }
  #dock button { flex: 0 0 auto; width: 84px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; border-radius: 14px; position: relative; }
  #dock button:hover { background: rgba(255,255,255,.8); }
  #dock .ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-size: 24px; position: relative; }
  #dock .ic em { position: absolute; left: -5px; top: -5px; width: 20px; height: 20px; border-radius: 50%; color: #fff; font-style: normal; font-size: 11px; font-weight: 900; display: grid; place-items: center; border: 2px solid #fff; }
  #dock .nm { font-size: 12px; font-weight: 700; color: var(--ink2); white-space: nowrap; }
  #dock .sb { font-size: 10.5px; color: var(--muted); white-space: nowrap; margin-top: -3px; }
  #dock .visited .ic::after { content: "✓"; position: absolute; right: -5px; top: -5px; width: 18px; height: 18px; border-radius: 50%; background: #FACC15; color: #713F12; font-size: 11px; font-weight: 900; display: grid; place-items: center; border: 2px solid #fff; }

  /* 搖桿與視角 */
  #joy { position: fixed; left: 18px; bottom: 18px; z-index: 21; width: 124px; height: 124px; border-radius: 50%; touch-action: none; display: grid; place-items: center; }
  #joy .knob { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(145deg, #fff, #E2E8F0); border: 3px solid #22C55E; box-shadow: 0 4px 10px rgba(0,0,0,.18); display: grid; place-items: center; font-size: 22px; transition: transform .12s ease-out; }
  #joy.active .knob { transition: none; }
  #joy .lb { position: absolute; bottom: 7px; font-size: 11px; color: var(--muted); font-weight: 700; }
  .cam { position: fixed; right: 16px; bottom: 192px; z-index: 20; display: grid; grid-template-columns: repeat(2, 42px); gap: 6px; }
  .cam .tool { padding: 0; width: 42px; font-size: 18px; }
  #mini { position: fixed; right: 16px; bottom: 16px; z-index: 20; border-radius: 18px; padding: 6px; }
  #mini canvas { display: block; width: 210px; height: 164px; border-radius: 12px; cursor: crosshair; }

  #toast { position: fixed; left: 50%; top: 90px; transform: translateX(-50%) translateY(-16px); opacity: 0; z-index: 60; background: #14532D; color: #fff; font-weight: 700; padding: 10px 18px; border-radius: 999px; transition: all .25s; pointer-events: none; box-shadow: var(--shadow); white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 開場 */
  #intro { position: fixed; inset: 0; z-index: 50; display: grid; padding: 16px; background: linear-gradient(180deg, rgba(207,230,245,.35), rgba(15,23,42,.35)); overflow-y: auto; }
  #intro[hidden] { display: none; }
  .intro-card { width: min(760px, 100%); margin: auto; border-radius: 28px; padding: 28px 26px 24px; background: rgba(255,255,255,.96); box-shadow: 0 24px 60px rgba(15,23,42,.3); }
  .intro-card .kicker { display: inline-block; font-size: 12.5px; font-weight: 900; letter-spacing: 2px; color: #15803D; background: #DCFCE7; padding: 3px 12px; border-radius: 999px; }
  .intro-card h2 { font-size: clamp(24px, 4vw, 34px); margin: 10px 0 6px; font-weight: 900; line-height: 1.25; }
  .intro-card .sub { color: var(--muted); margin: 0 0 18px; font-size: 15px; line-height: 1.7; }
  .route { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 8px; margin: 0 0 18px; padding: 0; list-style: none; counter-reset: r; }
  .route li { background: #F8FAFC; border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .route li b { width: 24px; height: 24px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: 12px; flex: 0 0 auto; }
  .setup { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; margin-bottom: 18px; }
  .setup fieldset { border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px 12px; margin: 0; }
  .setup legend { font-size: 13px; font-weight: 900; color: var(--ink2); padding: 0 6px; }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 8px 16px; font-weight: 700; font-size: 15px; }
  .opt[aria-pressed="true"] { border-color: #16A34A; background: #F0FDF4; color: #166534; }
  .sw { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--line); padding: 0; }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 3px #16A34A; }
  .how { font-size: 13px; color: var(--muted); margin: 0 0 18px; line-height: 1.9; }
  .how kbd { font-family: var(--sans); background: #F1F5F9; border: 1px solid #CBD5E1; border-bottom-width: 3px; border-radius: 6px; padding: 0 6px; font-size: 12px; }
  .go-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .go { border: 0; background: #16A34A; color: #fff; font-weight: 900; font-size: 17px; padding: 13px 28px; border-radius: 999px; box-shadow: 0 5px 0 #166534; }
  .go.alt { background: #fff; color: #166534; border: 2px solid #BBF7D0; box-shadow: 0 5px 0 #BBF7D0; }
  .go:active { transform: translateY(3px); box-shadow: 0 2px 0 #166534; }

  /* 站點視窗 */
  dialog#panel { width: min(860px, calc(100vw - 20px)); max-height: calc(100dvh - 24px); padding: 0; border: 0; border-radius: 26px; background: transparent; overflow: visible; }
  dialog#panel::backdrop { background: rgba(15, 23, 42, .4); backdrop-filter: blur(3px); }
  .pc { background: #FCFDFB; border-radius: 26px; box-shadow: 0 24px 60px rgba(0,0,0,.3); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; overflow: hidden; border-top: 8px solid var(--c); }
  .ph { display: flex; align-items: center; gap: 14px; padding: 16px 18px 14px; background: var(--s); }
  .ph .no { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-size: 28px; background: #fff; box-shadow: 0 0 0 2px var(--c); flex: 0 0 auto; }
  .ph small { font-size: 12.5px; color: var(--i); font-weight: 900; letter-spacing: 1px; }
  .ph h2 { margin: 0; font-size: 23px; font-weight: 900; color: var(--ink); line-height: 1.25; }
  .ph .x { margin-left: auto; width: 44px; height: 44px; border-radius: 50%; background: #fff; border: 1px solid var(--line); font-size: 18px; flex: 0 0 auto; }
  .pb { padding: 18px 20px 6px; overflow-y: auto; line-height: 1.75; font-size: 15px; }
  .pf { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; padding: 12px 18px 14px; border-top: 1px solid var(--line); background: #fff; }
  .lead { font-size: 16px; color: var(--ink2); margin: 0 0 14px; }
  .learn { background: var(--s); border-radius: 16px; padding: 10px 14px; margin: 0 0 16px; font-size: 14px; }
  .learn b { color: var(--i); }
  .sec { margin: 0 0 18px; }
  .sec h3 { font-size: 17px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  .sec h3::before { content: ""; width: 6px; height: 20px; border-radius: 3px; background: var(--c); }
  .sec p { margin: 0 0 8px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; font-size: 14px; }
  .tile b { display: block; font-size: 15px; margin-bottom: 2px; }
  .tile .e { font-size: 24px; display: block; margin-bottom: 2px; }
  .flow { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; counter-reset: f; }
  .flow li { counter-increment: f; display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 14.5px; }
  .flow li::before { content: counter(f); width: 28px; height: 28px; border-radius: 50%; background: var(--c); color: #fff; font-weight: 900; display: grid; place-items: center; flex: 0 0 auto; font-size: 13px; }
  .flow li b { display: block; }
  .check { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  .check li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
  .check input { width: 20px; height: 20px; accent-color: var(--c); margin-top: 3px; flex: 0 0 auto; }
  .compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; }
  .compare div { border-radius: 14px; padding: 10px 14px; font-size: 14px; }
  .compare .bad { background: #FEF2F2; border: 1px solid #FECACA; }
  .compare .good { background: #F0FDF4; border: 1px solid #BBF7D0; }
  .note { background: #FFFBEB; border: 1px solid #FDE68A; color: #92400E; border-radius: 14px; padding: 10px 14px; font-size: 13.5px; margin: 0 0 16px; }
  .warn { background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B; border-radius: 14px; padding: 10px 14px; font-size: 14px; margin: 0 0 16px; }
  .btn { border: 0; border-radius: 999px; padding: 10px 20px; font-weight: 900; font-size: 14.5px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
  .btn.main { background: var(--c); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .btn.ghost { background: #fff; border: 1px solid var(--line); color: var(--ink2); }
  .btn.next { background: var(--ink); color: #fff; }
  .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 8px; margin-bottom: 14px; }
  .links a { display: block; text-align: center; text-decoration: none; padding: 9px 6px; border-radius: 12px; font-size: 13.5px; font-weight: 700; border: 1px solid var(--line); background: #fff; color: var(--ink2); }
  .links a:hover { border-color: var(--c); color: var(--i); }
  .cat { font-size: 14.5px; font-weight: 900; margin: 6px 0 6px; color: var(--ink2); }
  .feature { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 10px; margin-bottom: 14px; }
  .feature a { display: flex; gap: 12px; align-items: center; text-decoration: none; background: #fff; border: 2px solid var(--c); border-radius: 16px; padding: 12px 14px; color: var(--ink); }
  .feature a span:first-child { font-size: 28px; }
  .feature b { display: block; font-size: 15px; }
  .feature small { color: var(--muted); font-size: 12.5px; }
  .track { position: relative; display: grid; gap: 0; margin: 4px 0 6px; padding-left: 18px; }
  .track::before { content: ""; position: absolute; left: 30px; top: 16px; bottom: 16px; border-left: 4px dashed #FCA5A5; }
  .track div { position: relative; display: flex; gap: 14px; align-items: flex-start; padding: 6px 0; }
  .track .dot { width: 28px; height: 28px; border-radius: 50%; background: var(--d); color: #fff; font-size: 12px; font-weight: 900; display: grid; place-items: center; flex: 0 0 auto; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--d); z-index: 1; }
  .track .tc { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; flex: 1; font-size: 14px; }
  .track .tc b { display: block; font-size: 15px; }
  .track .tc span { font-size: 12.5px; font-weight: 900; color: var(--d); }
  .faq details { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; }
  .faq summary { font-weight: 700; cursor: pointer; }
  .faq p { margin: 8px 0 0; font-size: 14.5px; color: var(--ink2); }
  .ai { border: 1px dashed #A5B4FC; background: #F8FAFF; border-radius: 16px; padding: 12px 14px; margin: 0 0 16px; }
  .ai h4 { margin: 0 0 4px; font-size: 15px; color: #4338CA; }
  .ai .use { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .prompt { background: #fff; border: 1px solid #E0E7FF; border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 2; white-space: pre-wrap; word-break: break-word; }
  .prompt input { font: inherit; font-size: 13.5px; border: 0; border-bottom: 2px solid #818CF8; background: #EEF2FF; color: #3730A3; font-weight: 700; padding: 1px 6px; border-radius: 6px 6px 0 0; max-width: 100%; min-width: 4em; }
  .prompt input::placeholder { color: #6366F1; opacity: .6; font-weight: 400; }
  .ai .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .ai .copy { background: #4F46E5; color: #fff; }
  .ai .copy.ok { background: #16A34A; }

  #fallback { display: none; position: fixed; inset: 100px 16px 120px; z-index: 5; overflow-y: auto; }
  body.no3d #fallback { display: block; }
  body.no3d #joy, body.no3d #mini, body.no3d .cam, body.no3d [data-3d] { display: none !important; }
  #fallback .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; max-width: 900px; margin: 0 auto; }
  #fallback button { border: 0; border-left: 6px solid var(--c); background: #fff; border-radius: 16px; padding: 14px 16px; font-size: 15px; font-weight: 700; box-shadow: var(--shadow); text-align: left; }
  #fallback p { text-align: center; color: var(--ink2); font-weight: 700; }

  @media (max-width: 760px) {
    .brand { padding: 8px 10px; border-radius: 14px; left: 10px; top: 10px; max-width: calc(100vw - 72px); gap: 8px; }
    .brand .logo { width: 36px; height: 36px; font-size: 18px; border-radius: 10px; }
    .brand h1 { font-size: 17px; }
    .brand p { font-size: 11.5px; }
    .brand .hide-s { display: none; }
    .tools { right: 10px; top: 10px; gap: 6px; flex-direction: column; max-width: none; }
    .tool { height: 40px; width: 40px; min-width: 40px; padding: 0; font-size: 16px; }
    .tool .t { display: none; }
    #mini { display: none; }
    .cam { right: 10px; bottom: 112px; grid-template-columns: 40px; }
    .cam .tool { width: 40px; }
    .cam .hide-s { display: none; }
    #dock { bottom: 8px; padding: 6px; gap: 0; }
    #dock button { width: 66px; }
    #dock .ic { width: 40px; height: 40px; font-size: 20px; border-radius: 12px; }
    #dock .nm { font-size: 11px; }
    #dock .sb { display: none; }
    #joy { left: 10px; bottom: 104px; width: 108px; height: 108px; }
    #near { bottom: 104px; left: auto; right: 60px; transform: none; font-size: 13px; }
    .plabel { padding: 3px 10px 3px 3px; }
    .plabel .no { width: 26px; height: 26px; font-size: 12px; }
    .plabel b { font-size: 12.5px; }
    .plabel small { display: none; }
    .pb { padding: 14px 14px 6px; font-size: 14.5px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="scene" aria-label="3D 校園：拖曳旋轉視角、滾輪或雙指縮放、點地面走過去、點建築進入"></div>
<div id="labels"></div>

<header class="brand glass">
  <span class="logo" aria-hidden="true">🧭</span>
  <div>
    <h1>四維自主學習校園</h1>
    <p><span class="hide-s">走一圈校園，學會自主學習・</span>導覽進度 <span class="prog"><span class="bar"><i id="prog-bar"></i></span><b id="prog-t">0/8</b></span></p>
  </div>
</header>

<nav class="tools" aria-label="工具">
  <button class="tool primary" id="t-auto" title="帶我去下一站">🚶<span class="t">下一站</span></button>
  <button class="tool" id="t-view" aria-pressed="false" title="切換全景／跟隨" data-3d>🗺️<span class="t">全景</span></button>
  <button class="tool" id="t-night" aria-pressed="false" title="白天／夜晚" data-3d>🌙<span class="t">夜晚</span></button>
  <button class="tool" id="t-faq" title="常見問題與聯絡">❓<span class="t">常見問題</span></button>
  <button class="tool" id="t-setup" title="開場說明與角色設定">👤<span class="t">角色</span></button>

</nav>

function facade(o) {
  const fw = o.w, fh = o.floors * o.fh + (o.sign ? 3.2 : 0.8);

      if (!lit && o.balcony) { x.fillStyle = o.band || '#FFFFFF'; x.fillRect(0, y0 + o.fh * sy - 1.1 * sy, W, 1.1 * sy); x.fillStyle = 'rgba(0,0,0,.12)'; x.fillRect(0, y0 + o.fh * sy - 1.1 * sy, W, 2); }

        if (f === 0 && o.door && Math.abs(c - (n - 1) / 2) < 0.6) {

          else { x.fillStyle = '#FFD889'; x.fillRect(wx, y0 + o.fh * 0.15 * sy, ww, o.fh * 0.85 * sy); }
          continue;
        }
        if (lit) { if (Math.random() < 0.75) { x.fillStyle = Math.random() < .5 ? '#FFE3A3' : '#FFF1C9'; x.fillRect(wx, wy, ww, wh); } continue; }

    if (!lit) { x.fillStyle = 'rgba(0,0,0,.08)'; x.fillRect(0, H - 0.5 * sy, W, 0.5 * sy); }

}

function trackTexture() {
  return canvasTex(1600, 800, (x, W, H) => {
    const s = W / 100; // 100 x 50 單位
    x.fillStyle = '#8CC36A'; x.fillRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2, half = 18 * s;
    const lane = (r, col) => { x.beginPath(); x.moveTo(cx - half, cy - r); x.lineTo(cx + half, cy - r); x.arc(cx + half, cy, r, -Math.PI / 2, Math.PI / 2); x.lineTo(cx - half, cy + r); x.arc(cx - half, cy, r, Math.PI / 2, Math.PI * 1.5); x.closePath(); x.fillStyle = col; x.fill(); };

    lane(16 * s, '#5DAA4A');
    // 草皮條紋
    x.save(); lane(16 * s, 'rgba(0,0,0,0)'); x.clip();
    for (let i = -20; i < 20; i++) { x.fillStyle = i % 2 ? '#62B04E' : '#55A043'; x.fillRect(cx + i * 4 * s, 0, 4 * s, H); }
    x.restore();
    x.strokeStyle = '#fff'; x.lineWidth = 3;
    for (let r = 16; r <= 24.01; r += 1.6) { x.beginPath(); x.moveTo(cx - half, cy - r * s); x.lineTo(cx + half, cy - r * s); x.arc(cx + half, cy, r * s, -Math.PI / 2, Math.PI / 2); x.lineTo(cx - half, cy + r * s); x.arc(cx - half, cy, r * s, Math.PI / 2, Math.PI * 1.5); x.stroke(); }
    // 足球場線
    x.lineWidth = 4; x.strokeRect(cx - 26 * s, cy - 12 * s, 52 * s, 24 * s);
    x.beginPath(); x.moveTo(cx, cy - 12 * s); x.lineTo(cx, cy + 12 * s); x.stroke();
    x.beginPath(); x.arc(cx, cy, 4 * s, 0, Math.PI * 2); x.stroke();
    x.strokeRect(cx - 26 * s, cy - 6 * s, 6 * s, 12 * s); x.strokeRect(cx + 20 * s, cy - 6 * s, 6 * s, 12 * s);
    // 起跑線與 18 週標記
    x.fillStyle = '#fff'; x.fillRect(cx - 2, cy + 16 * s, 4, 8 * s);
    x.font = `900 ${Math.round(2.4 * s)}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('START', cx - 6 * s, cy + 20 * s);

  });
}

const shooters = [[-11, -6], [-6, -7], [-8.5, -3]].map(([dx, dz], k) => { const o = student({ gender: k === 1 ? 'girl' : 'boy', skin: SKIN[k], hair: HAIR[k] }); o.position.set(BK.x + dx, 0, BK.z + dz); o.lookAt(hoop.x, 0, hoop.z); scene.add(o); return o; });
let shot = 0;
anim.push((dt, t) => {
  shot = (shot + dt / 2.6) % 3; const who = shooters[Math.floor(shot)], f = shot % 1;
  const hand = new THREE.Vector3(who.position.x, 2.6, who.position.z);
  if (f < 0.35) { const b = f / 0.35; bball.position.set(hand.x + 0.3, 1.1 + Math.abs(Math.sin(b * Math.PI * 3)) * 1.2, hand.z + 0.3); }
  else if (f < 0.75) { const b = (f - 0.35) / 0.4; bball.position.lerpVectors(hand, hoop, b); bball.position.y += Math.sin(b * Math.PI) * 3; }
  else { const b = (f - 0.75) / 0.25; const nx = shooters[(Math.floor(shot) + 1) % 3].position; bball.position.set(THREE.MathUtils.lerp(hoop.x, nx.x, b), 3.85 * (1 - b) + 0.2 + Math.abs(Math.sin(b * Math.PI * 2)) * 1.2 * (1 - b), THREE.MathUtils.lerp(hoop.z, nx.z, b)); }
  shooters.forEach((o, k) => pose(o, false, false, t));
  shooters[Math.floor(shot)].userData.arms.forEach(a => (a.rotation.x = f > 0.3 && f < 0.45 ? -2.6 : -0.6));
});
// 排球
const vball = mesh(new THREE.SphereGeometry(0.2, 14, 12), M(0xFDE047), 0, 2, 0); scene.add(vball);
const vbs = [[-6, -1], [6, 1], [-5, 2.5], [5, -2.5]].map(([dx, dz], k) => { const o = student({ gender: k % 2 ? 'girl' : 'boy', skin: SKIN[k % 3], hair: HAIR[(k + 1) % 3], pony: true }); o.position.set(VB.x + dx, 0, VB.z + dz); o.lookAt(VB.x, 0, o.position.z); scene.add(o); return o; });
let vt = 0;
anim.push((dt, t) => {
  vt = (vt + dt / 1.6) % 4; const i = Math.floor(vt), f = vt % 1; const order = [0, 1, 2, 3], a = vbs[order[i]].position, b = vbs[order[(i + 1) % 4]].position;
  vball.position.set(THREE.MathUtils.lerp(a.x, b.x, f), 2.2 + Math.sin(f * Math.PI) * 4.5, THREE.MathUtils.lerp(a.z, b.z, f));
  vbs.forEach((o, k) => { pose(o, false, false, t); o.userData.arms.forEach(r => (r.rotation.x = k === order[i] && f < 0.2 ? -2.4 : -0.9)); });
});

// ===================== 標籤 =====================
const labels = $('#labels');
const plabels = STATIONS.map(s => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'plabel glass';
  b.innerHTML = `<span class="no" style="background:${s.c}">${s.no}</span><span><b>${s.emoji} ${s.name}</b><small>${s.topic}</small></span>`;
  b.setAttribute('aria-label', `前往第 ${s.no} 站 ${s.name}：${s.topic}`);
  b.addEventListener('click', () => goTo(s.id)); labels.appendChild(b); return { el: b, s };
});
window.__labels = plabels; refreshProgress();
const meTag = document.createElement('div'); meTag.className = 'ptag'; meTag.textContent = '⭐ 你'; labels.appendChild(meTag);

// ===================== 視角（360° 旋轉 + 縮放） =====================
let mode = 'follow';
const cam = { yaw: 0, pitch: 0.62, dist: narrow() ? 46 : 38 };
const over = { yaw: 0.95, pitch: 0.5, dist: narrow() ? 260 : 200 };
const C = () => (mode === 'follow' ? cam : over);
const camTarget = new THREE.Vector3(0, 2, 40);
camera.position.set(80, 120, 220);
function zoom(f) { const c = C(); c.dist = THREE.MathUtils.clamp(c.dist * f, mode === 'follow' ? 10 : 60, mode === 'follow' ? 140 : 420); }
function rotate(a) { C().yaw += a; }
$('#c-in').addEventListener('click', () => zoom(0.8)); $('#c-out').addEventListener('click', () => zoom(1.25));
$('#c-left').addEventListener('click', () => rotate(Math.PI / 4)); $('#c-right').addEventListener('click', () => rotate(-Math.PI / 4));

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const cvs = renderer.domElement;
const ptrs = new Map(); let pinch0 = 0, dragMoved = false, downPos = null;
cvs.addEventListener('pointerdown', e => { cvs.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (ptrs.size === 1) { dragMoved = false; downPos = { x: e.clientX, y: e.clientY }; } if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); dragMoved = true; } });
cvs.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch0) zoom(pinch0 / d); pinch0 = d; return; }
  if (!dragMoved && downPos && Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 6) dragMoved = true;
  if (dragMoved) { const c = C(); c.yaw -= dx * 0.006; c.pitch = THREE.MathUtils.clamp(c.pitch + dy * 0.005, 0.12, 1.45); }
});
const ptrUp = e => {
  if (!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0;
  if (ptrs.size === 0 && !dragMoved && e.type === 'pointerup') clickAt(e.clientX, e.clientY);
};
cvs.addEventListener('pointerup', ptrUp); cvs.addEventListener('pointercancel', ptrUp);
cvs.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY > 0 ? 1.12 : 0.89); }, { passive: false });
const pickables = []; scene.traverse(o => { if (o.isMesh && o.userData.st) pickables.push(o); });
const ground = scene.children.find(o => o.isMesh && o.geometry.parameters && o.geometry.parameters.width === CW);
function clickAt(x, y) {
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  if (hit) return goTo(hit.object.userData.st);
  const gh = ray.intersectObject(ground)[0];
  if (gh) { const p = gh.point; const st = STATIONS.find(s => ['track', 'basket', 'volley'].includes(s.id) && LOC[s.id].pos.distanceTo(new THREE.Vector3(p.x, 0, p.z)) < (s.id === 'track' ? 16 : 9)); if (st) return goTo(st.id); walkTo(p.x, p.z, null); }
}

// ===================== 移動 =====================
const keys = new Set();
addEventListener('keydown', e => {
  if (panel.open || !$('#intro').hidden || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) { keys.add(k); route = []; moveTarget = null; e.preventDefault(); }
  if (k === 'enter' && nearSt) openPanel(nearSt.id);
  if (k === 'q') rotate(0.3); if (k === 'e') rotate(-0.3);
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
const joy = $('#joy'), knob = joy.querySelector('.knob'), joyV = new THREE.Vector2(); let joyId = null;
joy.addEventListener('pointerdown', e => { joyId = e.pointerId; joy.setPointerCapture(e.pointerId); joy.classList.add('active'); route = []; moveTarget = null; joyMove(e); });
joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
const joyEnd = e => { if (e.pointerId !== joyId) return; joyId = null; joyV.set(0, 0); knob.style.transform = ''; joy.classList.remove('active'); };
joy.addEventListener('pointerup', joyEnd); joy.addEventListener('pointercancel', joyEnd);
function joyMove(e) { const r = joy.getBoundingClientRect(), max = r.width * 0.32; let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const d = Math.hypot(dx, dy); if (d > max) { dx *= max / d; dy *= max / d; } knob.style.transform = `translate(${dx}px,${dy}px)`; joyV.set(dx / max, -dy / max); }

const marker = flat(new THREE.RingGeometry(0.9, 1.3, 28), new THREE.MeshBasicMaterial({ color: 0x22C55E, transparent: true, opacity: 0.9 }), 0, 0.1, 0); marker.visible = false; scene.add(marker);
let moveTarget = null, onArrive = null, route = [];
// 走道節點：用來繞過建築
const NODES = [[0, 58], [0, 40], [0, 22], [-18, 22], [18, 22], [-40, 22], [-60, 22], [40, 22], [60, 22], [-18, 2], [18, 2], [-18, 38], [-24, 38], [-22, -24], [-48, -24], [-6, 4], [40, -14], [36, 30], [36, 56], [70, 0], [-70, 0], [-70, -50], [70, 50], [0, -30], [20, -30]].map(([x, z]) => new THREE.Vector2(x, z));
const segBlocked = (a, b) => { for (let t = 0.05; t < 1; t += 0.05) { const x = a.x + (b.x - a.x) * t, z = a.y + (b.y - a.y) * t; if (solids.some(r => x > r.x0 && x < r.x1 && z > r.z0 && z < r.z1)) return true; } return false; };
function findPath(from, to) {
  if (!segBlocked(from, to)) return [to];
  const all = [from, ...NODES, to], n = all.length, dist = Array(n).fill(Infinity), prev = Array(n).fill(-1), done = Array(n).fill(false); dist[0] = 0;
  for (let it = 0; it < n; it++) { let u = -1; for (let i = 0; i < n; i++) if (!done[i] && (u < 0 || dist[i] < dist[u])) u = i; if (u < 0 || dist[u] === Infinity) break; done[u] = true; if (u === n - 1) break;
    for (let v = 0; v < n; v++) if (!done[v] && v !== u) { const d = all[u].distanceTo(all[v]); if (dist[u] + d < dist[v] && !segBlocked(all[u], all[v])) { dist[v] = dist[u] + d; prev[v] = u; } } }
  if (prev[n - 1] < 0) return [to];
  const path = []; for (let v = n - 1; v > 0; v = prev[v]) path.unshift(all[v]); return path;
}
function walkTo(x, z, cb) {
  const p = findPath(new THREE.Vector2(player.position.x, player.position.z), new THREE.Vector2(x, z));
  route = p.map(v => new THREE.Vector3(v.x, 0, v.y)); moveTarget = route.shift(); onArrive = cb;
  marker.position.set(x, 0.1, z); marker.visible = true;
}
goTo = id => {
  const d = LOC[id].door;
  if (player.position.distanceTo(d) < 2.5) return openPanel(id);
  walkTo(d.x, d.z, () => openPanel(id));
  toast(`前往第 ${byId[id].no} 站：${byId[id].name}`);
};
function collide(p) {
  p.x = THREE.MathUtils.clamp(p.x, -CW / 2 + 1.5, CW / 2 - 1.5); p.z = THREE.MathUtils.clamp(p.z, -CD / 2 + 1.5, CD / 2 + 6);
  if (p.z > CD / 2 - 1.5 && Math.abs(p.x) > 8) p.z = CD / 2 - 1.5;
  solids.forEach(r => { if (p.x > r.x0 && p.x < r.x1 && p.z > r.z0 && p.z < r.z1) { const d = [p.x - r.x0, r.x1 - p.x, p.z - r.z0, r.z1 - p.z], m = Math.min(...d); if (m === d[0]) p.x = r.x0; else if (m === d[1]) p.x = r.x1; else if (m === d[2]) p.z = r.z0; else p.z = r.z1; } });
}

// 視角模式
$('#t-view').addEventListener('click', e => { mode = mode === 'follow' ? 'overview' : 'follow'; const b = e.currentTarget; b.setAttribute('aria-pressed', mode === 'overview'); b.innerHTML = mode === 'overview' ? '🚶<span class="t">跟隨</span>' : '🗺️<span class="t">全景</span>'; });
let night = false;
$('#t-night').addEventListener('click', e => {
  night = !night; const b = e.currentTarget; b.setAttribute('aria-pressed', night); b.innerHTML = night ? '☀️<span class="t">白天</span>' : '🌙<span class="t">夜晚</span>';
  paintSky(night); scene.fog.color.set(night ? NIGHT.fog : DAY.fog);
  hemi.intensity = night ? 0.3 : 0.55; hemi.color.set(night ? 0x8EA0E8 : 0xffffff);
  sun.intensity = night ? 0.18 : 0.72; sun.color.set(night ? 0x9FB0FF : 0xFFF3DD);
  winLit.forEach(m => (m.emissiveIntensity = night ? 0.95 : 0)); lampMat.emissiveIntensity = night ? 1.5 : 0.1;
  lampLights.forEach(L => (L.intensity = night ? 1.8 : 0)); stars.material.opacity = night ? 0.9 : 0; cloudMat.opacity = night ? 0.25 : 0.92;
});

// ===================== 平面圖 =====================
const mini = $('#mini-c'), mx = mini.getContext('2d'), MW = mini.width, MH = mini.height, MS = Math.min(MW / (CW + 8), MH / (CD + 8));
const toM = (x, z) => [MW / 2 + x * MS, MH / 2 + z * MS];
function drawMini() {
  mx.fillStyle = night ? '#1E293B' : '#A7D08A'; mx.fillRect(0, 0, MW, MH);
  mx.fillStyle = night ? '#334155' : '#8CC36A'; mx.fillRect(...toM(-CW / 2, -CD / 2), CW * MS, CD * MS);
  mx.fillStyle = '#E7E2D6';
  [[10, 62, 0, 40], [150, 8, 0, 22], [8, 40, -18, 2], [8, 40, 18, 2], [60, 7, -40, -24], [8, 22, -18, 36]].forEach(([w, d, x, z]) => mx.fillRect(...toM(x - w / 2, z - d / 2), w * MS, d * MS));
  mx.fillStyle = '#C6573F'; mx.beginPath(); mx.ellipse(...toM(TR.x, TR.z), 31 * MS, 17.8 * MS, 0, 0, 7); mx.fill();
  mx.fillStyle = '#5DAA4A'; mx.beginPath(); mx.ellipse(...toM(TR.x, TR.z), 25 * MS, 11.8 * MS, 0, 0, 7); mx.fill();
  mx.fillStyle = '#D9824A'; mx.fillRect(...toM(BK.x - 17, BK.z - 14.5), 34 * MS, 29 * MS);
  mx.fillStyle = '#E58C4B'; mx.fillRect(...toM(VB.x - 9, VB.z - 4.5), 18 * MS, 9 * MS);
  mx.fillStyle = '#94A3B8'; solids.forEach(r => mx.fillRect(...toM(r.x0 + 0.8, r.z0 + 0.8), (r.x1 - r.x0 - 1.6) * MS, (r.z1 - r.z0 - 1.6) * MS));
  mx.font = 'bold 18px sans-serif'; mx.textAlign = 'center'; mx.textBaseline = 'middle';
  STATIONS.forEach(s => { const [x, y] = toM(LOC[s.id].pos.x, LOC[s.id].pos.z); mx.fillStyle = s.c; mx.beginPath(); mx.arc(x, y, 13, 0, 7); mx.fill(); mx.strokeStyle = state.visited.includes(s.id) ? '#FACC15' : '#fff'; mx.lineWidth = 3; mx.stroke(); mx.fillStyle = '#fff'; mx.fillText(s.no, x, y + 1); });
  const [px, py] = toM(player.position.x, player.position.z);
  mx.save(); mx.translate(px, py); mx.rotate(-C().yaw); mx.fillStyle = '#FACC15'; mx.strokeStyle = '#1E293B'; mx.lineWidth = 3; mx.beginPath(); mx.moveTo(0, -13); mx.lineTo(9, 9); mx.lineTo(0, 4); mx.lineTo(-9, 9); mx.closePath(); mx.fill(); mx.stroke(); mx.restore();
}
mini.addEventListener('click', e => {
  const r = mini.getBoundingClientRect(); const x = ((e.clientX - r.left) / r.width * MW - MW / 2) / MS, z = ((e.clientY - r.top) / r.height * MH - MH / 2) / MS;
  const st = STATIONS.find(s => LOC[s.id].pos.distanceTo(new THREE.Vector3(x, 0, z)) < 10); if (st) return goTo(st.id);
  walkTo(x, z, null);
});

// ===================== 迴圈 =====================
const clock = new THREE.Clock(); const v3 = new THREE.Vector3();
let nearSt = null, miniTick = 0;
$('#near-go').addEventListener('click', () => nearSt && openPanel(nearSt.id));
function project(p, yOff, el, dy = 0) {
  v3.set(p.x, p.y + yOff, p.z).project(camera);
  if (v3.z > 1 || v3.z < -1 || Math.abs(v3.x) > 1.3 || Math.abs(v3.y) > 1.3) { el.style.display = 'none'; return; }
  el.style.display = ''; el.style.transform = `translate(${(v3.x + 1) / 2 * innerWidth - el.offsetWidth / 2}px, ${(1 - v3.y) / 2 * innerHeight - el.offsetHeight - dy}px)`;
}
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  anim.forEach(f => f(dt, t));
  // 玩家
  const yaw = C().yaw, fwd = new THREE.Vector2(-Math.sin(yaw), -Math.cos(yaw)), right = new THREE.Vector2(Math.cos(yaw), -Math.sin(yaw));
  let ix = joyV.x, iy = joyV.y;
  if (keys.has('w') || keys.has('arrowup')) iy += 1; if (keys.has('s') || keys.has('arrowdown')) iy -= 1;
  if (keys.has('a') || keys.has('arrowleft')) ix -= 1; if (keys.has('d') || keys.has('arrowright')) ix += 1;
  const dir = new THREE.Vector2();
  if (ix || iy) { dir.addScaledVector(fwd, iy).addScaledVector(right, ix); if (dir.length() > 1) dir.normalize(); moveTarget = null; route = []; marker.visible = false; }
  else if (moveTarget) { const dx = moveTarget.x - player.position.x, dz = moveTarget.z - player.position.z, d = Math.hypot(dx, dz);
    if (d < 0.6) { if (route.length) moveTarget = route.shift(); else { moveTarget = null; marker.visible = false; const cb = onArrive; onArrive = null; cb && cb(); } } else dir.set(dx / d, dz / d); }
  const moving = dir.lengthSq() > 1e-4, speed = 15;
  if (moving) { player.position.x += dir.x * speed * dt; player.position.z += dir.y * speed * dt; collide(player.position); const ta = Math.atan2(dir.x, dir.y); let da = ta - player.rotation.y; da = Math.atan2(Math.sin(da), Math.cos(da)); player.rotation.y += da * Math.min(1, dt * 12); }
  pose(player, moving, moving && dir.length() > 0.7, t);
  ring.position.set(player.position.x, 0.08, player.position.z); ring.scale.setScalar(1 + Math.sin(t * 5) * 0.08);
  marker.scale.setScalar(1 + Math.sin(t * 6) * 0.15);
  // NPC
  npcs.forEach(n => {
    const o = n.o;
    if (n.kind === 'run') { n.u = (n.u + n.speed * dt) % 1; const [x, z] = lapPt(n.u, n.lane); const [x2, z2] = lapPt((n.u + 0.002) % 1, n.lane); o.position.set(x, 0, z); o.rotation.y = Math.atan2(x2 - x, z2 - z); pose(o, true, true, t); return; }
    if (!n.target) { n.wait -= dt; if (n.wait <= 0) { const w = WAY[Math.floor(Math.random() * WAY.length)]; n.target = new THREE.Vector2(w[0] + (Math.random() - 0.5) * 4, w[1] + (Math.random() - 0.5) * 4); n.path = findPath(new THREE.Vector2(o.position.x, o.position.z), n.target); } }
    let mv = false;
    if (n.target) { const tg = n.path[0]; const dx = tg.x - o.position.x, dz = tg.y - o.position.z, d = Math.hypot(dx, dz);
      if (d < 0.5) { n.path.shift(); if (!n.path.length) { n.target = null; n.wait = 2 + Math.random() * 5; } }
      else { o.position.x += dx / d * 4 * dt; o.position.z += dz / d * 4 * dt; collide(o.position); o.rotation.y = Math.atan2(dx, dz); mv = true; } }
    pose(o, mv, false, t);
  });
  // 靠近學習站
  let best = null, bd = 7;
  STATIONS.forEach(s => { const d = player.position.distanceTo(LOC[s.id].door); if (d < bd) { bd = d; best = s; } });
  if (best !== nearSt) { nearSt = best; const nb = $('#near'); if (best) { $('#near-t').textContent = `${best.no}. ${best.emoji} ${best.name}・${best.topic}`; nb.style.setProperty('--c', best.c); nb.classList.add('show'); } else nb.classList.remove('show'); }
  // 相機
  const c = C(), k = reduceMotion ? 1 : 1 - Math.exp(-dt * 4);
  const tgt = mode === 'follow' ? v3.set(player.position.x, 3, player.position.z).clone() : new THREE.Vector3(0, 0, 0);
  camTarget.lerp(tgt, k);
  const desired = new THREE.Vector3(camTarget.x + Math.sin(c.yaw) * Math.cos(c.pitch) * c.dist, camTarget.y + Math.sin(c.pitch) * c.dist, camTarget.z + Math.cos(c.yaw) * Math.cos(c.pitch) * c.dist);
  camera.position.lerp(desired, k); camera.lookAt(camTarget);
  renderer.render(scene, camera);
  plabels.forEach(({ el, s }) => project(LOC[s.id].pos, LOC[s.id].h, el));
  project(player.position, 4.2, meTag);
  if ((miniTick = (miniTick + 1) % 3) === 0) drawMini();
  requestAnimationFrame(frame);
}
addEventListener('resize', () => { camera.fov = narrow() ? 58 : 45; camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
requestAnimationFrame(frame);
}
})();
