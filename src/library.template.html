<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWSH 漫讀小島</title>
<meta name="description" content="花蓮縣私立四維高級中學 圖書資訊中心：微縮立體圖書館互動網頁">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #FFFAF0; --ink: #5B4636; --ink2: #8A7260; --line: #F0DFC8;
  --pink: #FF8FB8; --pink2: #FFD6E5; --butter: #FFE07A; --mint: #8EDDC0; --mint2: #D7F5EA;
  --sky: #8FD3FF; --sky2: #DDF1FF; --lav: #BBA8FF; --lav2: #ECE6FF; --peach: #FFB48F;
  --shadow: 0 10px 30px rgba(120, 80, 40, .18); --r: 22px;
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; --round: "Huninn", "Noto Sans TC", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #BFE6FF; color: var(--ink); font-family: var(--font); }
#stage { position: fixed; inset: 0; background: linear-gradient(#7CC8F5, #CDEBFF 55%, #FFF3E2); }
#stage canvas { display: block; touch-action: none; cursor: grab; }
#stage canvas.hover { cursor: pointer; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }

/* ---- 頂部 ---- */
.top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 14px 0; pointer-events: none; z-index: 5; }
.brand { pointer-events: auto; display: flex; align-items: center; gap: 10px; background: var(--cream); border-radius: 999px; padding: 6px 18px 6px 6px; box-shadow: var(--shadow); border: 3px solid #fff; }
.brand .logo { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(from 200deg, var(--pink), var(--butter), var(--mint), var(--sky), var(--lav), var(--pink)); font-size: 22px; box-shadow: inset 0 0 0 4px #fff; }
.brand h1 { margin: 0; font: 400 21px/1.1 var(--round); letter-spacing: .04em; }
.brand small { display: block; font-size: 11.5px; color: var(--ink2); font-weight: 700; letter-spacing: .08em; margin-top: 2px; }
.tools { pointer-events: auto; display: flex; gap: 8px; }
.tbtn { border: 3px solid #fff; background: var(--cream); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 6px; transition: transform .15s; }
.tbtn:hover { transform: translateY(-2px); }
.tbtn.off { opacity: .6; }

/* ---- 場景標籤 ---- */
#pins { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
.pin { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: auto; border: 2px solid #fff; background: rgba(255, 250, 240, .95); border-radius: 999px; padding: 2px 8px 2px 3px; font-weight: 700; font-size: 11px; white-space: nowrap; box-shadow: 0 4px 10px rgba(120, 80, 40, .2); display: flex; align-items: center; gap: 5px; transition: opacity .2s; }
.pin::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 7px; height: 7px; background: inherit; border-right: 2px solid #fff; border-bottom: 2px solid #fff; transform: translateX(-50%) rotate(45deg); }
.pin i { font-style: normal; width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; }
.pin:hover { transform: translate(-50%, -100%) scale(1.06); }
.pin.hide { opacity: 0; pointer-events: none; }
.bubble { position: fixed; z-index: 6; transform: translate(-50%, -100%); background: #fff; border-radius: 18px; padding: 8px 14px; font: 400 17px var(--round); box-shadow: var(--shadow); pointer-events: none; animation: bub .35s cubic-bezier(.3, 1.6, .5, 1); }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; border: 9px solid transparent; border-top-color: #fff; border-bottom: 0; transform: translateX(-50%); }
@keyframes bub { from { transform: translate(-50%, -80%) scale(.4); opacity: 0; } }

/* ---- 底部導覽 ---- */
.dock { position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 2px; padding: 5px 8px; background: rgba(255, 250, 240, .92); border: 3px solid #fff; border-radius: 26px; box-shadow: var(--shadow); max-width: calc(100vw - 20px); overflow-x: auto; scrollbar-width: none; }
.dock::-webkit-scrollbar { display: none; }
.dock button { flex: 0 0 auto; border: 0; background: transparent; border-radius: 14px; padding: 4px 5px 3px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 50px; font-size: 10.5px; font-weight: 700; color: var(--ink2); transition: background .15s, transform .15s; }
.dock button b { font-size: 17px; line-height: 1.15; }
.dock .tb b { font: italic 700 15px/1.2 Georgia, "Times New Roman", serif; color: var(--ink); }
.dock .tb.on { background: var(--butter); color: var(--ink); }
.clockbox { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 2px; flex: 0 0 auto; }
.dock .cface { width: 40px; height: 40px; min-width: 40px; padding: 0; border-radius: 50%; background: radial-gradient(#FFFDF6 58%, #FFEDC2); border: 3px solid #F2C14E; position: relative; box-shadow: 0 3px 0 #E5B23C; }
.dock .cface:hover { transform: none; background: radial-gradient(#FFFDF6 58%, #FFE29A); }
.cface i { position: absolute; left: 50%; bottom: 50%; border-radius: 3px; transform-origin: 50% 100%; }
.cface .hh { width: 3px; height: 9px; margin-left: -1.5px; background: #5B4636; } .cface .mm { width: 2px; height: 13px; margin-left: -1px; background: #E0679A; }
.dock .cface.paused { border-color: #BBA8FF; box-shadow: 0 3px 0 #9C86E8; }
.cface::after { content: ""; position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: #5B4636; }
.ctxt { width: 84px; flex: 0 0 84px; overflow: hidden; }
.ctxt small { display: block; overflow: hidden; text-overflow: ellipsis; font-size: 9.5px; color: var(--ink2); font-weight: 700; letter-spacing: .06em; white-space: nowrap; }
.ctxt b { display: block; font-variant-numeric: tabular-nums lining-nums; font-feature-settings: "tnum" 1, "lnum" 1; font: 800 20px/1.05 var(--font); letter-spacing: .02em; color: var(--ink); }
.dsep { width: 1px; align-self: stretch; margin: 6px 4px; background: var(--line); flex: 0 0 auto; }
#flash { position: fixed; inset: 0; background: #F4F8FF; opacity: 0; pointer-events: none; z-index: 2; }
.dock button:hover { background: var(--pink2); color: var(--ink); transform: translateY(-3px); }
.hint { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 4; background: rgba(91, 70, 54, .82); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; transition: opacity .6s; pointer-events: none; }
.toast { position: fixed; left: 50%; top: calc(84px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 50; background: var(--ink); color: #fff; border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: 14px; box-shadow: var(--shadow); animation: bub .3s; max-width: 92vw; text-align: center; }

/* ---- 載入 ---- */
#loading { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: linear-gradient(#9AD6FA, #FFF3E2); transition: opacity .7s; }
#loading .card { text-align: center; }
#loading .logo { width: 96px; height: 96px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; font-size: 46px; background: conic-gradient(from 200deg, var(--pink), var(--butter), var(--mint), var(--sky), var(--lav), var(--pink)); box-shadow: inset 0 0 0 8px #fff, var(--shadow); animation: spin 3s linear infinite; }
#loading h2 { font: 400 28px var(--round); margin: 0 0 6px; }
#loading p { margin: 0; color: var(--ink2); font-weight: 700; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- 彈窗 ---- */
dialog#dlg { border: 0; padding: 0; background: transparent; width: min(640px, 94vw); max-height: 88vh; overflow: visible; color: var(--ink); }
dialog#dlg::backdrop { background: rgba(70, 50, 40, .35); backdrop-filter: blur(3px); }
dialog#dlg[open] { animation: pop .38s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes pop { from { transform: translateY(30px) scale(.9); opacity: 0; } }
.sheet { background: var(--cream); border: 4px solid #fff; border-radius: 30px; box-shadow: 0 24px 60px rgba(80, 50, 30, .35); overflow: hidden; display: flex; flex-direction: column; max-height: 88vh; }
.sh-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px 14px; background: var(--hc, var(--pink2)); position: relative; }
.sh-head .av { width: 62px; height: 62px; border-radius: 50%; border: 4px solid #fff; background: #fff center/cover; flex: 0 0 auto; display: grid; place-items: center; font-size: 30px; box-shadow: 0 6px 14px rgba(0, 0, 0, .1); }
.sh-head .tag { display: inline-block; font-size: 12px; font-weight: 900; background: #fff; border-radius: 999px; padding: 2px 10px; letter-spacing: .05em; }
.sh-head h2 { margin: 4px 0 0; font: 400 24px/1.2 var(--round); }
.sh-head .x { position: absolute; right: 12px; top: 12px; width: 38px; height: 38px; border-radius: 50%; border: 3px solid #fff; background: rgba(255, 255, 255, .7); font-size: 18px; font-weight: 900; }
.say { margin: 0 18px; transform: translateY(-8px); background: #fff; border-radius: 16px; padding: 9px 14px; font-size: 14.5px; font-weight: 500; box-shadow: 0 6px 14px rgba(120, 80, 40, .1); position: relative; }
.say::before { content: ""; position: absolute; left: 30px; top: -8px; border: 8px solid transparent; border-bottom-color: #fff; border-top: 0; }
.sh-body { padding: 4px 18px 20px; overflow-y: auto; }
.sec { margin: 14px 0 0; }
.sec h3 { margin: 0 0 8px; font: 400 18px var(--round); display: flex; align-items: center; gap: 8px; }
.demo { font: 700 11px var(--font); background: var(--butter); border-radius: 999px; padding: 2px 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.card { background: #fff; border-radius: 18px; padding: 12px 14px; border: 2px solid var(--line); text-decoration: none; display: block; transition: transform .15s, box-shadow .15s; }
a.card:hover, button.card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(120, 80, 40, .12); }
.card .ic { font-size: 24px; }
.card b { display: block; font-size: 15px; margin: 4px 0 2px; }
.card span { font-size: 12.5px; color: var(--ink2); line-height: 1.45; display: block; }
button.card { text-align: left; width: 100%; font: inherit; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 11px 20px; font-weight: 900; font-size: 15px; background: var(--pink); color: #fff; text-decoration: none; box-shadow: 0 5px 0 #E0679A; transition: transform .1s, box-shadow .1s; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #E0679A; }
.btn.alt { background: var(--mint); box-shadow: 0 5px 0 #5FBD9C; color: #2F5E4E; }
.btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 5px 0 var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
table.hours { width: 100%; border-collapse: separate; border-spacing: 0 5px; font-size: 14.5px; }
table.hours td { background: #fff; padding: 8px 12px; }
table.hours td:first-child { border-radius: 12px 0 0 12px; font-weight: 700; width: 38%; }
table.hours td:last-child { border-radius: 0 12px 12px 0; }
table.hours tr.today td { background: var(--butter); }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 900; border-radius: 999px; padding: 4px 12px; background: var(--mint2); color: #2F7A5E; }
.status.closed { background: #F3E6E6; color: #A65B5B; }
.status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
ol.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
ol.rank li { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 14px; padding: 8px 12px; }
ol.rank .m { font-size: 22px; width: 30px; text-align: center; font-weight: 900; color: var(--ink2); }
ol.rank .t { flex: 1; } ol.rank .t b { display: block; } ol.rank .t small { color: var(--ink2); }
ol.rank a { font-size: 12.5px; font-weight: 700; background: var(--sky2); border-radius: 999px; padding: 4px 10px; text-decoration: none; white-space: nowrap; }
.search { display: flex; gap: 8px; background: #fff; border-radius: 20px; padding: 8px; border: 3px solid var(--sky); }
.search select, .search input { border: 0; font: inherit; font-size: 16px; background: transparent; color: var(--ink); outline: none; }
.search select { font-weight: 700; padding: 0 4px; border-right: 2px dashed var(--line); }
.search input { flex: 1; min-width: 0; padding: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 13.5px; font-weight: 700; }
.chip:hover { background: var(--sky2); }
.quiz .q { font: 400 19px var(--round); margin: 6px 0 12px; }
.quiz .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.quiz .opts button { border: 3px solid #fff; background: #fff; border-radius: 18px; padding: 14px 10px; font-weight: 700; font-size: 15px; box-shadow: 0 4px 0 var(--line); }
.quiz .opts button:hover { background: var(--pink2); }
.dots { display: flex; gap: 6px; } .dots i { width: 26px; height: 7px; border-radius: 9px; background: var(--line); } .dots i.on { background: var(--pink); }
.book { display: flex; gap: 10px; align-items: center; background: #fff; border-radius: 16px; padding: 10px; }
.book .cv { width: 44px; height: 60px; border-radius: 6px 10px 10px 6px; flex: 0 0 auto; box-shadow: inset 5px 0 0 rgba(0, 0, 0, .1); display: grid; place-items: center; font-size: 20px; }
.book b { display: block; font-size: 15px; } .book small { color: var(--ink2); display: block; }
.nb { display: grid; gap: 10px; }
.nbk { display: flex; gap: 12px; background: #fff; border-radius: 18px; padding: 12px; border: 2px solid var(--line); }
.nbk .cv { width: 62px; height: 86px; border-radius: 6px 12px 12px 6px; flex: 0 0 auto; box-shadow: inset 6px 0 0 rgba(0, 0, 0, .1); display: grid; place-items: center; font-size: 28px; }
.nbk b { font-size: 16px; } .nbk dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 6px 0; font-size: 13px; }
.nbk dt { font-weight: 900; color: var(--ink2); } .nbk dd { margin: 0; } .nbk p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--ink); }
.posters { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.sheet.xmas { background: linear-gradient(#FFFDF7, #FFF4F0); }
.sheet.xmas .sh-head { background: repeating-linear-gradient(135deg, #D94B4B 0 18px, #E25E5E 18px 36px); color: #fff; }
.sheet.xmas .sh-head h2 { color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .15); } .sheet.xmas .sh-head .tag { color: #2E7D4F; }
.sheet.xmas .sh-head::after { content: "🎄 🎁 ⭐ 🔔 🎄"; position: absolute; right: 64px; bottom: 6px; font-size: 18px; letter-spacing: 4px; }
.sheet.xmas .sec h3 { color: #B23A3A; } .sheet.xmas .book, .sheet.xmas .nbk { border: 2px solid #F2C2C2; box-shadow: 0 0 0 3px #fff, 0 6px 16px -8px rgba(178, 58, 58, .35); }
.sheet.xmas .nbk { background: linear-gradient(#FFFFFF, #FFF8F2); }
.snow { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; border-radius: inherit; } .snow i { position: absolute; top: -20px; color: #fff; text-shadow: 0 0 4px rgba(180, 200, 230, .9); font-style: normal; animation: snowfall linear infinite; }
@keyframes snowfall { to { transform: translateY(95vh) rotate(200deg); } }
.pview { position: absolute; inset: 0; z-index: 5; background: rgba(40, 30, 25, .9); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px; border-radius: inherit; cursor: zoom-out; }
.pview img { max-width: 100%; max-height: calc(100% - 50px); border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); } .pview p { color: #fff; font-weight: 900; margin: 10px 0 0; text-align: center; }
.pview button { position: absolute; right: 14px; top: 14px; width: 38px; height: 38px; border-radius: 50%; border: 0; font-weight: 900; }
.sheet { position: relative; } button.poster { font: inherit; color: inherit; width: 100%; cursor: zoom-in; }
.poster { display: block; background: #fff; border-radius: 18px; padding: 10px; border: 2px solid var(--line); text-decoration: none; text-align: center; }
.poster img { width: 100%; border-radius: 10px; display: block; }
.poster.empty div { aspect-ratio: 3/4; border-radius: 10px; border: 3px dashed var(--line); display: grid; place-items: center; font-weight: 900; color: var(--ink2); font-size: 15px; line-height: 2; }
.poster b { display: block; margin-top: 8px; font-size: 14.5px; }
.timeline { display: grid; gap: 9px; }
.timeline .st { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: start; background: #fff; border-radius: 18px; padding: 10px 12px; }
.timeline .st .n { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 24px; }
.timeline .st b { display: block; font-size: 15.5px; } .timeline .st small { color: var(--ink2); font-weight: 700; } .timeline .st p { margin: 3px 0 0; font-size: 13.5px; line-height: 1.55; }
.wall { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.wall a { aspect-ratio: 3/4; border-radius: 10px; border: 5px solid #fff; box-shadow: 0 6px 14px rgba(120, 80, 40, .14); display: grid; place-items: center; text-decoration: none; text-align: center; font-weight: 700; font-size: 13px; padding: 6px; }
.wall a span { display: block; font-size: 26px; }
.radio { background: linear-gradient(#FFB48F, #FF9A78); border-radius: 26px; padding: 14px; box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .08); color: #5B3324; }
.radio .scr { background: #FFF6DA; border-radius: 16px; padding: 10px 14px; box-shadow: inset 0 3px 0 rgba(0, 0, 0, .08); }
.radio .scr b { display: block; font-size: 16px; } .radio .scr small { font-weight: 700; opacity: .75; }
.radio .ctl { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.radio .play { width: 54px; height: 54px; border-radius: 50%; border: 4px solid #fff; background: #FFE07A; font-size: 22px; flex: 0 0 auto; box-shadow: 0 4px 0 rgba(0, 0, 0, .12); }
.radio .bar { flex: 1; height: 10px; border-radius: 9px; background: rgba(255, 255, 255, .55); overflow: hidden; cursor: pointer; }
.radio .bar i { display: block; height: 100%; width: 0; background: #FFF6DA; }
.radio .tm { font-weight: 900; font-size: 13px; min-width: 74px; text-align: center; }
.radio .eq { display: flex; gap: 3px; align-items: flex-end; height: 22px; } .radio .eq i { width: 4px; background: #FFF6DA; border-radius: 3px; height: 30%; }
.radio.on .eq i { animation: eq .8s ease-in-out infinite alternate; } .radio .eq i:nth-child(2) { animation-delay: .2s; } .radio .eq i:nth-child(3) { animation-delay: .4s; } .radio .eq i:nth-child(4) { animation-delay: .1s; }
@keyframes eq { to { height: 100%; } }
.eps { display: grid; gap: 7px; } .eps button { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 9px 12px; text-align: left; font-weight: 700; display: flex; gap: 10px; align-items: center; }
.eps button.on { border-color: var(--peach); background: #FFF1E8; }
details.script { background: #fff; border-radius: 14px; padding: 10px 14px; } details.script summary { font-weight: 900; cursor: pointer; } details.script p { margin: 8px 0 0; line-height: 1.7; font-size: 14px; }
.quote { background: #fff; border-left: 6px solid var(--peach); border-radius: 12px; padding: 10px 14px; font: 400 16px/1.6 var(--round); }
.quote small { display: block; font: 700 12.5px var(--font); color: var(--ink2); margin-top: 4px; }
.mark { text-align: center; } .mark img { width: min(190px, 48%); border-radius: 18px; box-shadow: 0 14px 30px rgba(120, 80, 40, .25); -webkit-touch-callout: default; user-select: auto; }
.mark .jie { margin: 12px auto 4px; max-width: 420px; text-align: left; background: #FFF8E6; border: 2px dashed #F3C77A; border-radius: 16px; padding: 12px 14px; line-height: 1.6; } .mark .jie b { display: block; color: var(--ink); font-size: 16px; } .mark .jie small { display: block; color: var(--ink2); font-weight: 700; margin-bottom: 6px; } .mark .jie span { display: block; font-size: 15px; font-weight: 700; color: #8A5A2B; }
.mark p { font-size: 13px; color: var(--ink2); font-weight: 700; }
.foot { margin-top: 16px; font-size: 12.5px; color: var(--ink2); text-align: center; line-height: 1.6; }
.res .card { display: flex; gap: 10px; align-items: flex-start; } .res .card .ic { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex: 0 0 auto; }
.nogl { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 30px; font-weight: 700; }

@media (max-width: 640px) {
  .brand { padding-right: 12px; } .brand .logo { width: 38px; height: 38px; font-size: 18px; }
  .brand h1 { font-size: 17px; } .brand small { font-size: 10px; letter-spacing: 0; } .brand small b { display: none; }
  .tbtn { padding: 7px 10px; font-size: 13px; } .tbtn span { display: none; }
  .pin { font-size: 10px; padding: 2px 3px; } .pin .lt { display: none; } .pin i { width: 15px; height: 15px; font-size: 9px; }

  {"q": "仁者愛人，有禮者敬人。", "s": "《孟子．離婁下》", "b": "孟子", "e": "有仁心的人愛護別人，有禮貌的人尊敬別人。"},
  {"q": "不以規矩，不能成方圓。", "s": "《孟子．離婁上》", "b": "孟子", "e": "沒有圓規和曲尺畫不出方圓，做事也要遵守規則和方法。"},
  {"q": "生，亦我所欲也；義，亦我所欲也。二者不可得兼，舍生而取義者也。", "s": "《孟子．告子上》", "b": "孟子", "e": "面臨兩難時，要選擇更有價值、更正確的那一邊。"},
  {"q": "窮則獨善其身，達則兼善天下。", "s": "《孟子．盡心上》", "b": "孟子", "e": "不得志時就修養自己，得志時就去幫助更多人。"},
  {"q": "人皆可以為堯舜。", "s": "《孟子．告子下》", "b": "孟子", "e": "每個人都有成為好人、偉人的可能，關鍵在於肯不肯努力。"},
  {"q": "惻隱之心，人皆有之。", "s": "《孟子．告子上》", "b": "孟子", "e": "看到別人受苦會難過，這份善心每個人都有。"},
  {"q": "自暴者，不可與有言也；自棄者，不可與有為也。", "s": "《孟子．離婁上》", "b": "孟子", "e": "放棄自己的人，別人也很難幫他。永遠不要放棄自己。"},
  {"q": "有為者辟若掘井，掘井九軔而不及泉，猶為棄井也。", "s": "《孟子．盡心上》", "b": "孟子", "e": "挖井挖了很深卻沒挖到水就放棄，等於白挖。做事要堅持到底。"},
  {"q": "吾善養吾浩然之氣。", "s": "《孟子．公孫丑上》", "b": "孟子", "e": "培養正直剛強的氣度，就能堂堂正正、無所畏懼。"},
  {"q": "心之官則思，思則得之，不思則不得也。", "s": "《孟子．告子上》", "b": "孟子", "e": "心是用來思考的，肯思考才會有收穫。"},
  {"q": "人有不為也，而後可以有為。", "s": "《孟子．離婁下》", "b": "孟子", "e": "懂得有些事不做，才能專心做真正重要的事。"},
  {"q": "雖千萬人，吾往矣。", "s": "《孟子．公孫丑上》", "b": "孟子", "e": "只要自己是對的，就算面對千萬人，也要勇往直前。"},
  {"q": "人之患在好為人師。", "s": "《孟子．離婁上》", "b": "孟子", "e": "人的毛病是喜歡當別人的老師。保持謙虛，才能一直學習。"},
  {"q": "獨樂樂，與人樂樂，孰樂？", "s": "《孟子．梁惠王下》", "b": "孟子", "e": "一個人快樂，和大家一起快樂，哪個更快樂？分享讓快樂加倍。"},
  {"q": "民為貴，社稷次之，君為輕。", "s": "《孟子．盡心下》", "b": "孟子", "e": "人民最重要，國家其次，君主最輕，這是孟子的民本思想。"},
  {"q": "權，然後知輕重；度，然後知長短。", "s": "《孟子．梁惠王上》", "b": "孟子", "e": "秤過才知道輕重，量過才知道長短。做決定前先好好衡量。"},
  {"q": "一日暴之，十日寒之，未有能生者也。", "s": "《孟子．告子上》", "b": "孟子", "e": "曬一天又冷十天，植物不可能長好。學習要持之以恆，不能三分鐘熱度。"},
  {"q": "學問之道無他，求其放心而已矣。", "s": "《孟子．告子上》", "b": "孟子", "e": "學習的方法沒有別的，就是把散漫的心收回來，專心而已。"},
  {"q": "千里之行，始於足下。", "s": "《老子》第六十四章", "b": "老子", "e": "再遠的路，也要從腳下第一步開始。現在就跨出去吧！"},
  {"q": "合抱之木，生於毫末；九層之臺，起於累土。", "s": "《老子》第六十四章", "b": "老子", "e": "大樹由小芽長成，高臺由一筐筐土堆起。成就都從小事累積。"},
  {"q": "知人者智，自知者明。", "s": "《老子》第三十三章", "b": "老子", "e": "了解別人是聰明，了解自己才是真正的明智。"},
  {"q": "勝人者有力，自勝者強。", "s": "《老子》第三十三章", "b": "老子", "e": "打贏別人只是有力氣，戰勝自己的懶惰和恐懼，才是真正的強大。"},
  {"q": "知足者富。", "s": "《老子》第三十三章", "b": "老子", "e": "懂得知足的人，就是最富有的人。"},
  {"q": "上善若水。", "s": "《老子》第八章", "b": "老子", "e": "最好的品德像水一樣，滋潤萬物卻不爭功。"},
  {"q": "天下難事，必作於易；天下大事，必作於細。", "s": "《老子》第六十三章", "b": "老子", "e": "難事要從容易的部分做起，大事要從細節做起。"},
  {"q": "大器晚成。", "s": "《老子》第四十一章", "b": "老子", "e": "了不起的人才，常常需要比較長的時間培養，別急著跟別人比。"},
  {"q": "禍兮福之所倚，福兮禍之所伏。", "s": "《老子》第五十八章", "b": "老子", "e": "壞事裡可能藏著好事，好事裡也可能藏著危機。順境逆境都要保持平常心。"},
  {"q": "信言不美，美言不信。", "s": "《老子》第八十一章", "b": "老子", "e": "真話不一定好聽，好聽的話不一定是真的。"},
  {"q": "知者不言，言者不知。", "s": "《老子》第五十六章", "b": "老子", "e": "真正懂的人往往不多說，愛說大話的人不一定真懂。"},
  {"q": "天下莫柔弱於水，而攻堅強者莫之能勝。", "s": "《老子》第七十八章", "b": "老子", "e": "水最柔軟，卻能穿透堅石。溫柔而持久的力量最強大。"},
  {"q": "慎終如始，則無敗事。", "s": "《老子》第六十四章", "b": "老子", "e": "做到最後也像剛開始一樣謹慎，就不會失敗。"},
  {"q": "少則得，多則惑。", "s": "《老子》第二十二章", "b": "老子", "e": "專注在少數重要的事，反而收穫更多；貪多就會迷惑。"},
  {"q": "大音希聲，大象無形。", "s": "《老子》第四十一章", "b": "老子", "e": "最偉大的聲音聽起來很安靜，最大的形象看不見邊際。"},
  {"q": "為學日益，為道日損。", "s": "《老子》第四十八章", "b": "老子", "e": "學知識要一天天增加，修養心性則要一天天減少欲望。"},
  {"q": "夫唯不爭，故天下莫能與之爭。", "s": "《老子》第二十二章", "b": "老子", "e": "不和別人爭，反而沒有人能勝過你。"},
  {"q": "輕諾必寡信。", "s": "《老子》第六十三章", "b": "老子", "e": "隨便答應別人的人，往往做不到。承諾前要想清楚。"},
  {"q": "見素抱樸，少私寡欲。", "s": "《老子》第十九章", "b": "老子", "e": "保持單純樸實，減少私心和欲望，心就會輕鬆。"},
  {"q": "知止不殆，可以長久。", "s": "《老子》第四十四章", "b": "老子", "e": "懂得適可而止，就不會遇到危險，才能長長久久。"},
  {"q": "天網恢恢，疏而不失。", "s": "《老子》第七十三章", "b": "老子", "e": "天理像一張大網，看起來稀疏，做壞事終究逃不掉。"},
  {"q": "企者不立，跨者不行。", "s": "《老子》第二十四章", "b": "老子", "e": "踮著腳站不穩，大步跨也走不遠。做事不能急躁。"},
  {"q": "治大國，若烹小鮮。", "s": "《老子》第六十章", "b": "老子", "e": "治理大事要像煎小魚一樣，不要一直亂翻，要有耐心。"},
  {"q": "道可道，非常道。", "s": "《老子》第一章", "b": "老子", "e": "說得出來的道理，未必是永恆的大道。世界比文字更寬廣。"},
  {"q": "吾生也有涯，而知也無涯。", "s": "《莊子．養生主》", "b": "莊子", "e": "人生有限，知識無限。要懂得選擇真正重要的事去學。"},
  {"q": "君子之交淡若水，小人之交甘若醴。", "s": "《莊子．山木》", "b": "莊子", "e": "君子的友情像水一樣清淡卻長久，靠利益維繫的友情雖甜卻容易變質。"},
  {"q": "井蛙不可以語於海者，拘於虛也。", "s": "《莊子．秋水》", "b": "莊子", "e": "井底之蛙沒辦法想像大海。多讀書、多出去看看，視野才會開闊。"},
  {"q": "北冥有魚，其名為鯤。", "s": "《莊子．逍遙遊》", "b": "莊子", "e": "大魚能化成大鵬鳥飛向天際，讓你的想像力和夢想也自由飛翔吧！"},
  {"q": "鵬之徙於南冥也，水擊三千里，摶扶搖而上者九萬里。", "s": "《莊子．逍遙遊》", "b": "莊子", "e": "大鵬鳥乘著旋風飛上九萬里高空。心懷遠大志向，就能飛得又高又遠。"},
  {"q": "天地與我並生，而萬物與我為一。", "s": "《莊子．齊物論》", "b": "莊子", "e": "人和大自然是一體的，尊重萬物也就是尊重自己。"},
  {"q": "子非魚，安知魚之樂？", "s": "《莊子．秋水》", "b": "莊子", "e": "你不是魚，怎麼知道魚快不快樂？不要用自己的想法去判斷別人的感受。"},
  {"q": "水之積也不厚，則其負大舟也無力。", "s": "《莊子．逍遙遊》", "b": "莊子", "e": "水不夠深就浮不起大船。實力要累積得夠深厚，才能承擔大任。"},
  {"q": "人皆知有用之用，而莫知無用之用也。", "s": "《莊子．人間世》", "b": "莊子", "e": "大家只看見有用的東西，卻不知道看似無用的事物，也許有更大的價值。"},
  {"q": "相濡以沫，不如相忘於江湖。", "s": "《莊子．大宗師》", "b": "莊子", "e": "與其在困境中互相用口水濕潤彼此，不如各自在廣闊的天地裡自由生活。"},
  {"q": "人生天地之間，若白駒之過郤，忽然而已。", "s": "《莊子．知北遊》", "b": "莊子", "e": "人生就像白馬跑過門縫一樣快，要珍惜每一天。"},
  {"q": "哀莫大於心死。", "s": "《莊子．田子方》", "b": "莊子", "e": "最大的悲哀是對一切失去熱情。無論如何都要保有希望。"},
  {"q": "不積跬步，無以至千里。", "s": "《荀子．勸學》", "b": "荀子", "e": "不累積一步一步，就走不到千里遠。每天的小進步都很重要。"},
  {"q": "不積小流，無以成江海。", "s": "《荀子．勸學》", "b": "荀子", "e": "小溪匯聚才能變成江海。別小看每天一點點的努力。"},
  {"q": "青，取之於藍，而青於藍。", "s": "《荀子．勸學》", "b": "荀子", "e": "青色從藍草提煉，卻比藍草更青。學生只要努力，也能超越老師。"},
  {"q": "鍥而舍之，朽木不折；鍥而不舍，金石可鏤。", "s": "《荀子．勸學》", "b": "荀子", "e": "刻一刻就放棄，爛木頭也刻不斷；持續不停，連金石都能雕刻。"},
  {"q": "學不可以已。", "s": "《荀子．勸學》", "b": "荀子", "e": "學習永遠不能停止，活到老學到老。"},
  {"q": "吾嘗終日而思矣，不如須臾之所學也。", "s": "《荀子．勸學》", "b": "荀子", "e": "整天空想，不如花一點點時間認真學習。"},
  {"q": "君子博學而日參省乎己，則知明而行無過矣。", "s": "《荀子．勸學》", "b": "荀子", "e": "廣泛學習、每天反省自己，就能明白事理、少犯錯。"},
  {"q": "蓬生麻中，不扶而直。", "s": "《荀子．勸學》", "b": "荀子", "e": "蓬草長在挺直的麻田裡，不用扶也會長直。好環境和好朋友讓人變得更好。"},
  {"q": "騏驥一躍，不能十步；駑馬十駕，功在不舍。", "s": "《荀子．勸學》", "b": "荀子", "e": "千里馬一跳也跳不了十步；慢的馬不停地走，也能走得很遠。成功在於堅持。"},
  {"q": "積土成山，風雨興焉；積水成淵，蛟龍生焉。", "s": "《荀子．勸學》", "b": "荀子", "e": "土堆成山就會興起風雨，水積成深潭就會有蛟龍。持續累積，就會產生驚人的力量。"},
  {"q": "道雖邇，不行不至；事雖小，不為不成。", "s": "《荀子．修身》", "b": "荀子", "e": "路再近，不走就到不了；事再小，不做就不會完成。"},
  {"q": "非我而當者，吾師也。", "s": "《荀子．修身》", "b": "荀子", "e": "指出我的錯誤又說得對的人，就是我的老師。"},
  {"q": "目不能兩視而明，耳不能兩聽而聰。", "s": "《荀子．勸學》", "b": "荀子", "e": "眼睛不能同時看兩樣東西，一心不能二用。專心才能做好。"},
  {"q": "天行有常，不為堯存，不為桀亡。", "s": "《荀子．天論》", "b": "荀子", "e": "大自然有它的規律，不會因為人而改變。要學會尊重和認識自然。"},
  {"q": "博學之，審問之，慎思之，明辨之，篤行之。", "s": "《中庸》", "b": "四書", "e": "廣泛學習、仔細發問、謹慎思考、清楚分辨、確實去做，這是學習的五個步驟。"},
  {"q": "凡事豫則立，不豫則廢。", "s": "《中庸》", "b": "四書", "e": "事前有準備就能成功，沒準備就容易失敗。"},
  {"q": "人一能之，己百之；人十能之，己千之。", "s": "《中庸》", "b": "四書", "e": "別人做一次就會，我就做一百次；勤能補拙，努力一定看得見。"},
  {"q": "君子慎其獨也。", "s": "《中庸》", "b": "四書", "e": "沒人看見的時候也守規矩，這才是真正的品德。"},
  {"q": "好學近乎知，力行近乎仁，知恥近乎勇。", "s": "《中庸》", "b": "四書", "e": "愛學習接近智慧，努力實踐接近仁德，知道羞恥接近勇敢。"},
  {"q": "苟日新，日日新，又日新。", "s": "《大學》", "b": "四書", "e": "每天都要讓自己有一點點新的進步，日日更新。"},
  {"q": "知止而后有定，定而后能靜。", "s": "《大學》", "b": "四書", "e": "知道目標在哪裡，心就能安定；心安定了，才能靜下來好好思考。"},
  {"q": "物有本末，事有終始。知所先後，則近道矣。", "s": "《大學》", "b": "四書", "e": "事情有輕重先後，分清楚順序，做事就有方向。"},
  {"q": "心不在焉，視而不見，聽而不聞，食而不知其味。", "s": "《大學》", "b": "四書", "e": "心不專注的時候，看了等於沒看，聽了等於沒聽。"},
  {"q": "修身、齊家、治國、平天下。", "s": "《大學》", "b": "四書", "e": "先把自己修養好，才能照顧家庭，進而影響社會和世界。"},
  {"q": "玉不琢，不成器；人不學，不知道。", "s": "《禮記．學記》", "b": "禮記", "e": "再好的玉也要雕琢才能成器，人要學習才能明白道理。"},
  {"q": "學然後知不足，教然後知困。", "s": "《禮記．學記》", "b": "禮記", "e": "越學越知道自己的不足；教別人時，才知道自己哪裡還不懂。"},
  {"q": "教學相長。", "s": "《禮記．學記》", "b": "禮記", "e": "教和學是互相幫助的，教別人也會讓自己進步。"},
  {"q": "獨學而無友，則孤陋而寡聞。", "s": "《禮記．學記》", "b": "禮記", "e": "自己一個人學習、沒有朋友切磋，見識就會狹窄。"},
  {"q": "大道之行也，天下為公。", "s": "《禮記．禮運》", "b": "禮記", "e": "理想的世界，是大家共有、共享、互相照顧的。"},
  {"q": "敖不可長，欲不可從，志不可滿，樂不可極。", "s": "《禮記．曲禮》", "b": "禮記", "e": "驕傲不可滋長，欲望不可放縱，志得不可自滿，享樂不可過度。"},
  {"q": "禮尚往來。", "s": "《禮記．曲禮》", "b": "禮記", "e": "人和人之間要互相尊重、互相回應，關係才會長久。"},
  {"q": "天行健，君子以自強不息。", "s": "《易經．乾卦》", "b": "易經", "e": "天體運行永不停止，君子也要不斷努力、自我要求。"},
  {"q": "地勢坤，君子以厚德載物。", "s": "《易經．坤卦》", "b": "易經", "e": "大地寬厚，能承載萬物。做人也要有寬厚的胸懷。"},
  {"q": "二人同心，其利斷金。", "s": "《易經．繫辭上》", "b": "易經", "e": "兩個人同心協力，力量大到能切斷金屬。團結就是力量！"},
  {"q": "窮則變，變則通，通則久。", "s": "《易經．繫辭下》", "b": "易經", "e": "遇到困境要懂得改變，改變就能找到出路，找到出路就能長久。"},
  {"q": "積善之家，必有餘慶。", "s": "《易經．坤卦．文言》", "b": "易經", "e": "常做好事的家庭，福氣會綿延下去。"},
  {"q": "君子藏器於身，待時而動。", "s": "《易經．繫辭下》", "b": "易經", "e": "平時充實自己的能力，等待適當的時機再發揮。"},
  {"q": "方以類聚，物以群分。", "s": "《易經．繫辭上》", "b": "易經", "e": "志趣相同的人會聚在一起，選擇朋友也是選擇自己的方向。"},
  {"q": "同聲相應，同氣相求。", "s": "《易經．乾卦．文言》", "b": "易經", "e": "想法相同的人會互相吸引、互相回應。"},
  {"q": "他山之石，可以攻玉。", "s": "《詩經．小雅．鶴鳴》", "b": "詩經", "e": "別座山上的石頭可以用來琢磨玉石。別人的長處，也能幫助自己進步。"},
  {"q": "如切如磋，如琢如磨。", "s": "《詩經．衛風．淇奧》", "b": "詩經", "e": "學問和品德要像雕琢玉石一樣，一次次切磋琢磨、精益求精。"},
  {"q": "投我以木桃，報之以瓊瑤。", "s": "《詩經．衛風．木瓜》", "b": "詩經", "e": "別人送我一顆桃子，我回贈美玉。別人對你的好，要用心回報。"},
  {"q": "靡不有初，鮮克有終。", "s": "《詩經．大雅．蕩》", "b": "詩經", "e": "事情大多有好的開始，卻很少能堅持到最後。堅持才是最難的。"},
  {"q": "高山仰止，景行行止。", "s": "《詩經．小雅．車舝》", "b": "詩經", "e": "仰望高山般的品德，跟隨光明的大道前進。"},
  {"q": "關關雎鳩，在河之洲。", "s": "《詩經．周南．關雎》", "b": "詩經", "e": "《詩經》第一篇，用水鳥和鳴寫出美好的思慕之情。"},
  {"q": "執子之手，與子偕老。", "s": "《詩經．邶風．擊鼓》", "b": "詩經", "e": "牽著你的手一起走到老，象徵忠誠不變的承諾。"},
  {"q": "桃之夭夭，灼灼其華。", "s": "《詩經．周南．桃夭》", "b": "詩經", "e": "桃花盛開、鮮豔燦爛，就像青春一樣美好。"},
  {"q": "蒹葭蒼蒼，白露為霜。", "s": "《詩經．秦風．蒹葭》", "b": "詩經", "e": "追尋心中的理想，就像追尋河對岸的人，雖然遙遠，仍不放棄。"},
  {"q": "知我者，謂我心憂；不知我者，謂我何求。", "s": "《詩經．王風．黍離》", "b": "詩經", "e": "懂你的人知道你心裡的憂愁，不懂的人只會問你在追求什麼。"},
  {"q": "燕雀安知鴻鵠之志哉！", "s": "《史記．陳涉世家》", "b": "史記", "e": "小鳥哪懂天鵝的遠大志向？不要因為別人不懂，就放棄你的夢想。"},
  {"q": "桃李不言，下自成蹊。", "s": "《史記．李將軍列傳》", "b": "史記", "e": "桃李不說話，樹下卻自然被踩出小路。真誠的人不用自誇，自然受人喜愛。"},
  {"q": "人固有一死，或重於泰山，或輕於鴻毛。", "s": "司馬遷〈報任少卿書〉", "b": "史記", "e": "人都會死，但人生的價值，在於活得有沒有意義。"},
  {"q": "千人之諾諾，不如一士之諤諤。", "s": "《史記．商君列傳》", "b": "史記", "e": "一千個人附和，不如一個人說真話。敢說真話很可貴。"},
  {"q": "運籌帷幄之中，決勝千里之外。", "s": "《史記．高祖本紀》", "b": "史記", "e": "在帳幕裡做好規劃，就能在千里外打勝仗。好的計畫是成功的關鍵。"},
  {"q": "智者千慮，必有一失；愚者千慮，必有一得。", "s": "《史記．淮陰侯列傳》", "b": "史記", "e": "聰明人也會犯錯，平凡人也會有好點子。要虛心聽取每個人的意見。"},
  {"q": "多行不義必自斃。", "s": "《左傳．隱公元年》", "b": "左傳", "e": "常做壞事的人，終究會害了自己。"},
  {"q": "居安思危，思則有備，有備無患。", "s": "《左傳．襄公十一年》", "b": "左傳", "e": "平安時也要想到危險，想到了就會準備，有準備就不怕。"},
  {"q": "一鼓作氣，再而衰，三而竭。", "s": "《左傳．莊公十年》", "b": "左傳", "e": "第一次擊鼓士氣最旺，再來就衰退了。做事要趁著一開始的熱情一口氣完成。"},
  {"q": "人誰無過？過而能改，善莫大焉。", "s": "《左傳．宣公二年》", "b": "左傳", "e": "誰都會犯錯，犯錯後能改正，就是最好的事。"},
  {"q": "前事之不忘，後事之師。", "s": "《戰國策．趙策》", "b": "戰國策", "e": "記住過去的經驗，可以作為以後做事的借鏡。"},
  {"q": "亡羊而補牢，未為遲也。", "s": "《戰國策．楚策》", "b": "戰國策", "e": "羊跑了再修羊圈，也還不算太晚。出了錯趕快補救就好。"},
  {"q": "行百里者半九十。", "s": "《戰國策．秦策》", "b": "戰國策", "e": "走一百里路，走了九十里才算一半。越接近終點，越要堅持下去。"},
  {"q": "士為知己者死。", "s": "《戰國策．趙策》", "b": "戰國策", "e": "人願意為了真正了解、賞識自己的人全力付出。"},
  {"q": "讀書百遍，而義自見。", "s": "《三國志．魏書》裴松之注（董遇語）", "b": "三國志", "e": "書讀很多遍，意思自然就懂了。不懂的書，就多讀幾遍吧！"},
  {"q": "非淡泊無以明志，非寧靜無以致遠。", "s": "諸葛亮〈誡子書〉", "b": "諸葛亮集", "e": "不追求名利才能看清志向，內心平靜才能走得遠。"},
  {"q": "夫學須靜也，才須學也。", "s": "諸葛亮〈誡子書〉", "b": "諸葛亮集", "e": "學習需要靜下心來，才能則要靠學習得來。"},
  {"q": "鞠躬盡瘁，死而後已。", "s": "諸葛亮〈後出師表〉", "b": "諸葛亮集", "e": "盡心盡力地付出，一直到最後一刻。"},
  {"q": "勿以惡小而為之，勿以善小而不為。", "s": "《三國志．蜀書》裴松之注（劉備遺詔）", "b": "三國志", "e": "不要因為是小壞事就去做，不要因為是小善事就不做。"},
  {"q": "有志者事竟成也。", "s": "《後漢書．耿弇傳》", "b": "後漢書", "e": "有志向又肯堅持的人，事情終究會成功。"},
  {"q": "失之東隅，收之桑榆。", "s": "《後漢書．馮異傳》", "b": "後漢書", "e": "早上失去的，傍晚可能又得到了。一時的失敗，不代表永遠的失敗。"},
  {"q": "疾風知勁草。", "s": "《後漢書．王霸傳》", "b": "後漢書", "e": "強風吹來，才知道哪棵草最堅韌。困難時，才看得出一個人的真本事。"},
  {"q": "不入虎穴，焉得虎子。", "s": "《後漢書．班超傳》", "b": "後漢書", "e": "不敢冒險，就得不到成果。勇敢嘗試，才有機會成功。"},
  {"q": "精誠所至，金石為開。", "s": "《後漢書．廣陵思王荊傳》", "b": "後漢書", "e": "真心誠意到了極點，連金石都能打開。用心就能感動別人。"},
  {"q": "少壯不努力，老大徒傷悲。", "s": "漢樂府〈長歌行〉", "b": "樂府詩選", "e": "年輕時不努力，老了只能空傷心。趁現在好好加油！"},
  {"q": "百川東到海，何時復西歸？", "s": "漢樂府〈長歌行〉", "b": "樂府詩選", "e": "河水向東流進大海，什麼時候會倒流回來？時間也一去不回。"},
  {"q": "盛年不重來，一日難再晨。", "s": "陶淵明〈雜詩〉", "b": "陶淵明集", "e": "青春不會重來，一天也不會有兩個早晨。"},
  {"q": "及時當勉勵，歲月不待人。", "s": "陶淵明〈雜詩〉", "b": "陶淵明集", "e": "要及時努力，時間不會等人。"},
  {"q": "採菊東籬下，悠然見南山。", "s": "陶淵明〈飲酒〉", "b": "陶淵明集", "e": "在籬笆邊採菊花，悠閒地看見南山。心境放鬆，處處都是美景。"},
  {"q": "好讀書，不求甚解；每有會意，便欣然忘食。", "s": "陶淵明〈五柳先生傳〉", "b": "陶淵明集", "e": "享受讀書的樂趣，每次讀懂一點，就開心得忘了吃飯。"},
  {"q": "落紅不是無情物，化作春泥更護花。", "s": "龔自珍〈己亥雜詩〉", "b": "龔自珍詩選", "e": "落花不是無情的，化成春泥滋養新的花朵。默默奉獻也是一種美。"},
  {"q": "苟利國家生死以，豈因禍福避趨之。", "s": "林則徐〈赴戍登程口占示家人〉", "b": "林則徐詩文選", "e": "只要對國家有利，就算犧牲生命也願意，不因個人得失而逃避。"},
  {"q": "讀萬卷書，行萬里路。", "s": "董其昌《畫禪室隨筆》", "b": "畫禪室隨筆", "e": "多讀書，也要多出去看看世界，知識和經驗缺一不可。"},
  {"q": "一寸光陰一寸金，寸金難買寸光陰。", "s": "《增廣賢文》", "b": "增廣賢文", "e": "時間和黃金一樣珍貴，而且再多的錢也買不回時間。"},
  {"q": "莫等閒，白了少年頭，空悲切。", "s": "岳飛〈滿江紅〉", "b": "宋詞三百首", "e": "不要虛度光陰，等到頭髮白了才後悔就來不及了。"},
  {"q": "黑髮不知勤學早，白首方悔讀書遲。", "s": "顏真卿〈勸學〉", "b": "唐詩選", "e": "年輕時不知道早點努力，老了才後悔讀書太晚。"},
  {"q": "三更燈火五更雞，正是男兒讀書時。", "s": "顏真卿〈勸學〉", "b": "唐詩選", "e": "深夜的燈火、清晨的雞啼，都是讀書的好時光。"},
  {"q": "少年易老學難成，一寸光陰不可輕。", "s": "朱熹〈偶成〉", "b": "宋詩選", "e": "年輕很快就過去，學問卻不容易學成，每分每秒都要珍惜。"},
  {"q": "紙上得來終覺淺，絕知此事要躬行。", "s": "陸游〈冬夜讀書示子聿〉", "b": "陸游詩選", "e": "書本上學到的終究比較淺，要真正懂，一定要親身去做。"},
  {"q": "古人學問無遺力，少壯工夫老始成。", "s": "陸游〈冬夜讀書示子聿〉", "b": "陸游詩選", "e": "古人做學問用盡全力，年輕時下的功夫，到老才有成就。"},
  {"q": "問渠那得清如許？為有源頭活水來。", "s": "朱熹〈觀書有感〉", "b": "宋詩選", "e": "池塘為什麼這麼清澈？因為有源源不斷的活水。持續讀書，心就會清明。"},
  {"q": "半畝方塘一鑑開，天光雲影共徘徊。", "s": "朱熹〈觀書有感〉", "b": "宋詩選", "e": "小小方塘像鏡子一樣，映照天光雲影。讀書讓心像清澈的水塘。"},
  {"q": "粉骨碎身渾不怕，要留清白在人間。", "s": "于謙〈石灰吟〉", "b": "于謙詩選", "e": "就算粉身碎骨也不怕，只要能留下清白的品格。"},
  {"q": "千錘萬鑿出深山，烈火焚燒若等閒。", "s": "于謙〈石灰吟〉", "b": "于謙詩選", "e": "石灰石經過千錘萬鑿、烈火焚燒也不在乎。越經磨練，越能成材。"},
  {"q": "咬定青山不放鬆，立根原在破巖中。", "s": "鄭燮〈竹石〉", "b": "鄭板橋集", "e": "竹子緊緊抓住青山，根長在破裂的岩石中。目標確定，就不怕環境艱難。"},
  {"q": "千磨萬擊還堅勁，任爾東西南北風。", "s": "鄭燮〈竹石〉", "b": "鄭板橋集", "e": "經過千萬次磨練依然堅強，任憑四面八方的風怎麼吹都不動搖。"},
  {"q": "人生自古誰無死，留取丹心照汗青。", "s": "文天祥〈過零丁洋〉", "b": "文天祥詩選", "e": "人都會死，但要留下一顆赤誠的心，照耀史冊。"},
  {"q": "先天下之憂而憂，後天下之樂而樂。", "s": "范仲淹〈岳陽樓記〉", "b": "古文觀止", "e": "比別人先憂慮天下的事，等大家都快樂了自己才快樂。"},
  {"q": "不以物喜，不以己悲。", "s": "范仲淹〈岳陽樓記〉", "b": "古文觀止", "e": "不因外在的好壞而大喜，也不因個人得失而大悲，保持穩定的心。"},
  {"q": "醉翁之意不在酒，在乎山水之間也。", "s": "歐陽修〈醉翁亭記〉", "b": "古文觀止", "e": "醉翁真正喜歡的不是酒，而是山水的美景。真正的心意常不在表面。"},
  {"q": "出淤泥而不染，濯清漣而不妖。", "s": "周敦頤〈愛蓮說〉", "b": "古文觀止", "e": "蓮花長在泥裡卻不被弄髒。身處不好的環境，也能保持純潔的心。"},
  {"q": "師者，所以傳道、受業、解惑也。", "s": "韓愈〈師說〉", "b": "古文觀止", "e": "老師的責任是傳授道理、教授學業、解答疑惑。有問題就勇敢去問吧！"},
  {"q": "聞道有先後，術業有專攻。", "s": "韓愈〈師說〉", "b": "古文觀止", "e": "每個人懂的先後不同、專長也不同，向懂的人學習一點也不丟臉。"},
  {"q": "弟子不必不如師，師不必賢於弟子。", "s": "韓愈〈師說〉", "b": "古文觀止", "e": "學生不一定比不上老師，老師也不一定什麼都比學生強。"},
  {"q": "業精於勤，荒於嬉；行成於思，毀於隨。", "s": "韓愈〈進學解〉", "b": "韓愈文選", "e": "學業因勤奮而精進，因貪玩而荒廢；做事因思考而成功，因隨便而失敗。"},
  {"q": "世有伯樂，然後有千里馬。", "s": "韓愈〈雜說四〉", "b": "韓愈文選", "e": "有懂得欣賞的伯樂，千里馬才會被發現。也要學著當別人的伯樂喔。"},
  {"q": "山不在高，有仙則名；水不在深，有龍則靈。", "s": "劉禹錫〈陋室銘〉", "b": "古文觀止", "e": "山不在高、水不在深，重要的是內涵。人也是一樣。"},
  {"q": "斯是陋室，惟吾德馨。", "s": "劉禹錫〈陋室銘〉", "b": "古文觀止", "e": "房子雖然簡陋，但主人品德高尚，就讓它充滿光彩。"},
  {"q": "以銅為鏡，可以正衣冠；以人為鏡，可以明得失。", "s": "《新唐書．魏徵傳》（唐太宗語）", "b": "貞觀政要", "e": "照鏡子能整理衣帽；把別人當鏡子，能看清自己的優缺點。"},
  {"q": "兼聽則明，偏信則暗。", "s": "《資治通鑑．唐紀》（魏徵語）", "b": "資治通鑑", "e": "多聽各方意見就能明白真相，只聽一方就會糊塗。"},
  {"q": "不畏浮雲遮望眼，自緣身在最高層。", "s": "王安石〈登飛來峰〉", "b": "宋詩選", "e": "不怕浮雲遮住視線，因為我站在最高處。眼界高，就不會被小事迷惑。"},
  {"q": "春風又綠江南岸，明月何時照我還。", "s": "王安石〈泊船瓜洲〉", "b": "宋詩選", "e": "一個「綠」字讓春天活了起來，也帶出了濃濃的思鄉之情。"},
  {"q": "橫看成嶺側成峰，遠近高低各不同。", "s": "蘇軾〈題西林壁〉", "b": "蘇東坡傳", "e": "從不同角度看廬山，樣子都不一樣。換個角度看事情，會有新發現。"},
  {"q": "不識廬山真面目，只緣身在此山中。", "s": "蘇軾〈題西林壁〉", "b": "蘇東坡傳", "e": "看不清廬山的真面目，是因為自己就在山裡。跳出來看，才看得清楚。"},
  {"q": "人有悲歡離合，月有陰晴圓缺。", "s": "蘇軾〈水調歌頭〉", "b": "東坡詞", "e": "人生有悲有喜，就像月亮有圓有缺，這是自然的事。"},
  {"q": "但願人長久，千里共嬋娟。", "s": "蘇軾〈水調歌頭〉", "b": "東坡詞", "e": "只希望親友平安長久，即使相隔千里，也能一起欣賞同一個月亮。"},
  {"q": "竹杖芒鞋輕勝馬，誰怕？一蓑煙雨任平生。", "s": "蘇軾〈定風波〉", "b": "蘇東坡傳", "e": "拄著竹杖、穿著草鞋也很輕快，風雨又怕什麼？用豁達的心面對人生。"},
  {"q": "腹有詩書氣自華。", "s": "蘇軾〈和董傳留別〉", "b": "蘇軾詩選", "e": "肚子裡有學問，氣質自然就會散發光彩。讀書是最好的保養品！"},
  {"q": "大江東去，浪淘盡，千古風流人物。", "s": "蘇軾〈念奴嬌．赤壁懷古〉", "b": "東坡詞", "e": "長江滾滾東流，千古英雄都被浪花淘盡。把握當下才最重要。"},
  {"q": "竹外桃花三兩枝，春江水暖鴨先知。", "s": "蘇軾〈惠崇春江晚景〉", "b": "蘇軾詩選", "e": "江水變暖，鴨子最先知道。細心觀察，就能最先感受到變化。"},
  {"q": "博觀而約取，厚積而薄發。", "s": "蘇軾〈稼說送張琥〉", "b": "蘇東坡傳", "e": "廣泛閱讀、精挑細選，累積得夠深厚，才能一次發揮出來。"},
  {"q": "古之立大事者，不惟有超世之才，亦必有堅忍不拔之志。", "s": "蘇軾〈晁錯論〉", "b": "古文觀止", "e": "成大事的人，不只要有才能，更要有堅持到底的意志。"},
  {"q": "一年好景君須記，最是橙黃橘綠時。", "s": "蘇軾〈贈劉景文〉", "b": "蘇軾詩選", "e": "一年中最美的時候，是橙黃橘綠的秋冬。人生每個階段都有好風景。"},
  {"q": "欲把西湖比西子，淡妝濃抹總相宜。", "s": "蘇軾〈飲湖上初晴後雨〉", "b": "蘇軾詩選", "e": "西湖像美人西施，不管淡妝濃妝都好看。真正的美怎麼樣都動人。"},
  {"q": "春宵一刻值千金。", "s": "蘇軾〈春宵〉", "b": "蘇軾詩選", "e": "春天夜晚的美好時光，每一刻都價值千金，要好好珍惜。"},
  {"q": "尋尋覓覓，冷冷清清，淒淒慘慘戚戚。", "s": "李清照〈聲聲慢〉", "b": "李清照詞集", "e": "連用疊字，寫出心裡深深的孤單與愁緒。"},
  {"q": "生當作人傑，死亦為鬼雄。", "s": "李清照〈夏日絕句〉", "b": "李清照詞集", "e": "活著要做人中豪傑，死了也要做英雄。人生要有骨氣。"},
  {"q": "莫道不消魂，簾捲西風，人比黃花瘦。", "s": "李清照〈醉花陰〉", "b": "李清照詞集", "e": "別說不傷心，西風吹起簾子，人比菊花還要消瘦。思念讓人憔悴。"},
  {"q": "興盡晚回舟，誤入藕花深處。", "s": "李清照〈如夢令〉", "b": "李清照詞集", "e": "玩到盡興才划船回家，卻不小心划進荷花深處。年少的快樂時光真美好。"},
  {"q": "知否？知否？應是綠肥紅瘦。", "s": "李清照〈如夢令〉", "b": "李清照詞集", "e": "你知道嗎？雨後應該是綠葉茂盛、紅花凋零了。細心感受季節的變化。"},
  {"q": "眾裡尋他千百度，驀然回首，那人卻在燈火闌珊處。", "s": "辛棄疾〈青玉案．元夕〉", "b": "稼軒詞", "e": "在人群中找了千百回，一回頭，答案卻在不經意的地方。努力之後，驚喜就會出現。"},
  {"q": "少年不識愁滋味，愛上層樓。", "s": "辛棄疾〈醜奴兒〉", "b": "稼軒詞", "e": "年少時不懂真正的憂愁，卻愛登高說愁。長大後才明白人生的滋味。"},
  {"q": "青山遮不住，畢竟東流去。", "s": "辛棄疾〈菩薩蠻〉", "b": "稼軒詞", "e": "青山擋不住江水東流。該前進的力量，什麼都擋不住。"},
  {"q": "落霞與孤鶩齊飛，秋水共長天一色。", "s": "王勃〈滕王閣序〉", "b": "古文觀止", "e": "晚霞和野鴨一起飛，秋水和天空連成一色，是千古寫景名句。"},
  {"q": "老當益壯，寧移白首之心；窮且益堅，不墜青雲之志。", "s": "王勃〈滕王閣序〉", "b": "古文觀止", "e": "年紀越大越要有志氣，處境越艱難越要堅定，不放棄遠大的理想。"},
  {"q": "衣帶漸寬終不悔，為伊消得人憔悴。", "s": "柳永〈蝶戀花〉", "b": "宋詞三百首", "e": "為了心中的目標，就算消瘦憔悴也不後悔。這是堅持到底的精神。"},
  {"q": "昨夜西風凋碧樹，獨上高樓，望盡天涯路。", "s": "晏殊〈蝶戀花〉", "b": "宋詞三百首", "e": "獨自登上高樓，望向遠方的路。立志時要站得高、看得遠。"},
  {"q": "無可奈何花落去，似曾相識燕歸來。", "s": "晏殊〈浣溪沙〉", "b": "宋詞三百首", "e": "花落了無可奈何，燕子卻又飛回來。有失去，也會有新的到來。"},
  {"q": "兩情若是久長時，又豈在朝朝暮暮。", "s": "秦觀〈鵲橋仙〉", "b": "宋詞三百首", "e": "真正長久的感情，不在於每天都在一起。"},
  {"q": "問君能有幾多愁？恰似一江春水向東流。", "s": "李煜〈虞美人〉", "b": "南唐二主詞", "e": "你有多少愁？就像一江春水滔滔東流，沒有盡頭。"},
  {"q": "剪不斷，理還亂，是離愁。", "s": "李煜〈相見歡〉", "b": "南唐二主詞", "e": "剪也剪不斷、理也理不清的，就是離別的愁緒。"},
  {"q": "林花謝了春紅，太匆匆。", "s": "李煜〈相見歡〉", "b": "南唐二主詞", "e": "林中春花凋謝得太匆忙。美好的事物總是短暫，要好好珍惜。"},
  {"q": "枯藤老樹昏鴉，小橋流水人家。", "s": "馬致遠〈天淨沙．秋思〉", "b": "元曲選", "e": "只用幾個畫面，就寫出秋天黃昏的蕭瑟與鄉愁。"},
  {"q": "夕陽西下，斷腸人在天涯。", "s": "馬致遠〈天淨沙．秋思〉", "b": "元曲選", "e": "夕陽西下時，遠在天涯的遊子最想家。"},
  {"q": "興，百姓苦；亡，百姓苦。", "s": "張養浩〈山坡羊．潼關懷古〉", "b": "元曲選", "e": "國家興盛或滅亡，受苦的總是老百姓。"},
  {"q": "問世間，情是何物，直教生死相許？", "s": "元好問〈摸魚兒〉", "b": "元好問詩詞集", "e": "世間的情究竟是什麼，能讓人生死相隨？"},
  {"q": "滾滾長江東逝水，浪花淘盡英雄。", "s": "楊慎〈臨江仙〉", "b": "三國演義", "e": "長江滾滾東流，英雄都被浪花淘盡。"},
  {"q": "是非成敗轉頭空，青山依舊在，幾度夕陽紅。", "s": "楊慎〈臨江仙〉", "b": "三國演義", "e": "是非成敗轉眼成空，只有青山和夕陽依舊。不必太計較一時得失。"},
  {"q": "少年聽雨歌樓上，紅燭昏羅帳。", "s": "蔣捷〈虞美人．聽雨〉", "b": "宋詞三百首", "e": "年少時在歌樓聽雨，充滿浪漫。不同年紀聽雨，會有不同心情。"},
  {"q": "天若有情天亦老。", "s": "李賀〈金銅仙人辭漢歌〉", "b": "李賀詩選", "e": "如果天也有感情，看盡人間悲歡也會變老。"},
  {"q": "少年心事當拏雲。", "s": "李賀〈致酒行〉", "b": "李賀詩選", "e": "年輕人的志向，應該高到可以抓住雲彩！"},
  {"q": "看似尋常最奇崛，成如容易卻艱辛。", "s": "王安石〈題張司業詩〉", "b": "宋詩選", "e": "看起來平凡的作品最不簡單；看似輕鬆的成功，背後都很辛苦。"},
  {"q": "寶劍鋒從磨礪出，梅花香自苦寒來。", "s": "《警世賢文》", "b": "增廣賢文", "e": "寶劍的鋒利來自磨練，梅花的香氣來自寒冬。經過努力，才會綻放光彩。"},
  {"q": "有志不在年高，無志空活百歲。", "s": "古諺", "b": "增廣賢文", "e": "有志向不分年紀大小；沒有志向，活一百歲也是虛度。"},
  {"q": "路遙知馬力，日久見人心。", "s": "古諺", "b": "增廣賢文", "e": "路走遠了才知道馬的力氣，時間久了才看得出一個人的真心。"},
  {"q": "一年之計在於春，一日之計在於晨。", "s": "古諺", "b": "增廣賢文", "e": "一年的計畫要在春天開始，一天的計畫要在早晨做好。"},
  {"q": "書到用時方恨少，事非經過不知難。", "s": "古諺", "b": "增廣賢文", "e": "書要用的時候才後悔讀得太少，事情沒做過不知道有多難。"},
  {"q": "千里送鵝毛，禮輕情意重。", "s": "古諺", "b": "增廣賢文", "e": "禮物雖小，心意最重要。"},
  {"q": "不經一事，不長一智。", "s": "古諺", "b": "增廣賢文", "e": "經歷過一件事，就會增長一分智慧。失敗也是學習。"},
  {"q": "人無完人，金無足赤。", "s": "古諺", "b": "增廣賢文", "e": "沒有十全十美的人，也沒有百分之百純的金。包容別人，也包容自己。"},
  {"q": "吃得苦中苦，方為人上人。", "s": "古諺", "b": "增廣賢文", "e": "能吃得了苦，才能有出眾的成就。"},
  {"q": "一分耕耘，一分收穫。", "s": "俗諺", "b": "增廣賢文", "e": "付出多少努力，就會有多少收穫。"},
  {"q": "勤能補拙。", "s": "俗諺", "b": "增廣賢文", "e": "天分不足沒關係，努力可以彌補。"},
  {"q": "笨鳥先飛。", "s": "俗諺", "b": "增廣賢文", "e": "知道自己慢一點，就早一點出發。提早準備就能趕上。"},
  {"q": "熟讀唐詩三百首，不會作詩也會吟。", "s": "孫洙〈唐詩三百首序〉引諺", "b": "唐詩三百首", "e": "讀熟三百首唐詩，就算不會寫詩，也能吟上幾句。多讀自然會。"},
  {"q": "讀書須用意，一字值千金。", "s": "《神童詩》", "b": "神童詩", "e": "用心讀書，每一個字都價值千金。"},
  {"q": "水滴石穿，繩鋸木斷。", "s": "羅大經《鶴林玉露》", "b": "鶴林玉露", "e": "水滴久了能穿透石頭，繩子久了能鋸斷木頭。持續的小力量能完成大事。"},
  {"q": "知己知彼，百戰不殆。", "s": "《孫子兵法．謀攻》", "b": "孫子兵法", "e": "了解對手也了解自己，打一百次仗也不會失敗。考試也是一樣！"},
  {"q": "上兵伐謀。", "s": "《孫子兵法．謀攻》", "b": "孫子兵法", "e": "最高明的方法是用智慧和計畫解決問題。"},
  {"q": "不戰而屈人之兵，善之善者也。", "s": "《孫子兵法．謀攻》", "b": "孫子兵法", "e": "不用衝突就能讓對方信服，才是最好的方法。"},
  {"q": "讀書之樂樂何如？綠滿窗前草不除。", "s": "翁森〈四時讀書樂〉", "b": "四時讀書樂", "e": "讀書的快樂是什麼？就像窗前滿滿的綠草，生機勃勃。"},
  {"q": "讀書有三到：心到、眼到、口到。", "s": "朱熹〈訓學齋規〉", "b": "朱子讀書法", "e": "讀書要專心、看清楚、讀出聲，三到做到效果最好。"},
  {"q": "立志宜思真品格，讀書須盡苦功夫。", "s": "阮元（聯語）", "b": "阮元詩文集", "e": "立志要追求真正的好品格，讀書要肯下苦功。"},
  {"q": "鳥欲高飛先振翅，人求上進先讀書。", "s": "李苦禪（語）", "b": "名人讀書故事", "e": "鳥要飛高要先振翅，人要進步要先讀書。"},
  {"q": "書猶藥也，善讀之可以醫愚。", "s": "劉向（語）", "b": "說苑", "e": "書就像藥，會讀書就能治好愚昧。"},
  {"q": "開卷有益。", "s": "王闢之《澠水燕談錄》（宋太宗語）", "b": "澠水燕談錄", "e": "打開書本就會有收穫，讀書永遠不吃虧。"},
  {"q": "三日不讀書，便覺語言無味，面目可憎。", "s": "黃庭堅（語）", "b": "黃庭堅詩文選", "e": "幾天不讀書，說話就變得乏味，連樣子都不可愛了。"},
  {"q": "天下興亡，匹夫有責。", "s": "顧炎武《日知錄》（梁啟超概括語）", "b": "日知錄", "e": "國家的興衰，每個人都有責任。"},
  {"q": "少年強則國強。", "s": "梁啟超〈少年中國說〉", "b": "飲冰室文集", "e": "年輕人強大，國家就強大。你的成長很重要！"},
  {"q": "白日依山盡，黃河入海流。", "s": "王之渙〈登鸛雀樓〉", "b": "唐詩三百首", "e": "太陽依著山落下，黃河奔流入海，開闊的景象讓人心胸開朗。"},
  {"q": "欲窮千里目，更上一層樓。", "s": "王之渙〈登鸛雀樓〉", "b": "唐詩三百首", "e": "想看得更遠，就要再爬高一層。想進步，就要不斷往上努力。"},
  {"q": "羌笛何須怨楊柳，春風不度玉門關。", "s": "王之渙〈涼州詞〉", "b": "唐詩三百首", "e": "羌笛何必吹出哀怨的曲子？春風本來就吹不到玉門關外。"},
  {"q": "春眠不覺曉，處處聞啼鳥。", "s": "孟浩然〈春曉〉", "b": "唐詩三百首", "e": "春天睡得香甜，醒來到處都是鳥叫聲，生活中的小美好。"},
  {"q": "夜來風雨聲，花落知多少。", "s": "孟浩然〈春曉〉", "b": "唐詩三百首", "e": "昨夜風雨，不知打落了多少花。美好的事物要及時珍惜。"},
  {"q": "故人具雞黍，邀我至田家。", "s": "孟浩然〈過故人莊〉", "b": "唐詩三百首", "e": "老朋友準備了飯菜邀我去作客。樸實的友情最溫暖。"},
  {"q": "待到重陽日，還來就菊花。", "s": "孟浩然〈過故人莊〉", "b": "唐詩三百首", "e": "等到重陽節，我還要再來賞菊。期待下一次的相聚。"},
  {"q": "床前明月光，疑是地上霜。", "s": "李白〈靜夜思〉", "b": "李白詩選", "e": "床前灑滿月光，像地上結了一層霜。月光勾起淡淡的思鄉情。"},
  {"q": "舉頭望明月，低頭思故鄉。", "s": "李白〈靜夜思〉", "b": "李白詩選", "e": "抬頭看月亮，低頭想家鄉。遠方的家人也在想你喔。"},
  {"q": "天生我材必有用。", "s": "李白〈將進酒〉", "b": "李白詩選", "e": "老天給了我才能，一定有派上用場的地方。相信自己的價值！"},
  {"q": "人生得意須盡歡，莫使金樽空對月。", "s": "李白〈將進酒〉", "b": "李白詩選", "e": "開心的時候就盡情享受，別讓美好時光白白溜走。"},
  {"q": "君不見黃河之水天上來，奔流到海不復回。", "s": "李白〈將進酒〉", "b": "李白詩選", "e": "黃河之水奔流入海就不再回頭，時光也是一樣，要好好把握。"},
  {"q": "長風破浪會有時，直掛雲帆濟滄海。", "s": "李白〈行路難〉", "b": "李白詩選", "e": "總有一天能乘風破浪，掛起船帆橫渡大海。眼前的困難終會過去。"},
  {"q": "桃花潭水深千尺，不及汪倫送我情。", "s": "李白〈贈汪倫〉", "b": "李白詩選", "e": "桃花潭水再深，也比不上汪倫送別我的情誼。"},
  {"q": "孤帆遠影碧空盡，唯見長江天際流。", "s": "李白〈黃鶴樓送孟浩然之廣陵〉", "b": "李白詩選", "e": "朋友的船越來越遠，只剩長江流向天邊，寫出離別的不捨。"},
  {"q": "兩岸猿聲啼不住，輕舟已過萬重山。", "s": "李白〈早發白帝城〉", "b": "李白詩選", "e": "猿聲還在耳邊，小船已經穿過萬重山。心情輕快時，困難轉眼就過去。"},
  {"q": "飛流直下三千尺，疑是銀河落九天。", "s": "李白〈望廬山瀑布〉", "b": "李白詩選", "e": "瀑布直落三千尺，好像銀河從天上掉下來，充滿驚人的想像力。"},
  {"q": "抽刀斷水水更流，舉杯消愁愁更愁。", "s": "李白〈宣州謝朓樓餞別校書叔雲〉", "b": "李白詩選", "e": "拔刀砍水，水流得更急；借酒消愁，愁更多。逃避解決不了問題。"},
  {"q": "花間一壺酒，獨酌無相親。", "s": "李白〈月下獨酌〉", "b": "李白詩選", "e": "在花間獨自喝酒，雖然孤單，卻能邀月亮和影子作伴。"},
  {"q": "相看兩不厭，只有敬亭山。", "s": "李白〈獨坐敬亭山〉", "b": "李白詩選", "e": "我和敬亭山互相看著，怎麼看都看不膩。與大自然相處最自在。"},
  {"q": "我寄愁心與明月，隨君直到夜郎西。", "s": "李白〈聞王昌齡左遷龍標遙有此寄〉", "b": "李白詩選", "e": "把擔心託付給明月，讓它陪著朋友到遠方。"},
  {"q": "長安一片月，萬戶擣衣聲。", "s": "李白〈子夜吳歌〉", "b": "李白詩選", "e": "長安城月色下，家家戶戶傳來搗衣聲，思念遠方的親人。"},
  {"q": "天門中斷楚江開，碧水東流至此回。", "s": "李白〈望天門山〉", "b": "李白詩選", "e": "天門山被長江一分為二，碧綠江水在這裡迴旋，景色壯麗。"},
  {"q": "蜀道之難，難於上青天。", "s": "李白〈蜀道難〉", "b": "李白詩選", "e": "蜀道難走，比登天還難。但再難的路，也有人走過。"},
  {"q": "會當凌絕頂，一覽眾山小。", "s": "杜甫〈望嶽〉", "b": "杜甫詩選", "e": "總有一天要登上泰山頂，俯看群山都變得渺小。立下遠大目標吧！"},
  {"q": "讀書破萬卷，下筆如有神。", "s": "杜甫〈奉贈韋左丞丈二十二韻〉", "b": "杜甫詩選", "e": "讀了上萬卷書，寫作時就像有神來相助。多讀才能寫得好！"},
  {"q": "好雨知時節，當春乃發生。", "s": "杜甫〈春夜喜雨〉", "b": "杜甫詩選", "e": "好雨懂得時節，春天一到就降下來。好的幫助總是來得剛剛好。"},
  {"q": "隨風潛入夜，潤物細無聲。", "s": "杜甫〈春夜喜雨〉", "b": "杜甫詩選", "e": "春雨隨風在夜裡悄悄落下，無聲地滋潤萬物。默默付出最動人。"},
  {"q": "國破山河在，城春草木深。", "s": "杜甫〈春望〉", "b": "杜甫詩選", "e": "國家殘破，山河依舊，春天的城裡草木叢生，充滿戰亂的哀傷。"},
  {"q": "烽火連三月，家書抵萬金。", "s": "杜甫〈春望〉", "b": "杜甫詩選", "e": "戰火連綿，一封家書比萬兩黃金還珍貴。記得常和家人聯絡。"},
  {"q": "兩個黃鸝鳴翠柳，一行白鷺上青天。", "s": "杜甫〈絕句〉", "b": "杜甫詩選", "e": "黃鸝在柳樹上歌唱，白鷺飛上藍天，色彩明亮的春景。"},
  {"q": "朱門酒肉臭，路有凍死骨。", "s": "杜甫〈自京赴奉先縣詠懷五百字〉", "b": "杜甫詩選", "e": "富人家酒肉多到發臭，路邊卻有凍死的窮人。杜甫關心社會的不公。"},
  {"q": "安得廣廈千萬間，大庇天下寒士俱歡顏。", "s": "杜甫〈茅屋為秋風所破歌〉", "b": "杜甫詩選", "e": "自己屋破受凍，仍希望有千萬間大屋，讓天下貧寒的人都歡笑。"},
  {"q": "無邊落木蕭蕭下，不盡長江滾滾來。", "s": "杜甫〈登高〉", "b": "杜甫詩選", "e": "落葉紛紛，長江滾滾，寫出時間流逝的壯闊與感慨。"},
  {"q": "露從今夜白，月是故鄉明。", "s": "杜甫〈月夜憶舍弟〉", "b": "杜甫詩選", "e": "從今晚起露水轉白，月亮還是故鄉的最亮。家永遠是最溫暖的地方。"},
  {"q": "人生不相見，動如參與商。", "s": "杜甫〈贈衛八處士〉", "b": "杜甫詩選", "e": "人生中朋友常像參星與商星一樣難以相見，相聚的時光要珍惜。"},
  {"q": "獨在異鄉為異客，每逢佳節倍思親。", "s": "王維〈九月九日憶山東兄弟〉", "b": "王維詩選", "e": "獨自在外地，每到節日就更想念家人。"},
  {"q": "紅豆生南國，春來發幾枝。", "s": "王維〈相思〉", "b": "王維詩選", "e": "紅豆生長在南方，春天又長出幾枝？紅豆象徵思念。"},
  {"q": "願君多採擷，此物最相思。", "s": "王維〈相思〉", "b": "王維詩選", "e": "希望你多採一些紅豆，它最能代表思念。"},
  {"q": "勸君更盡一杯酒，西出陽關無故人。", "s": "王維〈送元二使安西〉", "b": "王維詩選", "e": "再喝一杯吧，出了陽關就沒有老朋友了。離別前的珍重。"},
  {"q": "行到水窮處，坐看雲起時。", "s": "王維〈終南別業〉", "b": "王維詩選", "e": "走到水的盡頭，就坐下來看雲升起。山窮水盡時，換個心情又是新風景。"},
  {"q": "大漠孤煙直，長河落日圓。", "s": "王維〈使至塞上〉", "b": "王維詩選", "e": "大漠中一縷孤煙直上，長河上落日渾圓，壯闊的邊塞風景。"},
  {"q": "明月松間照，清泉石上流。", "s": "王維〈山居秋暝〉", "b": "王維詩選", "e": "明月照在松林間，清泉在石上流淌，寧靜美好的山居生活。"},
  {"q": "獨坐幽篁裡，彈琴復長嘯。", "s": "王維〈竹里館〉", "b": "王維詩選", "e": "獨自坐在竹林裡彈琴吟唱，一個人也能很自在。"},
  {"q": "空山不見人，但聞人語響。", "s": "王維〈鹿柴〉", "b": "王維詩選", "e": "空山裡看不見人，只聽到說話聲，更顯出山的寧靜。"},
  {"q": "慈母手中線，遊子身上衣。", "s": "孟郊〈遊子吟〉", "b": "唐詩三百首", "e": "媽媽手中的針線，縫成遠行孩子身上的衣服。母愛藏在細節裡。"},
  {"q": "誰言寸草心，報得三春暉。", "s": "孟郊〈遊子吟〉", "b": "唐詩三百首", "e": "小草的心意，怎能報答春天陽光的恩情？父母的愛很難回報。"},
  {"q": "春風得意馬蹄疾，一日看盡長安花。", "s": "孟郊〈登科後〉", "b": "唐詩三百首", "e": "考上之後心情暢快，騎馬一天就看遍長安的花。努力有成果的喜悅！"},
  {"q": "野火燒不盡，春風吹又生。", "s": "白居易〈賦得古原草送別〉", "b": "白居易詩選", "e": "野火燒不完小草，春風一吹又長出來。生命力頑強，挫折後也能重生。"},
  {"q": "同是天涯淪落人，相逢何必曾相識。", "s": "白居易〈琵琶行〉", "b": "白居易詩選", "e": "同樣漂泊不得志的人，相遇時何必以前認識？有相同經歷的人最懂彼此。"},
  {"q": "千呼萬喚始出來，猶抱琵琶半遮面。", "s": "白居易〈琵琶行〉", "b": "白居易詩選", "e": "叫了好多次才出來，還用琵琶遮住半張臉。形容期待已久終於出現。"},
  {"q": "在天願作比翼鳥，在地願為連理枝。", "s": "白居易〈長恨歌〉", "b": "白居易詩選", "e": "在天上願做比翼雙飛的鳥，在地上願做連在一起的樹枝，形容深情不分離。"},
  {"q": "日出江花紅勝火，春來江水綠如藍。", "s": "白居易〈憶江南〉", "b": "白居易詩選", "e": "日出時江邊的花比火還紅，春天的江水綠得像藍草，色彩好鮮豔。"},
  {"q": "人間四月芳菲盡，山寺桃花始盛開。", "s": "白居易〈大林寺桃花〉", "b": "白居易詩選", "e": "山下的花都謝了，山上的桃花才剛開。每個人綻放的時間不同，不用著急。"},
  {"q": "鋤禾日當午，汗滴禾下土。", "s": "李紳〈憫農〉", "b": "唐詩三百首", "e": "正午烈日下鋤草，汗水滴進泥土。農夫真的很辛苦。"},
  {"q": "誰知盤中飧，粒粒皆辛苦。", "s": "李紳〈憫農〉", "b": "唐詩三百首", "e": "誰知道盤中的飯，每一粒都得來不易？要珍惜食物。"},
  {"q": "春蠶到死絲方盡，蠟炬成灰淚始乾。", "s": "李商隱〈無題〉", "b": "李商隱詩選", "e": "春蠶吐絲到死才停，蠟燭燒成灰燭淚才乾。比喻全心全意的奉獻。"},
  {"q": "夕陽無限好，只是近黃昏。", "s": "李商隱〈登樂遊原〉", "b": "李商隱詩選", "e": "夕陽很美，只是已近黃昏。美好時光短暫，要好好珍惜。"},
  {"q": "身無彩鳳雙飛翼，心有靈犀一點通。", "s": "李商隱〈無題〉", "b": "李商隱詩選", "e": "雖然沒有翅膀能飛到你身邊，心意卻能互相感應。"},
  {"q": "此情可待成追憶，只是當時已惘然。", "s": "李商隱〈錦瑟〉", "b": "李商隱詩選", "e": "很多美好的時刻，當下沒察覺，回想時才懂得珍惜。"},
  {"q": "停車坐愛楓林晚，霜葉紅於二月花。", "s": "杜牧〈山行〉", "b": "杜牧詩選", "e": "停車欣賞楓林，經霜的紅葉比二月的花還紅。每個季節都有它的美。"},
  {"q": "清明時節雨紛紛，路上行人欲斷魂。", "s": "杜牧〈清明〉", "b": "杜牧詩選", "e": "清明時節細雨紛飛，路上的行人心情哀傷。"},
  {"q": "勝敗兵家事不期，包羞忍恥是男兒。", "s": "杜牧〈題烏江亭〉", "b": "杜牧詩選", "e": "勝敗無法預料，能忍受失敗的人，才有機會東山再起。"},
  {"q": "煙籠寒水月籠沙，夜泊秦淮近酒家。", "s": "杜牧〈泊秦淮〉", "b": "杜牧詩選", "e": "輕煙籠罩寒水，月光籠罩沙岸，秦淮河的夜色朦朧又寂寥。"},
  {"q": "銀燭秋光冷畫屏，輕羅小扇撲流螢。", "s": "杜牧〈秋夕〉", "b": "杜牧詩選", "e": "秋夜燭光映著畫屏，拿著小扇撲螢火蟲，寂靜中的小小樂趣。"},
  {"q": "忽如一夜春風來，千樹萬樹梨花開。", "s": "岑參〈白雪歌送武判官歸京〉", "b": "唐詩三百首", "e": "一夜大雪掛滿枝頭，好像春風吹來，千萬棵梨樹開花了！"},
  {"q": "黃沙百戰穿金甲，不破樓蘭終不還。", "s": "王昌齡〈從軍行〉", "b": "唐詩三百首", "e": "在黃沙中身經百戰，盔甲都磨破了，不達成目標絕不回頭。"},
  {"q": "青海長雲暗雪山，孤城遙望玉門關。", "s": "王昌齡〈從軍行〉", "b": "唐詩三百首", "e": "長雲遮暗雪山，孤城遙望玉門關，邊塞的遼闊與堅守。"},
  {"q": "洛陽親友如相問，一片冰心在玉壺。", "s": "王昌齡〈芙蓉樓送辛漸〉", "b": "唐詩三百首", "e": "如果洛陽的親友問起我，就說我的心像玉壺裡的冰一樣純潔。"},
  {"q": "秦時明月漢時關，萬里長征人未還。", "s": "王昌齡〈出塞〉", "b": "唐詩三百首", "e": "從秦漢到現在，月亮和關口依舊，出征的人卻還沒回來。"},
  {"q": "但使龍城飛將在，不教胡馬度陰山。", "s": "王昌齡〈出塞〉", "b": "唐詩三百首", "e": "只要有像飛將軍李廣那樣的人在，敵人就越不過陰山。"},
  {"q": "葡萄美酒夜光杯，欲飲琵琶馬上催。", "s": "王翰〈涼州詞〉", "b": "唐詩三百首", "e": "葡萄酒裝在夜光杯裡，正要喝時琵琶聲催人出征，充滿邊塞豪情。"},
  {"q": "莫愁前路無知己，天下誰人不識君。", "s": "高適〈別董大〉", "b": "唐詩三百首", "e": "別擔心前方沒有知己，天下誰不認識你呢？有才華的人到哪裡都會被看見。"},
  {"q": "前不見古人，後不見來者。", "s": "陳子昂〈登幽州臺歌〉", "b": "唐詩三百首", "e": "往前看不到古人，往後看不到來者，感嘆天地悠悠、個人渺小。"},
  {"q": "海上生明月，天涯共此時。", "s": "張九齡〈望月懷遠〉", "b": "唐詩三百首", "e": "海上升起明月，遠在天涯的人此刻看著同一個月亮。"},
  {"q": "月落烏啼霜滿天，江楓漁火對愁眠。", "s": "張繼〈楓橋夜泊〉", "b": "唐詩三百首", "e": "月亮落下、烏鴉啼叫，旅人對著江楓漁火，愁得睡不著。"},
  {"q": "姑蘇城外寒山寺，夜半鐘聲到客船。", "s": "張繼〈楓橋夜泊〉", "b": "唐詩三百首", "e": "寒山寺的鐘聲半夜傳到客船上，讓夜更加寧靜。"},
  {"q": "人生代代無窮已，江月年年望相似。", "s": "張若虛〈春江花月夜〉", "b": "唐詩三百首", "e": "人一代代地傳承下去，江上的月亮年年看起來都一樣。"},
  {"q": "江畔何人初見月？江月何年初照人？", "s": "張若虛〈春江花月夜〉", "b": "唐詩三百首", "e": "是誰最先在江邊看見月亮？月亮又是哪一年第一次照到人？對宇宙的好奇。"},
  {"q": "曾經滄海難為水，除卻巫山不是雲。", "s": "元稹〈離思〉", "b": "元稹詩選", "e": "看過大海，其他的水都不算水了。見過最好的，就難以被取代。"},
  {"q": "沉舟側畔千帆過，病樹前頭萬木春。", "s": "劉禹錫〈酬樂天揚州初逢席上見贈〉", "b": "劉禹錫詩選", "e": "沉船旁有千帆駛過，病樹前有萬木逢春。新的希望總會出現。"},
  {"q": "自古逢秋悲寂寥，我言秋日勝春朝。", "s": "劉禹錫〈秋詞〉", "b": "劉禹錫詩選", "e": "大家都說秋天悲涼，我卻覺得秋天勝過春天。換個角度，心情就不一樣。"},
  {"q": "東邊日出西邊雨，道是無晴卻有晴。", "s": "劉禹錫〈竹枝詞〉", "b": "劉禹錫詩選", "e": "東邊出太陽西邊下雨，說是沒晴天卻又有晴。用天氣比喻難猜的心意。"},
  {"q": "舊時王謝堂前燕，飛入尋常百姓家。", "s": "劉禹錫〈烏衣巷〉", "b": "劉禹錫詩選", "e": "從前富貴人家屋簷下的燕子，如今飛進普通人家。世事變遷，繁華不長久。"},
  {"q": "少小離家老大回，鄉音無改鬢毛衰。", "s": "賀知章〈回鄉偶書〉", "b": "唐詩三百首", "e": "年少離家、年老才回來，口音沒變，頭髮卻白了。"},
  {"q": "不知細葉誰裁出，二月春風似剪刀。", "s": "賀知章〈詠柳〉", "b": "唐詩三百首", "e": "是誰裁出這細細的柳葉？原來二月的春風就像剪刀！"},
  {"q": "千山鳥飛絕，萬徑人蹤滅。", "s": "柳宗元〈江雪〉", "b": "唐詩三百首", "e": "群山沒有鳥飛，小路沒有人跡，一片寂靜的雪景。"},
  {"q": "孤舟蓑笠翁，獨釣寒江雪。", "s": "柳宗元〈江雪〉", "b": "唐詩三百首", "e": "孤舟上的老翁獨自在寒江垂釣。即使孤單，也堅持自己的方向。"},
  {"q": "曲徑通幽處，禪房花木深。", "s": "常建〈題破山寺後禪院〉", "b": "唐詩三百首", "e": "彎彎曲曲的小路通往幽靜的地方。人生的好風景常在轉彎之後。"},
  {"q": "春江潮水連海平，海上明月共潮生。", "s": "張若虛〈春江花月夜〉", "b": "唐詩三百首", "e": "春天的江潮和大海連成一片，明月隨著潮水一起升起。"},
  {"q": "海內存知己，天涯若比鄰。", "s": "王勃〈送杜少府之任蜀州〉", "b": "唐詩三百首", "e": "只要世上有知己，即使遠在天涯，也像住在隔壁一樣親近。"},
  {"q": "無為在歧路，兒女共沾巾。", "s": "王勃〈送杜少府之任蜀州〉", "b": "唐詩三百首", "e": "分別時不要像小兒女一樣哭泣，真正的友情不怕距離。"},
  {"q": "春色滿園關不住，一枝紅杏出牆來。", "s": "葉紹翁〈遊園不值〉", "b": "宋詩選", "e": "滿園春色關也關不住，一枝紅杏伸出牆外。美好的事物藏不住。"},
  {"q": "小荷才露尖尖角，早有蜻蜓立上頭。", "s": "楊萬里〈小池〉", "b": "宋詩選", "e": "小荷葉才剛冒出尖角，就有蜻蜓停在上面。新生的事物充滿希望。"},
  {"q": "接天蓮葉無窮碧，映日荷花別樣紅。", "s": "楊萬里〈曉出淨慈寺送林子方〉", "b": "宋詩選", "e": "蓮葉一望無際連到天邊，陽光下的荷花特別紅。夏日的生命力好旺盛！"},
  {"q": "等閒識得東風面，萬紫千紅總是春。", "s": "朱熹〈春日〉", "b": "宋詩選", "e": "輕易就能感受到春風，萬紫千紅都是春天。用心感受，處處都美。"},
  {"q": "死去元知萬事空，但悲不見九州同。", "s": "陸游〈示兒〉", "b": "陸游詩選", "e": "死後萬事皆空，只遺憾看不到國家統一。至死不忘家國。"},
  {"q": "位卑未敢忘憂國。", "s": "陸游〈病起書懷〉", "b": "陸游詩選", "e": "地位再低，也不敢忘記關心國家。每個人都能為社會盡一份心。"},
  {"q": "零落成泥碾作塵，只有香如故。", "s": "陸游〈卜算子．詠梅〉", "b": "陸游詩選", "e": "梅花凋落成泥、被碾成塵土，香氣依舊。挫折改變不了美好的品格。"},
  {"q": "山重水複疑無路，柳暗花明又一村。", "s": "陸游〈遊山西村〉", "b": "陸游詩選", "e": "山水重重以為沒路了，轉個彎又看到柳綠花紅的村莊。困境中別放棄，轉機就在前方。"},
  {"q": "牆角數枝梅，凌寒獨自開。", "s": "王安石〈梅花〉", "b": "宋詩選", "e": "牆角的幾枝梅花，冒著嚴寒獨自綻放。不畏困難，勇敢做自己。"},
  {"q": "遙知不是雪，為有暗香來。", "s": "王安石〈梅花〉", "b": "宋詩選", "e": "遠遠就知道那不是雪，因為有淡淡的花香飄來。真正的內涵自然會散發光彩。"},
  {"q": "爆竹聲中一歲除，春風送暖入屠蘇。", "s": "王安石〈元日〉", "b": "宋詩選", "e": "爆竹聲中送走舊的一年，春風帶來溫暖。新年新氣象！"},
  {"q": "千門萬戶曈曈日，總把新桃換舊符。", "s": "王安石〈元日〉", "b": "宋詩選", "e": "家家戶戶迎著朝陽，換上新的桃符。除舊布新，迎接新的開始。"},
  {"q": "輕輕的我走了，正如我輕輕的來。", "s": "徐志摩〈再別康橋〉", "b": "徐志摩詩選", "e": "告別時也可以溫柔從容，把美好的回憶輕輕收在心裡。"},
  {"q": "我揮一揮衣袖，不帶走一片雲彩。", "s": "徐志摩〈再別康橋〉", "b": "徐志摩詩選", "e": "離開時瀟灑放下，留下美好就好，不必執著帶走什麼。"},
  {"q": "黑夜給了我黑色的眼睛，我卻用它尋找光明。", "s": "顧城〈一代人〉", "b": "顧城詩選", "e": "就算身處黑暗，也要用自己的眼睛去尋找希望與光亮。"},
  {"q": "面朝大海，春暖花開。", "s": "海子〈面朝大海，春暖花開〉", "b": "海子詩選", "e": "心裡懷著溫暖的期待，生活就會像春天的大海一樣明亮。"},
  {"q": "卑鄙是卑鄙者的通行證，高尚是高尚者的墓誌銘。", "s": "北島〈回答〉", "b": "北島詩選", "e": "即使世界不公平，也要堅持做一個正直高尚的人。"},
  {"q": "其實地上本沒有路，走的人多了，也便成了路。", "s": "魯迅〈故鄉〉", "b": "吶喊", "e": "路是人走出來的。勇敢踏出第一步，你就是開路的人。"},
  {"q": "橫眉冷對千夫指，俯首甘為孺子牛。", "s": "魯迅〈自嘲〉", "b": "魯迅詩選", "e": "面對惡勢力不低頭，對需要幫助的人卻甘心付出。"},
  {"q": "時間就像海綿裡的水，只要願擠，總還是有的。", "s": "魯迅", "b": "魯迅雜文選", "e": "別說沒時間，擠一擠總有空檔可以讀書、做喜歡的事。"},
  {"q": "你站在橋上看風景，看風景的人在樓上看你。", "s": "卞之琳〈斷章〉", "b": "卞之琳詩選", "e": "你在欣賞世界的同時，也成了別人眼中的風景。"},
  {"q": "小時候，鄉愁是一枚小小的郵票。", "s": "余光中〈鄉愁〉", "b": "余光中詩選", "e": "小時候的思念，是一張寄給媽媽的郵票。距離讓愛變得具體。"},
  {"q": "而現在，鄉愁是一灣淺淺的海峽。", "s": "余光中〈鄉愁〉", "b": "余光中詩選", "e": "長大後的思念，變成一道隔開家鄉的海峽，淺卻難以跨越。"},
  {"q": "青春是一本太倉促的書。", "s": "席慕蓉〈青春〉", "b": "七里香", "e": "青春很快就翻過去了，趁現在好好寫下屬於你的精彩篇章。"},
  {"q": "如何讓你遇見我，在我最美麗的時刻。", "s": "席慕蓉〈一棵開花的樹〉", "b": "七里香", "e": "為了遇見重要的人或機會，先讓自己準備好、努力綻放。"},
  {"q": "我達達的馬蹄是美麗的錯誤，我不是歸人，是個過客。", "s": "鄭愁予〈錯誤〉", "b": "鄭愁予詩選", "e": "有些期待落空，只是一場美麗的誤會，也是人生的一段風景。"},
  {"q": "要怎麼收穫，先那麼栽。", "s": "胡適", "b": "胡適文存", "e": "想得到什麼成果，就要先付出相應的努力。"},
  {"q": "為學要如金字塔，要能廣大要能高。", "s": "胡適", "b": "胡適文存", "e": "學習要像金字塔，底部打得廣，才能堆得高。"},
  {"q": "大膽的假設，小心的求證。", "s": "胡適", "b": "胡適文存", "e": "勇敢提出想法，再用證據仔細驗證，這就是科學精神。"},
  {"q": "容忍比自由還更重要。", "s": "胡適〈容忍與自由〉", "b": "胡適文存", "e": "能包容不同的意見，大家才能真正自由地說話。"},
  {"q": "每想你一次，天上飛落一粒沙，從此形成了撒哈拉。", "s": "三毛", "b": "撒哈拉的故事", "e": "思念累積起來，可以大得像一整片沙漠。"},
  {"q": "於千萬人之中遇見你所要遇見的人。", "s": "張愛玲〈愛〉", "b": "流言", "e": "在茫茫人海中剛好遇見對的人，是很珍貴的緣分。"},
  {"q": "燕子去了，有再來的時候；楊柳枯了，有再青的時候。", "s": "朱自清〈匆匆〉", "b": "朱自清散文", "e": "燕子會回來，楊柳會再綠，但我們的日子一去不回。"},
  {"q": "我們的日子為什麼一去不復返呢？", "s": "朱自清〈匆匆〉", "b": "朱自清散文", "e": "時間一去不回頭，所以每一天都值得好好過。"},
  {"q": "愛在左，同情在右，走在生命路的兩旁。", "s": "冰心〈繁星．春水〉", "b": "繁星．春水", "e": "帶著愛和同理心走人生的路，就能讓路上開滿花。"},
  {"q": "所謂父女母子一場，只不過意味著，你和他的緣分就是今生今世不斷地在目送他的背影漸行漸遠。", "s": "龍應台〈目送〉", "b": "目送", "e": "孩子長大會漸漸走遠，父母只能目送。珍惜和家人相處的時光。"},
  {"q": "我要求你讀書用功，是因為我希望你將來擁有選擇的權利。", "s": "龍應台", "b": "親愛的安德烈", "e": "用功讀書不是為了比較，而是為了將來能選擇自己想要的生活。"},
  {"q": "心美，一切皆美；情深，萬象皆深。", "s": "林清玄", "b": "林清玄散文", "e": "心裡美好，看什麼都美；用情深刻，世界就變得豐富。"},
  {"q": "死是一個必然會降臨的節日。", "s": "史鐵生〈我與地壇〉", "b": "我與地壇", "e": "既然終點必然到來，就不必害怕，好好活在當下。"},
  {"q": "生活不能等待別人來安排，要自己去爭取和奮鬥。", "s": "路遙", "b": "平凡的世界", "e": "人生要靠自己努力爭取，不要只等別人安排。"},
  {"q": "婚姻是一座圍城，城外的人想進去，城裡的人想出來。", "s": "錢鍾書", "b": "圍城", "e": "人常羨慕自己沒有的東西，得到後又想離開，要懂得珍惜當下。"},
  {"q": "他強由他強，清風拂山岡；他橫由他橫，明月照大江。", "s": "金庸", "b": "倚天屠龍記", "e": "別人再強再兇，我心如清風明月，保持自己的節奏。"},
  {"q": "孩子，我把你摟在懷裡，就是甜蜜的負荷。", "s": "吳晟〈負荷〉", "b": "吳晟詩選", "e": "父母照顧孩子雖然辛苦，卻覺得是甜蜜的負擔。"},
  {"q": "人是為活著本身而活著，而不是為了活著之外的任何事物所活著。", "s": "余華", "b": "活著", "e": "活著本身就有價值，好好生活就是最重要的事。"},
  {"q": "當你真心渴望某樣東西時，整個宇宙都會聯合起來幫助你完成。", "s": "保羅．科爾賀", "b": "牧羊少年奇幻之旅", "e": "只要真心追求夢想並付出行動，就會遇見幫助你的力量。"},
  {"q": "我們能決定的，只有如何運用被賜予的時間。", "s": "托爾金", "b": "魔戒", "e": "我們無法選擇遇到什麼時代，但能決定怎麼用自己的時間。"},
  {"q": "決定我們成為什麼樣的人，不是我們的能力，而是我們的選擇。", "s": "J.K.羅琳", "b": "哈利波特：消失的密室", "e": "你是什麼樣的人，取決於你做出的選擇。"},
  {"q": "即使在最黑暗的時刻，只要記得開燈，就能找到幸福。", "s": "J.K.羅琳", "b": "哈利波特：阿茲卡班的逃犯", "e": "再難過的時候，也要記得為自己點一盞燈。"},
  {"q": "沉溺於夢想而忘記生活，是沒有好處的。", "s": "J.K.羅琳", "b": "哈利波特：神秘的魔法石", "e": "有夢很好，但也要腳踏實地，好好過每一天。"},
  {"q": "世界上只有一種真正的英雄主義，就是認清生活的真相後依然熱愛生活。", "s": "羅曼．羅蘭", "b": "米開朗基羅傳", "e": "看清生活的不完美，依然選擇熱愛它，才是真正的勇敢。"},
  {"q": "我們都在陰溝裡，但仍有人仰望星空。", "s": "王爾德", "b": "溫夫人的扇子", "e": "即使處境不好，也要保有抬頭看星星的夢想。"},
  {"q": "人生而自由，卻無往不在枷鎖之中。", "s": "盧梭", "b": "社會契約論", "e": "人天生自由，卻常被各種規則綁住，要思考什麼是真正的自由。"},
  {"q": "所有的大人都曾經是小孩，雖然只有少數人記得。", "s": "聖修伯里", "b": "小王子", "e": "別忘了自己小時候的好奇心與單純。"},
  {"q": "你為你的玫瑰花費的時間，使你的玫瑰變得如此重要。", "s": "聖修伯里", "b": "小王子", "e": "你用心付出的人事物，才會變得特別珍貴。"},
  {"q": "如果你下午四點來，那麼從三點起，我就開始感到幸福。", "s": "聖修伯里", "b": "小王子", "e": "期待本身就是一種幸福。"},
  {"q": "真正重要的東西，用眼睛是看不見的，要用心去看。", "s": "聖修伯里", "b": "小王子", "e": "最重要的東西像友情與愛，要用心才能看見。"},
  {"q": "世界以痛吻我，要我報之以歌。", "s": "泰戈爾", "b": "漂鳥集", "e": "即使世界給你傷痛，也要用歌聲回應，以溫柔面對苦難。"},
  {"q": "生如夏花之絢爛，死如秋葉之靜美。", "s": "泰戈爾", "b": "漂鳥集", "e": "活著時像夏花般燦爛，離去時像秋葉般安靜美好。"},
  {"q": "如果你因失去了太陽而流淚，那麼你也將失去群星。", "s": "泰戈爾", "b": "漂鳥集", "e": "別一直為失去的東西哭泣，否則會錯過眼前的美好。"},
  {"q": "天空沒有留下翅膀的痕跡，但我已經飛過。", "s": "泰戈爾", "b": "漂鳥集", "e": "就算沒有人看見，只要努力過，就是屬於你的飛翔。"},
  {"q": "凡是過往，皆為序章。", "s": "莎士比亞", "b": "暴風雨", "e": "過去發生的一切，都只是故事的開頭，未來還有更多可能。"},
  {"q": "生存還是毀滅，這是一個值得考慮的問題。", "s": "莎士比亞", "b": "哈姆雷特", "e": "面對重大的選擇，要勇敢思考並為自己做決定。"},
  {"q": "希望是美好的，也許是人間至善，而美好的事物永不消逝。", "s": "史蒂芬．金", "b": "四季奇譚", "e": "只要心中有希望，就能撐過最難熬的日子。"},
  {"q": "我們終此一生，就是要擺脫他人的期待，找到真正的自己。", "s": "伍綺詩", "b": "無聲告白", "e": "不要只為了別人的期待而活，要找到自己的樣子。"},

}
async function gachaPanel() {
  const st = store.get(), today = todayStr(), done = st.gacha && st.gacha.date === today;
  const d = new Date(), ds = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;

      body: `<div class="sec mark"><img src="${url}" alt="四維心靈書籤：${esc(Q.q)}"><div class="jie"><b>「${esc(Q.q)}」</b><small>— ${esc(Q.s)}</small><span>📜 解籤：${esc(Q.e)}</span></div><p>📱 手機：長按圖片 → 儲存圖片／分享<br>💻 電腦：點下方按鈕下載</p><div class="row" style="justify-content:center"><a class="btn" href="${url}" download="四維心靈書籤-${ds}.png">⬇️ 下載書籤</a><button class="btn ghost" type="button" id="again">🎲 再轉一次</button><button class="btn alt" type="button" id="share" ${navigator.share ? '' : 'hidden'}>📤 分享</button></div></div>` });
    $('#again').onclick = () => gachaPanel();
    const sh = $('#share'); if (sh) sh.onclick = async () => { try { const blob = await (await fetch(url)).blob(), f = new File([blob], 'swsh-bookmark.png', { type: 'image/png' }); if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: '四維心靈書籤', text: Q.q }); else await navigator.share({ title: '四維心靈書籤', text: `「${Q.q}」— ${Q.s}` }); } catch (e) {} };

function spinGacha() {
  return new Promise(res => {
    const G0 = CHARS.gacha; SFX.crank(); const t0 = clock.getElapsedTime();
    G0.outCap.visible = false;
    gachaAnim = t => { const u = (t - t0) / (reduceMotion ? 0.2 : 1.6);
      if (u < 0.55) { G0.crank.rotation.z = -u / 0.55 * Math.PI * 4; G0.caps.forEach((c, i) => { c.rotation.x += 0.08; c.position.y += Math.sin(t * 30 + i) * 0.01; }); }
      else if (u < 1) { if (!G0.outCap.visible) { G0.outCap.visible = true; SFX.drop(); } const v = (u - 0.55) / 0.45; G0.outCap.position.set(0, 0.55 + Math.abs(Math.sin(v * Math.PI * 2)) * 0.8 * (1 - v), 1.4 + v * 1.4); G0.outCap.rotation.x = v * 8; }
      else { gachaAnim = null; G0.outCap.rotation.x = 0; setTimeout(() => { G0.outCap.visible = false; res(); }, reduceMotion ? 0 : 250); } };
  });
}
let gachaAnim = null;

// =====================================================================

const clock = new THREE.Clock(); let envTick = 0; let INTRO_ON = true;
function loop() {
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  if (INTRO_ON) return;
  const gdt = Math.min(0.05, t - (GAME.lt || t)); GAME.lt = t; if (GAME.act) { GAME.act.update(gdt, t); renderer.render(GAME.act.S, GAME.cam); return; }
  if (!reduceMotion) ANIM.forEach(f => f(t));
  // 角色呼吸＋跳躍
  Object.values(CHARS).forEach(c => { if (!c.body) return; const j = t - c.jump; const jy = j < 0.6 ? Math.sin(j / 0.6 * Math.PI) * 0.9 : 0;
    if (!reduceMotion) { c.body.scale.y = 1 + Math.sin(t * 2.2 + c.ph) * 0.018; if (c.head) c.head.rotation.z = Math.sin(t * 1.1 + c.ph) * 0.06; }
    c.body.position.y = (c.baseY ?? (c.baseY = c.body.position.y)) + jy;
    if (c.tail) c.tail.rotation.y = Math.sin(t * (j < 1.5 ? 18 : c.sleepy ? 1.2 : 6)) * (c.sleepy ? 0.15 : 0.6); });
  // 熱點彈跳＋滑鼠懸停
  Object.entries(HOTS).forEach(([id, h]) => { const b = t - (bounces[id] ?? -9); const s0 = h.g.userData.s0 ?? (h.g.userData.s0 = h.g.scale.x); let s = s0 * (hoverId === id ? 1.04 : 1); if (b < 0.5) s *= 1 + Math.sin(b / 0.5 * Math.PI) * 0.08; h.g.scale.setScalar(h.g.scale.x + (s - h.g.scale.x) * 0.3); });
  if (gachaAnim) gachaAnim(t);
  if (ENV.sky) { const dtC = Math.min(0.25, t - (ENV.lt ?? t)); ENV.lt = t; if (clockRun) simMin = (simMin + dtC * 10) % 1440; applyEnv(simMin, t); weather(t); updateClock(); }
  const dtP = Math.min(0.05, t - (WALK.lt ?? t)); WALK.lt = t; stepPlay(t, dtP);
  updateCam(t); renderer.render(scene, camera); updatePins(); placeTags();
}
