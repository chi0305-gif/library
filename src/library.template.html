<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWSH 數位閱讀基地</title>
<meta name="description" content="花蓮縣私立四維高級中學 圖書資訊中心：微縮立體圖書館互動網頁">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #FFFAF0; --ink: #5B4636; --ink2: #8A7260; --line: #F0DFC8;
  --pink: #FF8FB8; --pink2: #FFD6E5; --butter: #FFE07A; --mint: #8EDDC0; --mint2: #D7F5EA;
  --sky: #8FD3FF; --sky2: #DDF1FF; --lav: #BBA8FF; --lav2: #ECE6FF; --peach: #FFB48F;
  --shadow: 0 10px 30px rgba(120, 80, 40, .18); --r: 22px;
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; --round: "Huninn", "Noto Sans TC", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #BFE6FF; color: var(--ink); font-family: var(--font); }
#stage { position: fixed; inset: 0; background: linear-gradient(#7CC8F5, #CDEBFF 55%, #FFF3E2); }
#stage canvas { display: block; touch-action: none; cursor: grab; }
#stage canvas.hover { cursor: pointer; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }

/* ---- 頂部 ---- */
.top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 14px 0; pointer-events: none; z-index: 5; }
.brand { pointer-events: auto; display: flex; align-items: center; gap: 10px; background: var(--cream); border-radius: 999px; padding: 6px 18px 6px 6px; box-shadow: var(--shadow); border: 3px solid #fff; }
.brand .logo { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(from 200deg, var(--pink), var(--butter), var(--mint), var(--sky), var(--lav), var(--pink)); font-size: 22px; box-shadow: inset 0 0 0 4px #fff; }
.brand h1 { margin: 0; font: 400 21px/1.1 var(--round); letter-spacing: .04em; }
.brand small { display: block; font-size: 11.5px; color: var(--ink2); font-weight: 700; letter-spacing: .08em; margin-top: 2px; }
.tools { pointer-events: auto; display: flex; gap: 8px; }
.tbtn { border: 3px solid #fff; background: var(--cream); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 6px; transition: transform .15s; }
.tbtn:hover { transform: translateY(-2px); }
.tbtn.off { opacity: .6; }

/* ---- 場景標籤 ---- */
#pins { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
.pin { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: auto; border: 2px solid #fff; background: rgba(255, 250, 240, .95); border-radius: 999px; padding: 2px 8px 2px 3px; font-weight: 700; font-size: 11px; white-space: nowrap; box-shadow: 0 4px 10px rgba(120, 80, 40, .2); display: flex; align-items: center; gap: 5px; transition: opacity .2s; }
.pin::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 7px; height: 7px; background: inherit; border-right: 2px solid #fff; border-bottom: 2px solid #fff; transform: translateX(-50%) rotate(45deg); }
.pin i { font-style: normal; width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; }
.pin:hover { transform: translate(-50%, -100%) scale(1.06); }
.pin.hide { opacity: 0; pointer-events: none; }
.bubble { position: fixed; z-index: 6; transform: translate(-50%, -100%); background: #fff; border-radius: 18px; padding: 8px 14px; font: 400 17px var(--round); box-shadow: var(--shadow); pointer-events: none; animation: bub .35s cubic-bezier(.3, 1.6, .5, 1); }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; border: 9px solid transparent; border-top-color: #fff; border-bottom: 0; transform: translateX(-50%); }
@keyframes bub { from { transform: translate(-50%, -80%) scale(.4); opacity: 0; } }

/* ---- 底部導覽 ---- */
.dock { position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 2px; padding: 5px 8px; background: rgba(255, 250, 240, .92); border: 3px solid #fff; border-radius: 26px; box-shadow: var(--shadow); max-width: calc(100vw - 20px); overflow-x: auto; scrollbar-width: none; }
.dock::-webkit-scrollbar { display: none; }
.dock button { flex: 0 0 auto; border: 0; background: transparent; border-radius: 14px; padding: 4px 5px 3px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 50px; font-size: 10.5px; font-weight: 700; color: var(--ink2); transition: background .15s, transform .15s; }
.dock button b { font-size: 17px; line-height: 1.15; }
.dock .tb b { font: italic 700 15px/1.2 Georgia, "Times New Roman", serif; color: var(--ink); }
.dock .tb.on { background: var(--butter); color: var(--ink); }
.clockbox { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 2px; flex: 0 0 auto; }
.dock .cface { width: 40px; height: 40px; min-width: 40px; padding: 0; border-radius: 50%; background: radial-gradient(#FFFDF6 58%, #FFEDC2); border: 3px solid #F2C14E; position: relative; box-shadow: 0 3px 0 #E5B23C; }
.dock .cface:hover { transform: none; background: radial-gradient(#FFFDF6 58%, #FFE29A); }
.cface i { position: absolute; left: 50%; bottom: 50%; border-radius: 3px; transform-origin: 50% 100%; }
.cface .hh { width: 3px; height: 9px; margin-left: -1.5px; background: #5B4636; } .cface .mm { width: 2px; height: 13px; margin-left: -1px; background: #E0679A; }
.dock .cface.paused { border-color: #BBA8FF; box-shadow: 0 3px 0 #9C86E8; }
.cface::after { content: ""; position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: #5B4636; }
.ctxt small { display: block; font-size: 9.5px; color: var(--ink2); font-weight: 700; letter-spacing: .06em; white-space: nowrap; }
.ctxt b { display: block; font: italic 700 21px/1.05 Georgia, "Times New Roman", serif; color: var(--ink); }
.dsep { width: 1px; align-self: stretch; margin: 6px 4px; background: var(--line); flex: 0 0 auto; }
#flash { position: fixed; inset: 0; background: #F4F8FF; opacity: 0; pointer-events: none; z-index: 2; }
.dock button:hover { background: var(--pink2); color: var(--ink); transform: translateY(-3px); }
.hint { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 4; background: rgba(91, 70, 54, .82); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; transition: opacity .6s; pointer-events: none; }
.toast { position: fixed; left: 50%; top: calc(84px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 50; background: var(--ink); color: #fff; border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: 14px; box-shadow: var(--shadow); animation: bub .3s; max-width: 92vw; text-align: center; }

/* ---- 載入 ---- */
#loading { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: linear-gradient(#9AD6FA, #FFF3E2); transition: opacity .7s; }
#loading .card { text-align: center; }
#loading .logo { width: 96px; height: 96px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; font-size: 46px; background: conic-gradient(from 200deg, var(--pink), var(--butter), var(--mint), var(--sky), var(--lav), var(--pink)); box-shadow: inset 0 0 0 8px #fff, var(--shadow); animation: spin 3s linear infinite; }
#loading h2 { font: 400 28px var(--round); margin: 0 0 6px; }
#loading p { margin: 0; color: var(--ink2); font-weight: 700; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- 彈窗 ---- */
dialog#dlg { border: 0; padding: 0; background: transparent; width: min(640px, 94vw); max-height: 88vh; overflow: visible; color: var(--ink); }
dialog#dlg::backdrop { background: rgba(70, 50, 40, .35); backdrop-filter: blur(3px); }
dialog#dlg[open] { animation: pop .38s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes pop { from { transform: translateY(30px) scale(.9); opacity: 0; } }
.sheet { background: var(--cream); border: 4px solid #fff; border-radius: 30px; box-shadow: 0 24px 60px rgba(80, 50, 30, .35); overflow: hidden; display: flex; flex-direction: column; max-height: 88vh; }
.sh-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px 14px; background: var(--hc, var(--pink2)); position: relative; }
.sh-head .av { width: 62px; height: 62px; border-radius: 50%; border: 4px solid #fff; background: #fff center/cover; flex: 0 0 auto; display: grid; place-items: center; font-size: 30px; box-shadow: 0 6px 14px rgba(0, 0, 0, .1); }
.sh-head .tag { display: inline-block; font-size: 12px; font-weight: 900; background: #fff; border-radius: 999px; padding: 2px 10px; letter-spacing: .05em; }
.sh-head h2 { margin: 4px 0 0; font: 400 24px/1.2 var(--round); }
.sh-head .x { position: absolute; right: 12px; top: 12px; width: 38px; height: 38px; border-radius: 50%; border: 3px solid #fff; background: rgba(255, 255, 255, .7); font-size: 18px; font-weight: 900; }
.say { margin: 0 18px; transform: translateY(-8px); background: #fff; border-radius: 16px; padding: 9px 14px; font-size: 14.5px; font-weight: 500; box-shadow: 0 6px 14px rgba(120, 80, 40, .1); position: relative; }
.say::before { content: ""; position: absolute; left: 30px; top: -8px; border: 8px solid transparent; border-bottom-color: #fff; border-top: 0; }
.sh-body { padding: 4px 18px 20px; overflow-y: auto; }
.sec { margin: 14px 0 0; }
.sec h3 { margin: 0 0 8px; font: 400 18px var(--round); display: flex; align-items: center; gap: 8px; }
.demo { font: 700 11px var(--font); background: var(--butter); border-radius: 999px; padding: 2px 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.card { background: #fff; border-radius: 18px; padding: 12px 14px; border: 2px solid var(--line); text-decoration: none; display: block; transition: transform .15s, box-shadow .15s; }
a.card:hover, button.card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(120, 80, 40, .12); }
.card .ic { font-size: 24px; }
.card b { display: block; font-size: 15px; margin: 4px 0 2px; }
.card span { font-size: 12.5px; color: var(--ink2); line-height: 1.45; display: block; }
button.card { text-align: left; width: 100%; font: inherit; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 11px 20px; font-weight: 900; font-size: 15px; background: var(--pink); color: #fff; text-decoration: none; box-shadow: 0 5px 0 #E0679A; transition: transform .1s, box-shadow .1s; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #E0679A; }
.btn.alt { background: var(--mint); box-shadow: 0 5px 0 #5FBD9C; color: #2F5E4E; }
.btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 5px 0 var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
table.hours { width: 100%; border-collapse: separate; border-spacing: 0 5px; font-size: 14.5px; }
table.hours td { background: #fff; padding: 8px 12px; }
table.hours td:first-child { border-radius: 12px 0 0 12px; font-weight: 700; width: 38%; }
table.hours td:last-child { border-radius: 0 12px 12px 0; }
table.hours tr.today td { background: var(--butter); }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 900; border-radius: 999px; padding: 4px 12px; background: var(--mint2); color: #2F7A5E; }
.status.closed { background: #F3E6E6; color: #A65B5B; }
.status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
ol.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
ol.rank li { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 14px; padding: 8px 12px; }
ol.rank .m { font-size: 22px; width: 30px; text-align: center; font-weight: 900; color: var(--ink2); }
ol.rank .t { flex: 1; } ol.rank .t b { display: block; } ol.rank .t small { color: var(--ink2); }
ol.rank a { font-size: 12.5px; font-weight: 700; background: var(--sky2); border-radius: 999px; padding: 4px 10px; text-decoration: none; white-space: nowrap; }
.search { display: flex; gap: 8px; background: #fff; border-radius: 20px; padding: 8px; border: 3px solid var(--sky); }
.search select, .search input { border: 0; font: inherit; font-size: 16px; background: transparent; color: var(--ink); outline: none; }
.search select { font-weight: 700; padding: 0 4px; border-right: 2px dashed var(--line); }
.search input { flex: 1; min-width: 0; padding: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 13.5px; font-weight: 700; }
.chip:hover { background: var(--sky2); }
.quiz .q { font: 400 19px var(--round); margin: 6px 0 12px; }
.quiz .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.quiz .opts button { border: 3px solid #fff; background: #fff; border-radius: 18px; padding: 14px 10px; font-weight: 700; font-size: 15px; box-shadow: 0 4px 0 var(--line); }
.quiz .opts button:hover { background: var(--pink2); }
.dots { display: flex; gap: 6px; } .dots i { width: 26px; height: 7px; border-radius: 9px; background: var(--line); } .dots i.on { background: var(--pink); }
.book { display: flex; gap: 10px; align-items: center; background: #fff; border-radius: 16px; padding: 10px; }
.book .cv { width: 44px; height: 60px; border-radius: 6px 10px 10px 6px; flex: 0 0 auto; box-shadow: inset 5px 0 0 rgba(0, 0, 0, .1); display: grid; place-items: center; font-size: 20px; }
.book b { display: block; font-size: 15px; } .book small { color: var(--ink2); display: block; }
.nb { display: grid; gap: 10px; }
.nbk { display: flex; gap: 12px; background: #fff; border-radius: 18px; padding: 12px; border: 2px solid var(--line); }
.nbk .cv { width: 62px; height: 86px; border-radius: 6px 12px 12px 6px; flex: 0 0 auto; box-shadow: inset 6px 0 0 rgba(0, 0, 0, .1); display: grid; place-items: center; font-size: 28px; }
.nbk b { font-size: 16px; } .nbk dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 6px 0; font-size: 13px; }
.nbk dt { font-weight: 900; color: var(--ink2); } .nbk dd { margin: 0; } .nbk p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--ink); }
.posters { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.pview { position: absolute; inset: 0; z-index: 5; background: rgba(40, 30, 25, .9); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px; border-radius: inherit; cursor: zoom-out; }
.pview img { max-width: 100%; max-height: calc(100% - 50px); border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); } .pview p { color: #fff; font-weight: 900; margin: 10px 0 0; text-align: center; }
.pview button { position: absolute; right: 14px; top: 14px; width: 38px; height: 38px; border-radius: 50%; border: 0; font-weight: 900; }
.sheet { position: relative; } button.poster { font: inherit; color: inherit; width: 100%; cursor: zoom-in; }
.poster { display: block; background: #fff; border-radius: 18px; padding: 10px; border: 2px solid var(--line); text-decoration: none; text-align: center; }
.poster img { width: 100%; border-radius: 10px; display: block; }
.poster.empty div { aspect-ratio: 3/4; border-radius: 10px; border: 3px dashed var(--line); display: grid; place-items: center; font-weight: 900; color: var(--ink2); font-size: 15px; line-height: 2; }
.poster b { display: block; margin-top: 8px; font-size: 14.5px; }
.timeline { display: grid; gap: 9px; }
.timeline .st { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: start; background: #fff; border-radius: 18px; padding: 10px 12px; }
.timeline .st .n { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 24px; }
.timeline .st b { display: block; font-size: 15.5px; } .timeline .st small { color: var(--ink2); font-weight: 700; } .timeline .st p { margin: 3px 0 0; font-size: 13.5px; line-height: 1.55; }
.wall { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.wall a { aspect-ratio: 3/4; border-radius: 10px; border: 5px solid #fff; box-shadow: 0 6px 14px rgba(120, 80, 40, .14); display: grid; place-items: center; text-decoration: none; text-align: center; font-weight: 700; font-size: 13px; padding: 6px; }
.wall a span { display: block; font-size: 26px; }
.radio { background: linear-gradient(#FFB48F, #FF9A78); border-radius: 26px; padding: 14px; box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .08); color: #5B3324; }
.radio .scr { background: #FFF6DA; border-radius: 16px; padding: 10px 14px; box-shadow: inset 0 3px 0 rgba(0, 0, 0, .08); }
.radio .scr b { display: block; font-size: 16px; } .radio .scr small { font-weight: 700; opacity: .75; }
.radio .ctl { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.radio .play { width: 54px; height: 54px; border-radius: 50%; border: 4px solid #fff; background: #FFE07A; font-size: 22px; flex: 0 0 auto; box-shadow: 0 4px 0 rgba(0, 0, 0, .12); }
.radio .bar { flex: 1; height: 10px; border-radius: 9px; background: rgba(255, 255, 255, .55); overflow: hidden; cursor: pointer; }
.radio .bar i { display: block; height: 100%; width: 0; background: #FFF6DA; }
.radio .tm { font-weight: 900; font-size: 13px; min-width: 74px; text-align: center; }
.radio .eq { display: flex; gap: 3px; align-items: flex-end; height: 22px; } .radio .eq i { width: 4px; background: #FFF6DA; border-radius: 3px; height: 30%; }
.radio.on .eq i { animation: eq .8s ease-in-out infinite alternate; } .radio .eq i:nth-child(2) { animation-delay: .2s; } .radio .eq i:nth-child(3) { animation-delay: .4s; } .radio .eq i:nth-child(4) { animation-delay: .1s; }
@keyframes eq { to { height: 100%; } }
.eps { display: grid; gap: 7px; } .eps button { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 9px 12px; text-align: left; font-weight: 700; display: flex; gap: 10px; align-items: center; }
.eps button.on { border-color: var(--peach); background: #FFF1E8; }
details.script { background: #fff; border-radius: 14px; padding: 10px 14px; } details.script summary { font-weight: 900; cursor: pointer; } details.script p { margin: 8px 0 0; line-height: 1.7; font-size: 14px; }
.quote { background: #fff; border-left: 6px solid var(--peach); border-radius: 12px; padding: 10px 14px; font: 400 16px/1.6 var(--round); }
.quote small { display: block; font: 700 12.5px var(--font); color: var(--ink2); margin-top: 4px; }
.mark { text-align: center; } .mark img { width: min(300px, 78%); border-radius: 18px; box-shadow: 0 14px 30px rgba(120, 80, 40, .25); -webkit-touch-callout: default; user-select: auto; }
.mark p { font-size: 13px; color: var(--ink2); font-weight: 700; }
.foot { margin-top: 16px; font-size: 12.5px; color: var(--ink2); text-align: center; line-height: 1.6; }
.res .card { display: flex; gap: 10px; align-items: flex-start; } .res .card .ic { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex: 0 0 auto; }
.nogl { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 30px; font-weight: 700; }

@media (max-width: 640px) {
  .brand { padding-right: 12px; } .brand .logo { width: 38px; height: 38px; font-size: 18px; }
  .brand h1 { font-size: 17px; } .brand small { font-size: 10px; letter-spacing: 0; } .brand small b { display: none; }
  .tbtn { padding: 7px 10px; font-size: 13px; } .tbtn span { display: none; }
  .pin { font-size: 10px; padding: 2px 3px; } .pin .lt { display: none; } .pin i { width: 15px; height: 15px; font-size: 9px; }
  .dock button { min-width: 44px; font-size: 9.5px; padding: 4px 3px; } .dock button b { font-size: 16px; } .ctxt b { font-size: 18px; } .dock .cface { width: 34px; height: 34px; min-width: 34px; }
  dialog#dlg { width: 100vw; max-width: 100vw; margin: auto 0 0; max-height: 90vh; }
  .sheet { border-radius: 26px 26px 0 0; max-height: 90vh; padding-bottom: env(safe-area-inset-bottom); }
  .sh-head h2 { font-size: 20px; } .sh-head .av { width: 52px; height: 52px; }
  .quiz .opts { grid-template-columns: 1fr; } .wall { grid-template-columns: repeat(2, 1fr); }
  .hint { font-size: 12px; bottom: calc(84px + env(safe-area-inset-bottom)); }
}
/* ===== 介面質感優化：柔霧玻璃、細緻陰影 ===== */
:root { --glass: rgba(255, 252, 245, .78); --glass-b: rgba(255, 255, 255, .9); --soft: 0 1px 0 rgba(255, 255, 255, .9) inset, 0 12px 32px -8px rgba(110, 70, 40, .28), 0 2px 6px rgba(110, 70, 40, .08); }
.brand, .tbtn, .dock { background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5); border: 1.5px solid var(--glass-b); box-shadow: var(--soft); transition: background .6s, color .6s, border-color .6s; }
.brand { padding: 5px 18px 5px 5px; }
.brand .logo { background: linear-gradient(135deg, #FFD6E5, #FFF3C4 45%, #D7F5EA); box-shadow: inset 0 0 0 3px #fff, 0 3px 8px rgba(255, 143, 184, .35); }
.brand h1 { background: linear-gradient(90deg, #6B4A36, #C2577E 60%, #6B4A36); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px 7px 9px; font-size: 13.5px; }

function openStatus() {
  const d = new Date(), wd = d.getDay(), hm = d.getHours() * 60 + d.getMinutes(), row = CONFIG.hours.find(h => h.d.includes(wd));
  if (!row || !row.open) return { open: false, row };
  const [oh, om] = row.open.split(':').map(Number), [ch, cm] = row.close.split(':').map(Number);
  return { open: hm >= oh * 60 + om && hm < ch * 60 + cm, row };
}

  pl.onclick = () => {

function spinGacha() {
