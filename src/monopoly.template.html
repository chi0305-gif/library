<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

const rnd = n => Math.floor(Math.random() * n);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif', RFONT = '"Huninn","Noto Sans TC",sans-serif';

  floatText(p, (d > 0 ? '+' : '') + d + ' ⚡', d > 0 ? '#20A36B' : '#E0457B');
  renderPlayers(); if (why) log(`${p.av} ${esc(p.name)} ${why} <b style="color:${d >= 0 ? '#20A36B' : '#E0457B'}">${d > 0 ? '+' : ''}${d}</b>`);
}
const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
function renderPlayers() {
  const box = $('#players'); box.innerHTML = '';
  S.ps.forEach((p, k) => {
    const d = document.createElement('div'); d.className = `pcard glass p${k}` + (S.ps[S.cur] === p && !S.over ? ' turn' : '') + (p.out ? ' out' : ''); d.style.setProperty('--pc', p.c);
    const mine = Object.entries(S.own).filter(([, o]) => o.p === p.id);
    d.innerHTML = `<span class="tag">回合中</span><div class="row"><span class="av">${p.av}</span><div><div class="nm"><i></i>${esc(p.name)}${p.bot ? '・電腦' : ''}</div><div class="money">${p.m.toLocaleString()} <small>⚡</small></div><div class="sub">總資產 ${assets(p).toLocaleString()}・主題 ${mine.length}</div></div></div>
      <div class="chips">${mine.map(([i, o]) => `<span title="${TILES[i].name}" style="background:${GROUPS[TILES[i].g].c}">${o.lv ? o.lv : ''}</span>`).join('')}</div>${p.jail ? '<div class="st">🧩 卡關中</div>' : ''}${p.out ? '<div class="st">暫時休學</div>' : ''}`;
    box.appendChild(d);
  });
  $('#roundChip').textContent = `第 ${Math.min(S.round, S.maxR || S.round)} 回合` + (S.maxR ? ` / ${S.maxR}` : '・無限制') + (S.pot ? `・寶庫 ${S.pot}⚡` : '');
}

// 對話框
const dlg = $('#dlg'), dc = $('#dc');
function ask({ icon = '🎲', tag = '', title, html = '', color = '#F3EAFF', ink = '#6D4BD8', btn = '#8B6CF0', buttons = [{ t: '好', v: true, main: true }], col = false, bot }) {
  return new Promise(res => {
    dc.style.setProperty('--dc', color); dc.style.setProperty('--di', ink); dc.style.setProperty('--dbtn', btn);
    const cur = S && S.ps[S.cur], isBot = cur && cur.bot && bot !== undefined;
    dc.innerHTML = `<div class="dh"><span class="ic">${icon}</span><div><small>${tag}</small><h2>${title}</h2></div></div><div class="db">${html}</div>
      <div class="df${col ? ' col' : ''}">${buttons.map((b, k) => `<button class="b${b.main ? ' main' : ''}" data-k="${k}" ${isBot ? 'disabled' : ''}>${b.t}</button>`).join('')}</div>${isBot ? `<div class="bot">${cur.av} ${esc(cur.name)} 思考中…</div>` : ''}`;
    const done = v => { dlg.close(); res(v); };
    dc.querySelectorAll('.df .b').forEach(b => (b.onclick = () => done(buttons[+b.dataset.k].v)));
    dlg.oncancel = e => { e.preventDefault(); };
    if (!dlg.open) dlg.showModal();
    if (isBot) setTimeout(() => done(typeof bot === 'function' ? bot() : bot), reduceMotion ? 300 : 1300);
  });
}

    html: `<div class="card3d" style="background:${col}">${c.t}<div style="margin-top:8px;font-size:17px;background:rgba(255,255,255,.25);border-radius:10px;padding:4px">${c.e}</div></div>`, buttons: [{ t: '好！', v: 1, main: true }], bot: 1 });
  log(`${p.av} ${esc(p.name)} 抽到${kind === 'c' ? '💡' : '💭'}「${c.t}」`);

}
async function resolve(p, fromCard) {
  const i = p.pos, t = TILES[i];
  if (t.t === 'topic') {
    const o = S.own[i], g = GROUPS[t.g];
    if (!o) {
      const can = p.m >= t.price;
      const v = await ask({ icon: '📗', tag: `${g.name}・自學主題`, title: `要選修「${t.name}」嗎？`, color: g.c + '33', ink: g.c, btn: g.c,
        html: `花費 <b>${t.price} ⚡</b> 選修這個主題，進入「📝 擬定計畫」階段。<br>之後再走到這裡，就能繼續深耕升級！<div class="tip">💡 ${t.tip}</div>${can ? '' : '<div class="tip" style="background:#FFF0F5">能量不足，這次先觀望吧！</div>'}`,
        buttons: can ? [{ t: '先不要', v: 0 }, { t: `選修（${t.price}⚡）`, v: 1, main: true }] : [{ t: '好吧', v: 0, main: true }], bot: () => (can && p.m - t.price >= 150 ? 1 : 0) });
      if (v) { money(p, -t.price); S.own[i] = { p: p.id, lv: 0 }; refreshTile(i); SFX.kaching(); log(`${p.av} ${esc(p.name)} 選修了 <b style="color:${g.c}">${t.name}</b>`); if (ownsGroup(p.id, t.g)) toast(`${p.name} 集滿「${g.name}」！交流費 ×1.5`); }
    } else if (o.p === p.id) {

        const c = upCost(t), nx = LV[o.lv + 1], can = p.m >= c;
        const v = await ask({ icon: nx.e, tag: '繼續深耕', title: `把「${t.name}」推進到「${nx.n}」？`, color: g.c + '33', ink: g.c, btn: g.c,
          html: `目前階段：${LV[o.lv].e} ${LV[o.lv].n} → 下一步：${nx.e} <b>${nx.n}</b><br>花費 <b>${c} ⚡</b>，同學來請教你時的交流費會提高！<div class="tip">🌱 自主學習就是這樣一步步累積：計畫 → 紀錄 → 成果 → 發表。</div>`,
          buttons: can ? [{ t: '下次再說', v: 0 }, { t: `升級（${c}⚡）`, v: 1, main: true }] : [{ t: '能量不足', v: 0, main: true }], bot: () => (can && p.m - c >= 200 ? 1 : 0) });
        if (v) { money(p, -c); o.lv++; refreshTile(i); SFX.build(); log(`${p.av} ${esc(p.name)} 的 ${t.name} 進入 ${nx.e}${nx.n}`); if (o.lv === 3) { toast(`🏆 ${p.name} 完成「${t.name}」成果發表！`); confetti(40); } }
      } else { await ask({ icon: '🏆', tag: '成果發表完成', title: `「${t.name}」已經完整發表！`, html: '你在這個主題已經走完整個自主學習歷程，獲得 30 能量的成就感！', buttons: [{ t: '太棒了', v: 1, main: true }], bot: 1 }); money(p, 30, '成就感'); }
    } else {
      const ow = P(o.p), r = rentOf(i);
      await ask({ icon: ow.av, tag: '向同學請教', title: `${ow.name} 的「${t.name}」`, color: g.c + '33', ink: g.c, btn: g.c,
        html: `${esc(ow.name)} 已經在這個主題走到「${LV[o.lv].e} ${LV[o.lv].n}」。<br>你向他請教，支付交流費 <b>${r} ⚡</b>，他也因為教學相長獲得能量！`, buttons: [{ t: `支付 ${r}⚡`, v: 1, main: true }], bot: 1 });

  else if (t.t === 'reflect') await drawCard(p, 'r');

  else if (t.t === 'library') { const g = S.pot + 50; await ask({ icon: '📚', tag: '圖書館寶庫', title: `領取寶庫能量 ${g} ⚡`, html: '找到好書、好資料庫，大家拖延時繳的能量也都歸你了！', buttons: [{ t: '領取', v: 1, main: true }], bot: 1 }); S.pot = 0; money(p, g, '在圖書館寶庫找到寶藏'); }
  else if (t.t === 'monster') { await ask({ icon: '👾', tag: '拖延怪獸', title: '被拖延怪獸咬了一口！', html: '一直滑手機、明天再說……<br>支付 100 能量到圖書館寶庫。', color: '#F5E9FF', buttons: [{ t: '下次不拖延了', v: 1, main: true }], bot: 1 }); money(p, -100, '被拖延怪獸咬'); S.pot += 100; }
  else if (t.t === 'audit') { if (await quiz(p, '審核關卡')) money(p, 150, '通過計畫審核'); else await goJail(p); }
  else if (t.t === 'jail' && !fromCard) toast('只是路過卡關休息站～');

}
async function checkBroke(p) {
  if (p.m >= 0) return;
  const mine = Object.entries(S.own).filter(([, o]) => o.p === p.id).sort((a, b) => TILES[a[0]].price - TILES[b[0]].price);
  while (p.m < 0 && mine.length) { const [i, o] = mine.shift(); const back = Math.round((TILES[i].price + o.lv * upCost(TILES[i])) / 2); p.m += back; delete S.own[i]; refreshTile(+i); log(`${p.av} ${esc(p.name)} 放棄 ${TILES[i].name}，回收 ${back}`); }
  if (p.m < 0) { p.out = true; pawns[p.id].visible = false; log(`${p.av} ${esc(p.name)} 能量耗盡，暫時休學`); await ask({ icon: '😵', tag: '能量耗盡', title: `${p.name} 暫時休學了`, html: '能量用完了……休息一下，下次再挑戰！', buttons: [{ t: '好', v: 1, main: true }] }); }
  renderPlayers();
}
async function takeTurn() {
  if (S.over) return;

  const p = cur(); setRing(); renderPlayers(); save();
  
  if (p.jail) {
    $('#turnTxt').innerHTML = `${p.av} <b>${esc(p.name)}</b> 在卡關休息站`;
    const v = await ask({ icon: '🧩', tag: '卡關休息站', title: `${p.name} 卡關中`, html: '挑戰一題自主學習測驗，答對就能脫困並立刻擲骰；或乖乖休息一回合。', buttons: [{ t: '休息一回合', v: 0 }, { t: '答題脫困', v: 1, main: true }], bot: 1 });
    if (stop()) return;
    if (v && await quiz(p, '脫困挑戰')) { p.jail = 0; toast('成功脫困！'); }
    else { p.jail = 0; log(`${p.av} ${esc(p.name)} 在卡關休息站休息一回合`); return endTurn(); }
  }
  let doubles = 0;
  for (;;) {
    await waitRoll(p); if (stop()) return;
    const [a, b] = await rollDice(); if (stop()) return; log(`${p.av} ${esc(p.name)} 擲出 🎲${a} + 🎲${b} = <b>${a + b}</b>`);
    $('#turnTxt').innerHTML = `${p.av} <b>${esc(p.name)}</b> 前進 ${a + b} 步`;
    await moveSteps(p, a + b); if (stop()) return;
    await resolve(p); if (stop()) return;
    if (p.out || p.jail || S.over) break;
    if (p.again) { p.again = false; toast('再擲一次！'); continue; }
    if (a === b && doubles < 1) { doubles++; toast('擲出相同點數！再擲一次'); continue; }
    break;
  }

}
function endTurn() {
  if (S.over) return;
  const alive = S.ps.filter(p => !p.out);
  if (alive.length <= 1) return endGame();
  let n = S.cur;
  do { n = (n + 1) % S.ps.length; if (n === 0) S.round++; } while (S.ps[n].out);
  S.cur = n;
  if (S.maxR && S.round > S.maxR) return endGame();
  save(); setTimeout(takeTurn, 200);
}
const TITLES = ['🏆 自學大師', '🥈 深耕達人', '🥉 好奇探險家', '🌱 潛力新星'];
async function endGame() {

  const rank = S.ps.slice().sort((a, b) => assets(b) - assets(a)); SFX.win(); confetti(100);

  const v = await ask({ icon: '🎓', tag: '本局結算', title: `${rank[0].name} 成為本局自學大師！`, color: '#FFF6D6', ink: '#A86B00', btn: '#FFB81C',
    html: `<table>${rows}</table><div class="tip">🌱 遊戲裡的四個階段，就是真實的自主學習：<b>擬定計畫 → 每週紀錄 → 產出成果 → 成果發表</b>。現在就去圖資中心領一張申請表吧！</div>`, buttons: [{ t: '再玩一局', v: 1, main: true }] });

function confetti(n) { if (reduceMotion) return; const box = document.createElement('div'); box.className = 'confetti'; const C = ['#FF7EB6', '#FFC23D', '#4FA8F5', '#3DD6B5', '#A78BFA']; for (let k = 0; k < n; k++) { const i = document.createElement('i'); i.style.left = Math.random() * 100 + 'vw'; i.style.background = C[k % 5]; i.style.animationDuration = 2 + Math.random() * 2 + 's'; i.style.animationDelay = Math.random() * 0.5 + 's'; box.appendChild(i); } document.body.appendChild(box); setTimeout(() => box.remove(), 4500); }

// ===================== 開場設定 =====================
function renderSetup() {
  const box = $('#slots'); box.innerHTML = '';
  setup.slots.forEach((s, k) => {
    const d = document.createElement('div'); d.className = 'slot' + (s.on ? '' : ' off'); d.style.setProperty('--pc', PCOL[k]);

      <div class="seg">${k < 2 ? '' : `<button type="button" data-a="off" class="${s.on ? '' : 'on'}">不參加</button>`}<button type="button" data-a="human" class="${s.on && !s.bot ? 'on' : ''}">👤 玩家</button><button type="button" data-a="bot" class="${s.on && s.bot ? 'on' : ''}">🤖 電腦</button></div>`;

}
function openSetup() { renderSetup(); let saved = null; try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {} $('#resume').hidden = !(saved && !saved.over); $('#setup').hidden = false; }
function beginGame(state) {

$('#bNew').onclick = async () => { if (dlg.open) return; const v = await ask({ icon: '🔁', title: '要重新開始嗎？', html: '目前的進度會結束。', buttons: [{ t: '取消', v: 0 }, { t: '重新開始', v: 1, main: true }] }); if (v) { S.over = true; rollResolve = null; openSetup(); } };
$('#bEnd').onclick = async () => { if (dlg.open || !S || S.over) return; const v = await ask({ icon: '🏁', title: '現在就結算嗎？', html: '依總資產（能量＋主題價值）排名。', buttons: [{ t: '再玩一下', v: 0 }, { t: '結算', v: 1, main: true }] }); if (v) { rollResolve = null; endGame(); } };
$('#bRules').onclick = () => !dlg.open && ask({ icon: '📖', tag: '遊戲規則', title: '怎麼玩？', html: `<b>🎲 擲骰前進</b>：輪到你時按「擲骰子」，經過起點 +200。擲出相同點數可再擲一次。<br><b>📗 自學主題</b>：沒人選修 → 可花能量選修；自己的 → 可升級；別人的 → 支付交流費。<br><b>💡 靈感卡 / 💭 反思卡</b>：抽卡看看好習慣與壞習慣帶來的影響。<br><b>❓ 小測驗 / 🛂 審核關卡</b>：答對有能量；審核答錯要到卡關休息站。<br><b>👾 拖延怪獸</b>：支付 100 到圖書館寶庫，停在 📚 的人可以全部領走。<br><b>🏁 結束</b>：回合數到了或只剩一人時，總資產最高的人獲勝。`, buttons: [{ t: '開始玩', v: 1, main: true }] });
