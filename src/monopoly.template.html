<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>四維自學大富翁</title>
<meta name="description" content="花蓮縣私立四維高級中學 圖書資訊中心｜擲骰子、選修主題、寫紀錄、拿成果：用大富翁玩懂自主學習。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
<!-- 3D 引擎：three.js（MIT License） -->
<style>
/* 主題：療癒小島生活風。奶油色圓角面板、咖啡色文字、草綠與檸檬黃按鈕、對話泡泡 */
:root {
  color-scheme: light;
  --cream: #FFF9E8; --cream2: #F7EED3; --brown: #6E5A3E; --brown2: #9A8463; --muted: #B3A27F;
  --leaf: #79C55A; --leaf-d: #4FA23A; --sun: #FFD84D; --sun-d: #E8B21C; --sky: #7FD3F0; --coral: #FF8A7A; --pink: #F7A3C0;
  --round: 'Huninn', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --sans: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --soft: 0 4px 0 rgba(150,120,70,.18), 0 10px 24px rgba(110,90,62,.16);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; font: 15px/1.5 var(--round); color: var(--brown); background: #8ED8F2; }
button { font: inherit; cursor: pointer; color: inherit; }
#bg { position: fixed; inset: 0; background: linear-gradient(180deg, #6CC8EE 0%, #A8E2F5 55%, #E6F7FB 100%); }
#scene { position: fixed; inset: 0; touch-action: none; }
#scene canvas { display: block; width: 100%; height: 100%; outline: none; cursor: grab; }
.glass { background: var(--cream); border-radius: 26px; box-shadow: var(--soft); }

#brand { position: fixed; left: 16px; top: 14px; z-index: 20; border-radius: 999px; padding: 8px 22px 8px 10px; display: flex; gap: 10px; align-items: center; background: var(--cream); box-shadow: var(--soft); }
#brand .logo { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; background: var(--leaf); box-shadow: inset 0 -4px 0 var(--leaf-d); }
#brand h1 { margin: 0; font: 400 24px/1.1 var(--round); color: var(--brown); letter-spacing: 1px; }
#brand .chip { display: inline-block; margin-top: 3px; font: 400 12.5px var(--round); color: #fff; background: var(--brown2); padding: 1px 12px; border-radius: 999px; }

#tools { position: fixed; right: 16px; top: 14px; z-index: 20; display: flex; gap: 6px; }
.tb { height: 42px; padding: 0 15px; border-radius: 999px; border: 0; background: var(--cream); box-shadow: 0 4px 0 rgba(150,120,70,.22); font: 400 14px var(--round); color: var(--brown); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: transform .15s; }
.tb:hover { transform: translateY(-2px) scale(1.04); }
.tb:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(150,120,70,.22); }
.tb.on { background: #E9E0C8; color: var(--muted); }
.tb.hot { background: var(--leaf); color: #fff; box-shadow: 0 4px 0 var(--leaf-d); }
#zoom { position: fixed; right: 16px; top: 66px; z-index: 20; display: flex; gap: 6px; }
#zoom .tb { width: 42px; padding: 0; justify-content: center; font-size: 20px; }
#menuBtns { position: fixed; right: 16px; bottom: 16px; z-index: 20; display: grid; grid-template-columns: repeat(2, auto); gap: 6px; }

/* 玩家：島民名牌 */
#players { position: fixed; z-index: 20; inset: 0; pointer-events: none; }
.pcard { position: absolute; width: 224px; border-radius: 28px; pointer-events: auto; background: var(--cream); box-shadow: var(--soft); padding: 0; transition: transform .3s cubic-bezier(.2,1.5,.4,1); }
.pcard .hd { position: absolute; left: 66px; top: -14px; background: var(--pc); color: #fff; border-radius: 999px; padding: 3px 14px; font: 400 14px var(--round); box-shadow: 0 3px 0 rgba(0,0,0,.12); transform: rotate(-3deg); }
.pcard.p0 { left: 16px; top: 120px; } .pcard.p1 { right: 16px; top: 120px; } .pcard.p2 { left: 16px; top: 250px; } .pcard.p3 { right: 16px; top: 250px; }
.pcard.turn { transform: scale(1.05); box-shadow: 0 0 0 4px var(--pc), var(--soft); }
.pcard.out { opacity: .45; filter: grayscale(.8); }
.pcard .tag { position: absolute; right: -6px; top: -16px; font: 400 13px var(--round); padding: 3px 12px; border-radius: 999px; background: var(--sun); color: var(--brown); box-shadow: 0 3px 0 var(--sun-d); display: none; animation: hop 1s ease-in-out infinite; }
@keyframes hop { 50% { transform: translateY(-5px); } }
.pcard.turn .tag { display: block; }
.pcard .av { position: absolute; left: 10px; top: 14px; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; background: #fff; box-shadow: 0 0 0 4px var(--pc); }
.pcard .bd { padding: 20px 14px 12px 72px; }
.pcard .money { font: 400 24px/1.1 var(--round); color: var(--brown); }
.pcard .money small { font-size: 14px; color: var(--muted); }
.pcard .sub { font: 500 12px var(--sans); color: var(--brown2); margin-top: 2px; }
.pcard .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.pcard .chips span { width: 16px; height: 16px; border-radius: 50%; font: 700 9px var(--sans); color: #fff; display: grid; place-items: center; }
.pcard .st { font: 400 13px var(--round); color: var(--coral); margin-top: 3px; }

#dock { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 10px; }
#turnTxt { font: 400 15px var(--round); padding: 6px 20px; border-radius: 999px; }
#rollBtn { border: 0; font: 400 24px var(--round); letter-spacing: 3px; padding: 14px 46px; border-radius: 999px; color: var(--brown); background: var(--sun); box-shadow: 0 6px 0 var(--sun-d), 0 14px 26px rgba(232,178,28,.35); transition: transform .15s; }
#rollBtn:hover:not(:disabled) { transform: translateY(-3px) scale(1.04); }
#rollBtn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--sun-d); }
#rollBtn:disabled { filter: grayscale(.6); opacity: .7; cursor: default; }
#rollBtn.pulse:not(:disabled) { animation: hop 1.2s ease-in-out infinite; }
#credit { font: 400 12px var(--round); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.25); }

#log { position: fixed; left: 16px; bottom: 16px; z-index: 20; width: 270px; max-height: 180px; overflow: hidden; border-radius: 24px; padding: 12px 16px; font-size: 13px; }
#log b { display: block; font: 400 13px var(--round); color: #fff; background: var(--leaf); width: max-content; padding: 1px 12px; border-radius: 999px; margin-bottom: 4px; }
#log div { padding: 3px 0; border-bottom: 2px dotted #E8DCBC; font: 500 12.5px/1.45 var(--sans); }
#log div:last-child { border: 0; }

#toast { position: fixed; left: 50%; top: 86px; transform: translateX(-50%) translateY(-12px) scale(.9); opacity: 0; z-index: 60; background: var(--cream); color: var(--brown); padding: 10px 22px; border-radius: 999px; transition: all .3s cubic-bezier(.2,1.5,.4,1); pointer-events: none; white-space: nowrap; box-shadow: var(--soft); font: 400 16px var(--round); }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
.float { position: fixed; z-index: 30; font: 400 24px var(--round); pointer-events: none; text-shadow: 0 2px 0 #fff, 0 0 10px #fff; animation: up 1.4s ease-out forwards; }
@keyframes up { to { transform: translateY(-60px); opacity: 0; } }

/* 對話框：對話泡泡＋名牌 */
dialog { border: 0; padding: 0; background: transparent; overflow: visible; max-width: calc(100vw - 20px); }
dialog::backdrop { background: rgba(80,60,30,.18); }
.dc { position: relative; width: min(480px, calc(100vw - 24px)); border-radius: 40px; background: var(--cream); box-shadow: 0 6px 0 rgba(150,120,70,.2), 0 20px 50px rgba(80,60,30,.25); overflow: visible; animation: pop .35s cubic-bezier(.2,1.6,.4,1); margin-top: 26px; }
@keyframes pop { from { transform: scale(.7) translateY(20px); opacity: 0; } }
.dh { padding: 30px 28px 6px; display: flex; gap: 14px; align-items: center; }
.dh .ic { width: 60px; height: 60px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 32px; flex: 0 0 auto; box-shadow: 0 0 0 4px var(--dbtn, var(--leaf)); }
.dh small { position: absolute; left: 30px; top: -16px; font: 400 15px var(--round); color: #fff; background: var(--dbtn, var(--leaf)); padding: 4px 18px; border-radius: 999px; transform: rotate(-3deg); box-shadow: 0 3px 0 rgba(0,0,0,.12); }
.dh small:empty { display: none; }
.dh h2 { margin: 0; font: 400 22px/1.35 var(--round); color: var(--brown); }
.db { padding: 10px 28px 6px; font: 500 15px/1.75 var(--sans); color: var(--brown); max-height: 52vh; overflow-y: auto; }
.db b { color: #4A3B26; }
.db .tip { background: #F2E9CC; border-radius: 18px; padding: 9px 14px; margin-top: 10px; font-size: 14px; }
.db table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
.db td { padding: 6px 4px; border-bottom: 2px dotted #E8DCBC; }
.db td:last-child { text-align: right; font-weight: 700; }
.df { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding: 12px 26px 26px; }
.df .b { border: 0; border-radius: 999px; padding: 11px 22px; font: 400 16px var(--round); background: #fff; color: var(--brown); box-shadow: 0 4px 0 #E3D5B3; transition: transform .15s; }
.df .b:hover:not(:disabled) { transform: translateY(-2px); }
.df .b:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #E3D5B3; }
.df .b.main { background: var(--dbtn, var(--leaf)); color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.16); }
.df.col { flex-direction: column; } .df.col .b { text-align: left; border-radius: 22px; font: 500 15px var(--sans); padding: 12px 18px; }
.df.col .b:hover { background: #FFF2B8; }
.bot { font: 400 13px var(--round); color: var(--muted); padding: 0 28px 18px; text-align: right; }
.card3d { margin: 4px auto 0; width: 240px; border-radius: 26px; padding: 18px; text-align: center; color: var(--brown); font: 400 17px/1.6 var(--round); background: #fff !important; box-shadow: 0 4px 0 #E3D5B3; animation: flip .6s cubic-bezier(.2,1.4,.4,1); }
.card3d > div { background: #FFF2B8 !important; }
@keyframes flip { from { transform: rotateY(160deg) scale(.6); } }

#setup { position: fixed; inset: 0; z-index: 50; display: grid; padding: 16px; background: rgba(120,200,235,.45); overflow-y: auto; }
#setup[hidden] { display: none; }
.sc { position: relative; margin: auto; width: min(780px, 100%); border-radius: 44px; padding: 34px 30px 28px; background: var(--cream); box-shadow: 0 8px 0 rgba(150,120,70,.2), 0 26px 60px rgba(80,60,30,.25); }
.sc h2 { margin: 0; font: 400 clamp(30px, 5vw, 44px)/1.15 var(--round); color: var(--brown); }
.sc h2::before { content: "歡迎來到自學小島"; display: inline-block; font: 400 15px var(--round); color: #fff; background: var(--leaf); padding: 3px 16px; border-radius: 999px; margin-bottom: 10px; box-shadow: 0 3px 0 var(--leaf-d); transform: rotate(-2deg); }
.sc h2 { display: flex; flex-direction: column; align-items: flex-start; }
.sc .lead { margin: 10px 0 18px; font: 500 15px/1.85 var(--sans); }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 10px; margin-bottom: 18px; }
.how div { background: #fff; border-radius: 22px; padding: 12px 14px; font: 500 13px var(--sans); color: var(--brown2); box-shadow: 0 4px 0 #EDE2C4; }
.how b { display: block; font: 400 16px var(--round); color: var(--brown); margin-bottom: 2px; }
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 165px), 1fr)); gap: 12px; margin-bottom: 16px; }
.slot { border-radius: 26px; padding: 12px; display: grid; gap: 8px; background: #fff; box-shadow: 0 4px 0 #EDE2C4; }
.slot.off { opacity: .5; }
.slot .top { display: flex; gap: 8px; align-items: center; }
.slot .av { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; background: var(--cream); border: 0; box-shadow: 0 0 0 4px var(--pc); flex: 0 0 auto; }
.slot .chn { font: 400 12px var(--round); color: var(--brown2); text-align: center; margin-top: 4px; }
.slot input { width: 100%; border: 0; border-radius: 999px; padding: 7px 12px; font: 400 15px var(--round); color: var(--brown); background: var(--cream2); }
.slot .seg { display: flex; gap: 4px; }
.slot .seg button { flex: 1; border: 0; background: var(--cream2); border-radius: 999px; padding: 5px 0; font: 400 13px var(--round); }
.slot .seg button.on { background: var(--pc); color: #fff; }
.opts2 { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 22px; font: 400 15px var(--round); }
.opts2 button { border: 0; background: #fff; border-radius: 999px; padding: 6px 16px; font: 400 14px var(--round); box-shadow: 0 3px 0 #EDE2C4; }
.opts2 button.on { background: var(--leaf); color: #fff; box-shadow: 0 3px 0 var(--leaf-d); }
.go { border: 0; font: 400 22px var(--round); letter-spacing: 2px; padding: 14px 40px; border-radius: 999px; color: var(--brown); background: var(--sun); box-shadow: 0 6px 0 var(--sun-d); }
.go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sun-d); }
.go.alt { background: #fff; box-shadow: 0 6px 0 #E3D5B3; font-size: 18px; }
.gos { display: flex; gap: 14px; flex-wrap: wrap; }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 11px; height: 11px; border-radius: 50% 50% 50% 0; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

@media (max-width: 760px) {
  #brand { left: 8px; top: 8px; padding: 5px 14px 5px 6px; gap: 6px; } #brand .logo { width: 34px; height: 34px; font-size: 18px; } #brand h1 { font-size: 17px; } #brand .chip { font-size: 11px; }
  #tools { right: 8px; top: 8px; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 46vw; } .tb { height: 34px; padding: 0 10px; font-size: 13px; } .tb .t { display: none; }
  #zoom { top: auto; bottom: 168px; right: 8px; flex-direction: column; } #zoom .tb { width: 36px; }
  .pcard { width: calc(50vw - 12px); border-radius: 20px; } .pcard .hd { left: 44px; font-size: 12px; padding: 2px 10px; } .pcard .av { width: 34px; height: 34px; font-size: 19px; left: 6px; top: 12px; }
  .pcard .bd { padding: 14px 8px 8px 48px; } .pcard .money { font-size: 18px; } .pcard .sub, .pcard .chips { display: none; }
  .pcard.p0 { left: 8px; top: 92px; } .pcard.p1 { right: 8px; top: 92px; left: auto; } .pcard.p2 { left: 8px; top: 162px; } .pcard.p3 { right: 8px; top: 162px; }
  #log { display: none; } #menuBtns { bottom: 8px; right: 8px; grid-template-columns: 1fr; } #menuBtns .tb { height: 32px; }
  #rollBtn { font-size: 20px; padding: 12px 34px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="bg"></div>
<div id="scene" aria-label="3D 大富翁棋盤：拖曳旋轉、滾輪或雙指縮放、點格子看說明"></div>

<header id="brand" class="glass"><span class="logo">🏝️</span><div><h1>四維自學大富翁</h1><span class="chip" id="roundChip">第 1 回合</span></div></header>
<nav id="tools" aria-label="工具">
  <button class="tb" id="bFull">⛶<span class="t"> 全螢幕</span></button>
  <button class="tb" id="bSfx">🔊<span class="t"> 音效</span></button>
  <button class="tb" id="bReset">🎥<span class="t"> 重設視角</span></button>
  <button class="tb" id="bSpin">🔄<span class="t"> 旋轉模式</span></button>
  <button class="tb hot" id="bFollow">📌<span class="t"> 視角跟隨</span></button>
</nav>
<div id="zoom"><button class="tb" id="zIn" aria-label="放大">＋</button><button class="tb" id="zOut" aria-label="縮小">－</button></div>
<div id="players"></div>
<div id="dock">
  <div id="turnTxt" class="glass">準備開始</div>
  <button id="rollBtn" disabled>🎲 擲骰子</button>
  <div id="credit">四維高中圖書資訊中心・自主學習推廣</div>
</div>
<div id="log" class="glass"><b>📜 遊戲紀錄</b><div id="logList"></div></div>
<div id="menuBtns">
  <button class="tb" id="bRules">📖 規則說明</button>
  <button class="tb" id="bLegend">🌱 升級說明</button>
  <button class="tb" id="bNew">🔁 重新開始</button>
  <button class="tb" id="bEnd">🏁 結算遊戲</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="setup">
  <div class="sc">
    <h2>四維自學大富翁 🎲</h2>
    <p class="lead">擲骰子走遍校園，在 16 個<b>思考站</b>回答自主學習的情境題、認領它們，一路<b>寫紀錄、產出成果、上台發表</b>！<br>同學走到你的主題，要向你「請教」並支付交流能量。遊戲結束時，總能量最高的人就是本局的<b>自學大師</b>。</p>
    <div class="how">
      <div><b>🎲 擲骰前進</b>經過「擬定計畫」可領 200 學習能量</div>
      <div><b>🤔 思考站</b>走到就要想一想：答對才能認領，再回來就能升級</div>
      <div><b>🌱 四個階段</b>擬定計畫 → 落實執行 → 產出成果 → 成果發表</div>
      <div><b>🏆 卡片與測驗</b>成果專區卡、紀錄表卡、自學小測驗，答對有獎勵</div>
    </div>
    <div class="slots" id="slots"></div>
    <div class="opts2">遊戲回合：<span id="roundOpts"></span></div>
    <div class="gos"><button class="go" id="start">開始遊戲 →</button><button class="go alt" id="resume" hidden>繼續上一局</button></div>
  </div>
</div>

<dialog id="dlg"><div class="dc" id="dc"></div></dialog>

<script>__THREE_JS__</script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = n => Math.floor(Math.random() * n);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif', RFONT = '"Huninn","Noto Sans TC",sans-serif';

// ===================== 遊戲資料 =====================
const GROUPS = {
  idea: { name: '主題發想', c: '#5DBB4A' }, goal: { name: '目標設定', c: '#3DB89A' }, plan: { name: '計畫規劃', c: '#F07FA8' }, res: { name: '找資源', c: '#F29A4A' },
  exec: { name: '執行紀錄', c: '#4E9BE8' }, time: { name: '時間管理', c: '#33B5D6' }, show: { name: '成果呈現', c: '#A579E8' }, refl: { name: '自我反思', c: '#E07CC4' }
};
const T = (t, name, extra = {}) => Object.assign({ t, name }, extra);
const TILES = [
  T('start', '擬定計畫', { icon: '📝', sub: '第 1-2 週・起點', desc: '確立自學主題與 18 週進度規劃，填妥計畫申請表並請指導教師簽名。每經過一次，領取 200 學習能量！' }),

    const v = await ask({ icon: '🧩', tag: '卡關休息站', title: `${p.name} 卡關中`, html: '挑戰一題自主學習測驗，答對就能脫困並立刻擲骰；或乖乖休息一回合。', buttons: [{ t: '休息一回合', v: 0 }, { t: '答題脫困', v: 1, main: true }], bot: 1 });
    if (stop()) return;
    if (v && await quiz(p, '脫困挑戰')) { p.jail = 0; toast('成功脫困！'); }
    else { p.jail = 0; log(`${p.av} ${esc(p.name)} 在卡關休息站休息一回合`); return endTurn(); }
  }
  let doubles = 0;
  for (;;) {
    await waitRoll(p); if (stop()) return;
    const [a, b] = await rollDice(); if (stop()) return; log(`${p.av} ${esc(p.name)} 擲出 🎲${a} + 🎲${b} = <b>${a + b}</b>`);
    $('#turnTxt').innerHTML = `${p.av} <b>${esc(p.name)}</b> 前進 ${a + b} 步`;
    await moveSteps(p, a + b); if (stop()) return;
    await resolve(p); if (stop()) return;
    if (p.out || p.jail || S.over) break;
    if (p.again) { p.again = false; toast('再擲一次！'); continue; }
    if (a === b && doubles < 1) { doubles++; toast('擲出相同點數！再擲一次'); continue; }
    break;
  }
  if (!stop()) endTurn();
}
function endTurn() {
  if (S.over) return;
  const alive = S.ps.filter(p => !p.out);
  if (alive.length <= 1) return endGame();
  let n = S.cur;
  do { n = (n + 1) % S.ps.length; if (n === 0) S.round++; } while (S.ps[n].out);
  S.cur = n;
  if (S.maxR && S.round > S.maxR) return endGame();
  save(); setTimeout(takeTurn, 200);
}
const TITLES = ['🏆 自學大師', '🥈 深耕達人', '🥉 好奇探險家', '🌱 潛力新星'];
async function endGame() {
  S.over = true; save(); renderPlayers(); rollBtn.disabled = true; $('#turnTxt').textContent = '遊戲結束！';
  const rank = S.ps.slice().sort((a, b) => assets(b) - assets(a)); SFX.win(); confetti(100);
  const rows = rank.map((p, k) => { const mine = Object.entries(S.own).filter(([, o]) => o.p === p.id); const done = mine.filter(([, o]) => o.lv === 3).length;
    return `<tr><td>${TITLES[k] || ''}<br><b style="font-size:16px">${p.av} ${esc(p.name)}</b><div style="font-size:12px;color:#9089A8">選修 ${mine.length} 個主題・完成發表 ${done} 個</div></td><td style="font-size:17px">${assets(p).toLocaleString()} ⚡</td></tr>`; }).join('');
  const v = await ask({ icon: '🎓', tag: '本局結算', title: `${rank[0].name} 成為本局自學大師！`, color: '#FFF6D6', ink: '#A86B00', btn: '#FFB81C',
    html: `<table>${rows}</table><div class="tip">🌱 遊戲裡的四個階段，就是真實的自主學習：<b>擬定計畫 → 每週紀錄 → 產出成果 → 成果發表</b>。現在就去圖資中心領一張申請表吧！</div>`, buttons: [{ t: '再玩一局', v: 1, main: true }] });
  if (v) openSetup();
}
function confetti(n) { if (reduceMotion) return; const box = document.createElement('div'); box.className = 'confetti'; const C = ['#FF7EB6', '#FFC23D', '#4FA8F5', '#3DD6B5', '#A78BFA']; for (let k = 0; k < n; k++) { const i = document.createElement('i'); i.style.left = Math.random() * 100 + 'vw'; i.style.background = C[k % 5]; i.style.animationDuration = 2 + Math.random() * 2 + 's'; i.style.animationDelay = Math.random() * 0.5 + 's'; box.appendChild(i); } document.body.appendChild(box); setTimeout(() => box.remove(), 4500); }

// ===================== 開場設定 =====================
function renderSetup() {
  const box = $('#slots'); box.innerHTML = '';
  setup.slots.forEach((s, k) => {
    const d = document.createElement('div'); d.className = 'slot' + (s.on ? '' : ' off'); d.style.setProperty('--pc', PCOL[k]);
    d.innerHTML = `<div class="top"><div><button class="av" title="點我換角色" type="button">${CHARS[s.av].e}</button><div class="chn">${CHARS[s.av].n.slice(-2)}</div></div><input value="${esc(s.name)}" maxlength="8" aria-label="玩家名稱" ${s.on ? '' : 'disabled'}></div>
      <div class="seg">${k < 2 ? '' : `<button type="button" data-a="off" class="${s.on ? '' : 'on'}">不參加</button>`}<button type="button" data-a="human" class="${s.on && !s.bot ? 'on' : ''}">👤 玩家</button><button type="button" data-a="bot" class="${s.on && s.bot ? 'on' : ''}">🤖 電腦</button></div>`;
    d.querySelector('.av').onclick = () => { s.av = (s.av + 1) % CHARS.length; renderSetup(); };
    d.querySelector('input').oninput = e => (s.name = e.target.value);
    d.querySelectorAll('.seg button').forEach(b => (b.onclick = () => { const a = b.dataset.a; s.on = a !== 'off'; s.bot = a === 'bot'; if (a === 'bot' && /^玩家/.test(s.name)) s.name = ['電腦小四', '電腦思思', '電腦心兒', '電腦捲毛'][k]; if (a === 'human' && /^電腦/.test(s.name)) s.name = `玩家 ${k + 1}`; renderSetup(); }));
    box.appendChild(d);
  });
  const ro = $('#roundOpts'); ro.innerHTML = '';
  [[10, '10 回合（約 15 分）'], [15, '15 回合'], [20, '20 回合'], [0, '無限制']].forEach(([v, t]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.className = setup.rounds === v ? 'on' : ''; b.onclick = () => { setup.rounds = v; renderSetup(); }; ro.appendChild(b); });
}
function openSetup() { renderSetup(); let saved = null; try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {} $('#resume').hidden = !(saved && !saved.over); $('#setup').hidden = false; }
function beginGame(state) {
  S = state; S.gid = Math.random(); $('#setup').hidden = true;
  Object.values(pawns).forEach(g => scene.remove(g)); for (const k in pawns) delete pawns[k];
  for (let i = 0; i < N; i++) refreshTile(i);
  S.ps.forEach(makePawn); placePawns(); renderPlayers(); renderLog();
  if (!S.log.length) log('🎲 遊戲開始！祝大家自學順利～');
  actx(); setTimeout(takeTurn, 400);
}
$('#start').onclick = () => { if (setup.slots.filter(s => s.on).length < 2) return toast('至少需要 2 位玩家'); beginGame(newState()); };
$('#resume').onclick = () => { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) beginGame(s); } catch (e) { toast('讀取失敗'); } };
$('#bNew').onclick = async () => { if (dlg.open) return; const v = await ask({ icon: '🔁', title: '要重新開始嗎？', html: '目前的進度會結束。', buttons: [{ t: '取消', v: 0 }, { t: '重新開始', v: 1, main: true }] }); if (v) { S.over = true; rollResolve = null; openSetup(); } };
$('#bEnd').onclick = async () => { if (dlg.open || !S || S.over) return; const v = await ask({ icon: '🏁', title: '現在就結算嗎？', html: '依總資產（能量＋主題價值）排名。', buttons: [{ t: '再玩一下', v: 0 }, { t: '結算', v: 1, main: true }] }); if (v) { rollResolve = null; endGame(); } };
$('#bRules').onclick = () => !dlg.open && ask({ icon: '📖', tag: '遊戲規則', title: '怎麼玩？', html: `<b>🎲 擲骰前進</b>：輪到你時按「擲骰子」，經過起點 +200。擲出相同點數可再擲一次。<br><b>📗 自學主題</b>：沒人選修 → 可花能量選修；自己的 → 可升級；別人的 → 支付交流費。<br><b>💡 靈感卡 / 💭 反思卡</b>：抽卡看看好習慣與壞習慣帶來的影響。<br><b>❓ 小測驗 / 🛂 審核關卡</b>：答對有能量；審核答錯要到卡關休息站。<br><b>👾 拖延怪獸</b>：支付 100 到圖書館寶庫，停在 📚 的人可以全部領走。<br><b>🏁 結束</b>：回合數到了或只剩一人時，總資產最高的人獲勝。`, buttons: [{ t: '開始玩', v: 1, main: true }] });
$('#bLegend').onclick = () => !dlg.open && ask({ icon: '🌱', tag: '主題升級＝自主學習歷程', title: '四個階段', html: `<table>${LV.map((l, k) => `<tr><td>${l.e} Lv${k} ${l.n}</td><td>交流費 ×${l.m}</td></tr>`).join('')}</table><div class="tip">真實的自主學習也是這樣：第 1-2 週擬定計畫、第 4-16 週每週紀錄、整理成果，第 17-18 週上台發表並上傳學習歷程！</div>`, buttons: [{ t: '了解', v: 1, main: true }] });

// ===================== 啟動 =====================
function loop(now) {
  for (let k = anims.length - 1; k >= 0; k--) if (anims[k](now)) anims.splice(k, 1);
  if (spin) cam.yaw += 0.0025;
  if (S && follow && !S.over && pawns[cur().id]) camFocus.lerp(new THREE.Vector3(pawns[cur().id].position.x * 0.22, 0, pawns[cur().id].position.z * 0.22 + 2.5), 0.04);
  camTarget.lerp(camFocus, 0.08);
  camera.position.set(camTarget.x + Math.sin(cam.yaw) * Math.cos(cam.pitch) * cam.dist, camTarget.y + Math.sin(cam.pitch) * cam.dist, camTarget.z + Math.cos(cam.yaw) * Math.cos(cam.pitch) * cam.dist);
  camera.lookAt(camTarget);
  tickSpinners(now / 1000);
  Object.values(pawns).forEach((g, k) => { const on = g.userData.ring.visible; g.userData.star.visible = on; if (on && g.userData.limbs && !anims.length) { g.userData.limbs.arms[1].rotation.z = 0.2 - 2.4 - Math.sin(now / 160) * 0.35; } else if (g.userData.limbs) g.userData.limbs.arms[1].rotation.z = 0.2;
  if (on) { g.userData.ring.scale.setScalar(1 + Math.sin(now / 250) * 0.08); g.userData.star.rotation.y = now / 400; g.userData.star.position.y = 6.2 + Math.sin(now / 300) * 0.3; } });

Promise.race([document.fonts ? Promise.all([document.fonts.load(`400 60px Huninn`), document.fonts.load(`900 40px "Noto Sans TC"`), document.fonts.load(`700 30px "Noto Sans TC"`)]) : 0, sleep(2500)]).then(() => {

  buildScene(); setupControls(); requestAnimationFrame(loop); openSetup();
});
window.__game = { get S() { return S; }, scene, cam, camFocus, CHAR_MODEL, linearize, THREE };
