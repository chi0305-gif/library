<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>四維自學大富翁</title>
<meta name="description" content="花蓮縣私立四維高級中學 圖書資訊中心｜擲骰子、選修主題、寫紀錄、拿成果：用大富翁玩懂自主學習。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- 3D 引擎：three.js（MIT License） -->
<style>
  :root {
    color-scheme: light;
    --ol: #2B1F3A; --ink: #2B1F3A; --ink2: #4A3D5E; --muted: #7C6F92; --line: #2B1F3A;
    --red: #FF4D6D; --orange: #FF9F1C; --yellow: #FFD60A; --green: #38D16A; --sky: #2EC4F1; --blue: #4361EE; --purple: #9B5DE5; --pink: #F15BB5;
    --round: 'Huninn', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    --bold: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: var(--round); color: var(--ink); background: #6FD3FF; }
  button { font: inherit; cursor: pointer; color: inherit; }
  #bg { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(180deg, #4CC9FF 0%, #8BE0FF 55%, #C9F3FF 100%); }
  #bg::before { content: ""; position: absolute; left: 50%; top: 55%; width: 260vmax; height: 260vmax; transform: translate(-50%, -50%); background: repeating-conic-gradient(rgba(255,255,255,.16) 0 9deg, transparent 9deg 18deg); animation: rays 80s linear infinite; }
  @keyframes rays { to { transform: translate(-50%, -50%) rotate(360deg); } }
  .cloud { position: absolute; width: 150px; height: 56px; background: #fff; border-radius: 60px; animation: float 8s ease-in-out infinite; filter: drop-shadow(4px 0 0 #2B1F3A) drop-shadow(-4px 0 0 #2B1F3A) drop-shadow(0 4px 0 #2B1F3A) drop-shadow(0 -4px 0 #2B1F3A) drop-shadow(0 6px 0 rgba(43,31,58,.2)); }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 70px; height: 66px; left: 20px; top: -34px; } .cloud::after { width: 52px; height: 50px; left: 76px; top: -22px; }
  @keyframes float { 50% { transform: translateY(-12px); } }
  #scene { position: fixed; inset: 0; touch-action: none; }
  #scene canvas { display: block; width: 100%; height: 100%; outline: none; cursor: grab; }
  .glass { background: #FFFDF5; border: 4px solid var(--ol); box-shadow: 0 6px 0 var(--ol); }
  .stroke { -webkit-text-stroke: 6px var(--ol); paint-order: stroke fill; }

  #brand { position: fixed; left: 16px; top: 12px; z-index: 20; border-radius: 22px; padding: 8px 16px 10px 10px; display: flex; gap: 10px; align-items: center; transform: rotate(-2deg); }
  #brand .logo { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 30px; background: var(--yellow); border: 4px solid var(--ol); box-shadow: inset 0 -5px 0 rgba(0,0,0,.15); animation: wob 2.4s ease-in-out infinite; }
  @keyframes wob { 50% { transform: rotate(-10deg) scale(1.06); } }
  #brand h1 { margin: 0; font: 900 clamp(20px, 2.4vw, 28px) var(--bold); color: #FFD60A; -webkit-text-stroke: 7px var(--ol); paint-order: stroke fill; letter-spacing: 1px; text-shadow: 0 4px 0 var(--ol); }
  #brand .chip { display: inline-block; margin-top: 4px; font: 900 12.5px var(--bold); padding: 2px 10px; border-radius: 999px; background: var(--sky); color: #fff; border: 3px solid var(--ol); }

  #tools { position: fixed; right: 14px; top: 14px; z-index: 20; display: grid; grid-template-columns: repeat(3, auto); gap: 8px; }
  .tb { height: 40px; padding: 0 14px; border-radius: 14px; border: 3px solid var(--ol); background: linear-gradient(180deg, #fff 0 50%, #EDE6FF 50%); box-shadow: 0 4px 0 var(--ol); font: 900 13px var(--bold); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; transition: transform .1s; }
  .tb:hover { transform: translateY(-2px); }
  .tb:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ol); }
  .tb.on { background: linear-gradient(180deg, #B8F5C9 0 50%, #7BE59B 50%); }
  .tb.hot { background: linear-gradient(180deg, #FF9FD0 0 50%, #F15BB5 50%); color: #fff; }
  #zoom { position: fixed; right: 16px; top: 120px; z-index: 20; display: flex; gap: 8px; }
  #zoom .tb { width: 42px; height: 42px; padding: 0; justify-content: center; font-size: 22px; border-radius: 50%; }

  #players { position: fixed; z-index: 20; inset: 0; pointer-events: none; }
  .pcard { position: absolute; width: 228px; border-radius: 22px; padding: 0 0 10px; pointer-events: auto; transition: transform .25s cubic-bezier(.2,1.6,.4,1); overflow: visible; background: #FFFDF5; border: 4px solid var(--ol); box-shadow: 0 7px 0 var(--ol); }
  .pcard .hd { background: var(--pc); border-bottom: 4px solid var(--ol); border-radius: 17px 17px 0 0; padding: 4px 12px 5px 72px; font: 900 15px var(--bold); color: #fff; -webkit-text-stroke: 4px var(--ol); paint-order: stroke fill; position: relative; }
  .pcard.p0 { left: 14px; top: 30%; } .pcard.p1 { right: 14px; top: 30%; } .pcard.p2 { left: 14px; top: calc(30% + 168px); } .pcard.p3 { right: 14px; top: calc(30% + 168px); }
  .pcard.turn { transform: scale(1.07) rotate(-2deg); }
  .pcard.out { opacity: .5; filter: grayscale(.8); }
  .pcard .tag { position: absolute; top: -18px; right: 10px; font: 900 13px var(--bold); padding: 2px 12px; border-radius: 999px; background: var(--yellow); color: var(--ol); border: 3px solid var(--ol); display: none; animation: bob .8s ease-in-out infinite; z-index: 2; }
  @keyframes bob { 50% { transform: translateY(-5px) rotate(3deg); } }
  .pcard.turn .tag { display: block; }
  .pcard .av { position: absolute; left: 8px; top: -14px; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 32px; background: #fff; border: 4px solid var(--ol); box-shadow: 0 4px 0 var(--ol); z-index: 1; }
  .pcard.turn .av { animation: wob 1.2s ease-in-out infinite; }
  .pcard .bd { padding: 8px 12px 0 14px; }
  .pcard .money { font: 900 26px var(--bold); line-height: 1.1; color: var(--yellow); -webkit-text-stroke: 6px var(--ol); paint-order: stroke fill; }
  .pcard .money small { font-size: 15px; }
  .pcard .sub { font: 700 12px var(--bold); color: var(--muted); margin-top: 2px; }
  .pcard .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
  .pcard .chips span { min-width: 20px; height: 20px; border-radius: 7px; font: 900 11px var(--bold); color: #fff; display: grid; place-items: center; padding: 0 3px; border: 2.5px solid var(--ol); }
  .pcard .st { font: 900 12.5px var(--bold); color: var(--red); margin-top: 4px; }

  #dock { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #turnTxt { font: 900 15px var(--bold); padding: 6px 18px; border-radius: 999px; }
  #rollBtn { position: relative; border: 5px solid var(--ol); font: 900 26px var(--bold); padding: 12px 44px; border-radius: 26px; background: linear-gradient(180deg, #FFE45C 0 48%, #FFC300 48%); color: #fff; -webkit-text-stroke: 6px var(--ol); paint-order: stroke fill; box-shadow: 0 8px 0 var(--ol), inset 0 -6px 0 rgba(0,0,0,.12); letter-spacing: 3px; }
  #rollBtn::before { content: ""; position: absolute; left: 14px; top: 8px; width: 34px; height: 10px; border-radius: 10px; background: rgba(255,255,255,.75); }
  #rollBtn:hover:not(:disabled) { transform: translateY(-3px) scale(1.04); }
  #rollBtn:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 var(--ol); }
  #rollBtn:disabled { filter: grayscale(.6); opacity: .75; cursor: default; }
  #rollBtn.pulse:not(:disabled) { animation: jelly 1.1s ease-in-out infinite; }
  @keyframes jelly { 0%, 100% { transform: scale(1); } 30% { transform: scale(1.1, .92); } 50% { transform: scale(.95, 1.07); } 70% { transform: scale(1.03, .98); } }
  #credit { font: 700 11px var(--bold); color: var(--ol); background: rgba(255,255,255,.7); padding: 1px 10px; border-radius: 999px; }

  #log { position: fixed; left: 14px; bottom: 14px; z-index: 20; width: 272px; max-height: 180px; overflow: hidden; border-radius: 20px; padding: 10px 14px; font-size: 13px; }
  #log b { display: block; font: 900 13px var(--bold); margin-bottom: 2px; }
  #log div { padding: 3px 0; border-bottom: 2px dashed #D9D0E6; line-height: 1.45; font-family: var(--bold); font-weight: 500; }
  #log div:last-child { border: 0; }
  #menuBtns { position: fixed; right: 14px; bottom: 14px; z-index: 20; display: grid; grid-template-columns: repeat(2, auto); gap: 8px; }

  #toast { position: fixed; left: 50%; top: 90px; transform: translateX(-50%) translateY(-16px) scale(.8); opacity: 0; z-index: 60; background: var(--yellow); color: var(--ol); padding: 10px 22px; border-radius: 18px; transition: all .25s cubic-bezier(.2,1.6,.4,1); pointer-events: none; white-space: nowrap; border: 4px solid var(--ol); box-shadow: 0 6px 0 var(--ol); font: 900 17px var(--bold); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  .float { position: fixed; z-index: 30; font: 900 30px var(--bold); pointer-events: none; -webkit-text-stroke: 7px var(--ol); paint-order: stroke fill; animation: up 1.5s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes up { 0% { transform: scale(.3); } 20% { transform: scale(1.3); } to { transform: translateY(-80px) scale(1); opacity: 0; } }

  dialog { border: 0; padding: 0; background: transparent; overflow: visible; max-width: calc(100vw - 20px); }
  dialog::backdrop { background: rgba(43,31,58,.35); }
  .dc { position: relative; width: min(460px, calc(100vw - 24px)); border-radius: 28px; background: #FFFDF5; border: 5px solid var(--ol); box-shadow: 0 10px 0 var(--ol); overflow: visible; animation: pop .35s cubic-bezier(.2,1.7,.4,1); }
  @keyframes pop { from { transform: scale(.5) rotate(-6deg); opacity: 0; } }
  .dh { padding: 16px 18px 14px 96px; background: var(--dbtn, var(--purple)); display: flex; gap: 14px; align-items: center; border-bottom: 5px solid var(--ol); border-radius: 22px 22px 0 0; position: relative; min-height: 82px; }
  .dh .ic { position: absolute; left: 12px; top: -22px; width: 72px; height: 72px; border-radius: 22px; background: #fff; display: grid; place-items: center; font-size: 40px; border: 5px solid var(--ol); box-shadow: 0 5px 0 var(--ol); animation: wob 1.8s ease-in-out infinite; }
  .dh small { font: 900 13px var(--bold); color: #fff; opacity: .95; }
  .dh h2 { margin: 2px 0 0; font: 900 23px var(--bold); line-height: 1.25; color: #fff; -webkit-text-stroke: 6px var(--ol); paint-order: stroke fill; }
  .db { padding: 14px 22px 6px; font: 500 15px var(--bold); line-height: 1.75; color: var(--ink2); max-height: 52vh; overflow-y: auto; }
  .db b { color: var(--ink); font-weight: 900; }
  .db .tip { background: #FFF3C4; border: 3px solid var(--ol); border-radius: 16px; padding: 8px 12px; margin-top: 10px; font-size: 13.5px; }
  .db table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 8px; }
  .db td { padding: 5px 6px; border-bottom: 2px dashed #D9D0E6; }
  .db td:last-child { text-align: right; font-weight: 900; }
  .df { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; padding: 12px 20px 20px; }
  .df .b { border: 4px solid var(--ol); border-radius: 16px; padding: 9px 20px; font: 900 16px var(--bold); background: linear-gradient(180deg, #fff 0 50%, #EDE6FF 50%); color: var(--ink); box-shadow: 0 5px 0 var(--ol); transition: transform .1s; }
  .df .b:hover:not(:disabled) { transform: translateY(-2px); }
  .df .b:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ol); }
  .df .b.main { background: var(--dbtn, var(--purple)); color: #fff; -webkit-text-stroke: 5px var(--ol); paint-order: stroke fill; }
  .df.col { flex-direction: column; } .df.col .b { text-align: left; font-size: 14.5px; -webkit-text-stroke: 0; }
  .bot { font: 700 13px var(--bold); color: var(--muted); padding: 0 22px 16px; text-align: right; }
  .card3d { margin: 4px auto 0; width: 240px; border-radius: 22px; padding: 18px; text-align: center; color: #fff; font: 900 17px var(--bold); line-height: 1.6; animation: flip .6s cubic-bezier(.2,1.5,.4,1); border: 5px solid var(--ol); box-shadow: 0 6px 0 var(--ol); -webkit-text-stroke: 5px var(--ol); paint-order: stroke fill; }
  @keyframes flip { from { transform: rotateY(180deg) scale(.5); } }

  #setup { position: fixed; inset: 0; z-index: 50; display: grid; padding: 16px; background: rgba(43,31,58,.25); overflow-y: auto; }
  #setup[hidden] { display: none; }
  .sc { margin: auto; width: min(800px, 100%); border-radius: 32px; padding: 24px 24px 24px; background: #FFFDF5; border: 5px solid var(--ol); box-shadow: 0 12px 0 var(--ol); }
  .sc h2 { margin: 0; font: 900 clamp(30px, 5vw, 46px) var(--bold); color: var(--yellow); -webkit-text-stroke: 9px var(--ol); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ol); letter-spacing: 2px; }
  .sc .lead { color: var(--ink2); margin: 8px 0 16px; line-height: 1.8; font: 500 15px var(--bold); }
  .sc .lead b { font-weight: 900; color: var(--ink); }
  .how { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 165px), 1fr)); gap: 10px; margin-bottom: 16px; }
  .how div { border: 3px solid var(--ol); border-radius: 18px; padding: 10px 12px; font: 500 13px var(--bold); color: var(--ink2); box-shadow: 0 4px 0 var(--ol); }
  .how div:nth-child(1) { background: #FFF3C4; } .how div:nth-child(2) { background: #D7F5FF; } .how div:nth-child(3) { background: #DFFBE6; } .how div:nth-child(4) { background: #FFE0F1; }
  .how b { display: block; font: 900 15px var(--bold); color: var(--ink); }
  .slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; margin-bottom: 14px; }
  .slot { border: 4px solid var(--ol); border-radius: 22px; padding: 10px; display: grid; gap: 7px; background: #fff; box-shadow: 0 5px 0 var(--ol); border-top: 14px solid var(--pc); }
  .slot.off { opacity: .45; }
  .slot .top { display: flex; gap: 8px; align-items: center; }
  .slot .av { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; background: #fff; border: 4px solid var(--ol); box-shadow: 0 3px 0 var(--ol); flex: 0 0 auto; }
  .slot .chn { font: 900 12px var(--bold); text-align: center; margin-top: 2px; }
  .slot input { width: 100%; border: 3px solid var(--ol); border-radius: 12px; padding: 6px 8px; font: 700 15px var(--bold); }
  .slot .seg { display: flex; gap: 4px; }
  .slot .seg button { flex: 1; border: 3px solid var(--ol); background: #fff; border-radius: 12px; padding: 4px 0; font: 900 12.5px var(--bold); }
  .slot .seg button.on { background: var(--pc); color: #fff; -webkit-text-stroke: 3px var(--ol); paint-order: stroke fill; }
  .opts2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; font: 900 15px var(--bold); }
  .opts2 button { border: 3px solid var(--ol); background: #fff; border-radius: 999px; padding: 5px 14px; font: 900 14px var(--bold); box-shadow: 0 3px 0 var(--ol); }
  .opts2 button.on { background: var(--sky); color: #fff; -webkit-text-stroke: 3px var(--ol); paint-order: stroke fill; }
  .go { border: 5px solid var(--ol); font: 900 24px var(--bold); padding: 12px 36px; border-radius: 22px; background: linear-gradient(180deg, #7DF09A 0 48%, #38D16A 48%); color: #fff; -webkit-text-stroke: 6px var(--ol); paint-order: stroke fill; box-shadow: 0 8px 0 var(--ol); }
  .go:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ol); }
  .go.alt { background: linear-gradient(180deg, #fff 0 48%, #EDE6FF 48%); color: var(--ink); -webkit-text-stroke: 0; font-size: 19px; }
  .gos { display: flex; gap: 12px; flex-wrap: wrap; }

  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
  .confetti i { position: absolute; top: -20px; width: 13px; height: 17px; border-radius: 4px; border: 2.5px solid var(--ol); animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  @media (max-width: 760px) {
    #brand { left: 8px; top: 8px; padding: 5px 10px 6px 6px; border-radius: 16px; gap: 6px; border-width: 3px; } #brand .logo { width: 36px; height: 36px; font-size: 20px; border-width: 3px; } #brand h1 { font-size: 17px; -webkit-text-stroke: 5px var(--ol); } #brand .chip { font-size: 11px; }
    #tools { right: 8px; top: 10px; grid-template-columns: repeat(3, auto); gap: 4px; } .tb { height: 32px; padding: 0 8px; font-size: 12px; border-width: 2.5px; } .tb .t { display: none; }
    #zoom { top: auto; bottom: 170px; right: 8px; flex-direction: column; } #zoom .tb { width: 36px; height: 36px; }
    .pcard { width: calc(50vw - 14px); border-width: 3px; box-shadow: 0 4px 0 var(--ol); }
    .pcard .hd { padding: 3px 8px 3px 50px; font-size: 12px; } .pcard .av { width: 40px; height: 40px; font-size: 22px; top: -10px; left: 4px; border-width: 3px; }
    .pcard.p0 { left: 8px; top: 92px; } .pcard.p1 { right: 8px; top: 92px; left: auto; } .pcard.p2 { left: 8px; top: 166px; } .pcard.p3 { right: 8px; top: 166px; }
    .pcard .money { font-size: 19px; -webkit-text-stroke: 5px var(--ol); } .pcard .sub, .pcard .chips { display: none; } .pcard .bd { padding: 4px 8px 0; }
    #log, .cloud { display: none; } #menuBtns { bottom: 8px; right: 8px; grid-template-columns: 1fr; } #menuBtns .tb { height: 30px; }
    #dock { bottom: 14px; } #rollBtn { font-size: 21px; padding: 10px 32px; } #turnTxt { font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="bg"><div class="cloud" style="left:5%;top:14%"></div><div class="cloud" style="right:20%;top:8%;animation-delay:-3s;transform:scale(.8)"></div><div class="cloud" style="left:24%;bottom:10%;animation-delay:-5s;transform:scale(.7)"></div><div class="cloud" style="right:6%;bottom:34%;animation-delay:-2s"></div></div>
<div id="scene" aria-label="3D 大富翁棋盤：拖曳旋轉、滾輪或雙指縮放、點格子看說明"></div>

<header id="brand" class="glass"><span class="logo">🎲</span><div><h1>四維自學大富翁</h1><span class="chip" id="roundChip">第 1 回合</span></div></header>
<nav id="tools" aria-label="工具">
  <button class="tb" id="bFull">⛶<span class="t"> 全螢幕</span></button>
  <button class="tb" id="bSfx">🔊<span class="t"> 音效：開</span></button>
  <button class="tb" id="bBgm">🎵<span class="t"> 音樂：關</span></button>
  <button class="tb" id="bReset">🎥<span class="t"> 重設視角</span></button>
  <button class="tb" id="bSpin">🔄<span class="t"> 旋轉模式</span></button>
  <button class="tb hot" id="bFollow">📌<span class="t"> 視角跟隨</span></button>
</nav>
<div id="zoom"><button class="tb" id="zIn" aria-label="放大">＋</button><button class="tb" id="zOut" aria-label="縮小">－</button></div>
<div id="players"></div>
<div id="dock">
  <div id="turnTxt" class="glass">準備開始</div>
  <button id="rollBtn" disabled>🎲 擲骰子</button>
  <div id="credit">四維高中圖書資訊中心・自主學習推廣</div>
</div>
<div id="log" class="glass"><b>📜 遊戲紀錄</b><div id="logList"></div></div>
<div id="menuBtns">
  <button class="tb" id="bRules">📖 規則說明</button>
  <button class="tb" id="bLegend">🌱 升級說明</button>
  <button class="tb" id="bNew">🔁 重新開始</button>
  <button class="tb" id="bEnd">🏁 結算遊戲</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="setup">
  <div class="sc">
    <h2>四維自學大富翁 🎲</h2>
    <p class="lead">擲骰子走遍校園，把<b>因材網、磨課師、WebPAC</b> 等自學資源加入你的計畫，一路<b>寫紀錄、產出成果、上台發表</b>！<br>同學走到你的主題，要向你「請教」並支付交流能量。遊戲結束時，總能量最高的人就是本局的<b>自學大師</b>。</p>
    <div class="how">
      <div><b>🎲 擲骰前進</b>經過「擬定計畫」可領 200 學習能量</div>
      <div><b>💻 自學資源</b>選修因材網、磨課師、WebPAC 等平台，再回來就能升級</div>

const TITLES = ['🏆 自學大師', '🥈 深耕達人', '🥉 好奇探險家', '🌱 潛力新星'];
async function endGame() {
  S.over = true; save(); renderPlayers(); rollBtn.disabled = true; $('#turnTxt').textContent = '遊戲結束！';
  const rank = S.ps.slice().sort((a, b) => assets(b) - assets(a)); SFX.win(); confetti(100);
  const rows = rank.map((p, k) => { const mine = Object.entries(S.own).filter(([, o]) => o.p === p.id); const done = mine.filter(([, o]) => o.lv === 3).length;
    return `<tr><td>${TITLES[k] || ''}<br><b style="font-size:16px">${p.av} ${esc(p.name)}</b><div style="font-size:12px;color:#9089A8">選修 ${mine.length} 個主題・完成發表 ${done} 個</div></td><td style="font-size:17px">${assets(p).toLocaleString()} ⚡</td></tr>`; }).join('');
  const v = await ask({ icon: '🎓', tag: '本局結算', title: `${rank[0].name} 成為本局自學大師！`, color: '#FFF6D6', ink: '#A86B00', btn: '#FFB81C',
    html: `<table>${rows}</table><div class="tip">🌱 遊戲裡的四個階段，就是真實的自主學習：<b>擬定計畫 → 每週紀錄 → 產出成果 → 成果發表</b>。現在就去圖資中心領一張申請表吧！</div>`, buttons: [{ t: '再玩一局', v: 1, main: true }] });
  if (v) openSetup();
}
function confetti(n) { if (reduceMotion) return; const box = document.createElement('div'); box.className = 'confetti'; const C = ['#FF7EB6', '#FFC23D', '#4FA8F5', '#3DD6B5', '#A78BFA']; for (let k = 0; k < n; k++) { const i = document.createElement('i'); i.style.left = Math.random() * 100 + 'vw'; i.style.background = C[k % 5]; i.style.animationDuration = 2 + Math.random() * 2 + 's'; i.style.animationDelay = Math.random() * 0.5 + 's'; box.appendChild(i); } document.body.appendChild(box); setTimeout(() => box.remove(), 4500); }

// ===================== 開場設定 =====================
function renderSetup() {
  const box = $('#slots'); box.innerHTML = '';
  setup.slots.forEach((s, k) => {
    const d = document.createElement('div'); d.className = 'slot' + (s.on ? '' : ' off'); d.style.setProperty('--pc', PCOL[k]);
    d.innerHTML = `<div class="top"><div><button class="av" title="點我換角色" type="button">${CHARS[s.av].e}</button><div class="chn">${CHARS[s.av].n.slice(-2)}</div></div><input value="${esc(s.name)}" maxlength="8" aria-label="玩家名稱" ${s.on ? '' : 'disabled'}></div>
      <div class="seg">${k < 2 ? '' : `<button type="button" data-a="off" class="${s.on ? '' : 'on'}">不參加</button>`}<button type="button" data-a="human" class="${s.on && !s.bot ? 'on' : ''}">👤 玩家</button><button type="button" data-a="bot" class="${s.on && s.bot ? 'on' : ''}">🤖 電腦</button></div>`;
    d.querySelector('.av').onclick = () => { s.av = (s.av + 1) % CHARS.length; renderSetup(); };
    d.querySelector('input').oninput = e => (s.name = e.target.value);
    d.querySelectorAll('.seg button').forEach(b => (b.onclick = () => { const a = b.dataset.a; s.on = a !== 'off'; s.bot = a === 'bot'; if (a === 'bot' && /^玩家/.test(s.name)) s.name = ['電腦小四', '電腦思思', '電腦心兒', '電腦捲毛'][k]; if (a === 'human' && /^電腦/.test(s.name)) s.name = `玩家 ${k + 1}`; renderSetup(); }));
    box.appendChild(d);
  });
  const ro = $('#roundOpts'); ro.innerHTML = '';
  [[10, '10 回合（約 15 分）'], [15, '15 回合'], [20, '20 回合'], [0, '無限制']].forEach(([v, t]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.className = setup.rounds === v ? 'on' : ''; b.onclick = () => { setup.rounds = v; renderSetup(); }; ro.appendChild(b); });
}
function openSetup() { renderSetup(); let saved = null; try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {} $('#resume').hidden = !(saved && !saved.over); $('#setup').hidden = false; }
function beginGame(state) {
  S = state; S.gid = Math.random(); $('#setup').hidden = true;
  Object.values(pawns).forEach(g => scene.remove(g)); for (const k in pawns) delete pawns[k];
  for (let i = 0; i < N; i++) refreshTile(i);
  S.ps.forEach(makePawn); placePawns(); renderPlayers(); renderLog();
  if (!S.log.length) log('🎲 遊戲開始！祝大家自學順利～');
  actx(); setTimeout(takeTurn, 400);
}
$('#start').onclick = () => { if (setup.slots.filter(s => s.on).length < 2) return toast('至少需要 2 位玩家'); if (!bgmOn) setBgm(true); beginGame(newState()); };
$('#resume').onclick = () => { if (!bgmOn) setBgm(true); try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) beginGame(s); } catch (e) { toast('讀取失敗'); } };
$('#bNew').onclick = async () => { if (dlg.open) return; const v = await ask({ icon: '🔁', title: '要重新開始嗎？', html: '目前的進度會結束。', buttons: [{ t: '取消', v: 0 }, { t: '重新開始', v: 1, main: true }] }); if (v) { S.over = true; rollResolve = null; openSetup(); } };
$('#bEnd').onclick = async () => { if (dlg.open || !S || S.over) return; const v = await ask({ icon: '🏁', title: '現在就結算嗎？', html: '依總資產（能量＋主題價值）排名。', buttons: [{ t: '再玩一下', v: 0 }, { t: '結算', v: 1, main: true }] }); if (v) { rollResolve = null; endGame(); } };
$('#bRules').onclick = () => !dlg.open && ask({ icon: '📖', tag: '遊戲規則', title: '怎麼玩？', html: `<b>🎲 擲骰前進</b>：輪到你時按「擲骰子」，經過起點 +200。擲出相同點數可再擲一次。<br><b>📗 自學主題</b>：沒人選修 → 可花能量選修；自己的 → 可升級；別人的 → 支付交流費。<br><b>💡 靈感卡 / 💭 反思卡</b>：抽卡看看好習慣與壞習慣帶來的影響。<br><b>❓ 小測驗 / 🛂 審核關卡</b>：答對有能量；審核答錯要到卡關休息站。<br><b>👾 拖延怪獸</b>：支付 100 到圖書館寶庫，停在 📚 的人可以全部領走。<br><b>🏁 結束</b>：回合數到了或只剩一人時，總資產最高的人獲勝。`, buttons: [{ t: '開始玩', v: 1, main: true }] });
$('#bLegend').onclick = () => !dlg.open && ask({ icon: '🌱', tag: '主題升級＝自主學習歷程', title: '四個階段', html: `<table>${LV.map((l, k) => `<tr><td>${l.e} Lv${k} ${l.n}</td><td>交流費 ×${l.m}</td></tr>`).join('')}</table><div class="tip">真實的自主學習也是這樣：第 1-2 週擬定計畫、第 4-16 週每週紀錄、整理成果，第 17-18 週上台發表並上傳學習歷程！</div>`, buttons: [{ t: '了解', v: 1, main: true }] });

// ===================== 啟動 =====================
function loop(now) {
  for (let k = anims.length - 1; k >= 0; k--) if (anims[k](now)) anims.splice(k, 1);
  if (spin) cam.yaw += 0.0025;
  if (S && follow && !S.over && pawns[cur().id]) camFocus.lerp(new THREE.Vector3(pawns[cur().id].position.x * 0.22, 0, pawns[cur().id].position.z * 0.22 + 2.5), 0.04);
  camTarget.lerp(camFocus, 0.08);
  camera.position.set(camTarget.x + Math.sin(cam.yaw) * Math.cos(cam.pitch) * cam.dist, camTarget.y + Math.sin(cam.pitch) * cam.dist, camTarget.z + Math.cos(cam.yaw) * Math.cos(cam.pitch) * cam.dist);
  camera.lookAt(camTarget);
  tickSpinners(now / 1000);
  Object.values(pawns).forEach((g, k) => { const on = g.userData.ring.visible; g.userData.star.visible = on; if (on) { g.userData.ring.scale.setScalar(1 + Math.sin(now / 250) * 0.08); g.userData.star.rotation.y = now / 400; g.userData.star.position.y = 5.2 + Math.sin(now / 300) * 0.3; } });
  renderer.render(scene, camera); requestAnimationFrame(loop);
}
addEventListener('resize', () => { camera.fov = narrow() ? 55 : 38; camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
Promise.race([document.fonts ? Promise.all([document.fonts.load(`400 60px Huninn`), document.fonts.load(`900 40px "Noto Sans TC"`), document.fonts.load(`700 30px "Noto Sans TC"`)]) : 0, sleep(2500)]).then(() => {
  if (!renderer) { document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;inset:0;display:grid;place-items:center;z-index:99;background:#fff;padding:20px;text-align:center">這台裝置無法顯示 3D 棋盤，請改用電腦或較新的手機瀏覽器開啟。</div>'); return; }
  buildScene(); setupControls(); requestAnimationFrame(loop); openSetup();
});
window.__game = { get S() { return S; }, scene };
})();
</script>
</body>
